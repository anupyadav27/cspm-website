<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060B18"/>
      <stop offset="100%" stop-color="#0D1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow blobs -->
  <circle cx="200" cy="200" r="300" fill="#6366F1" opacity="0.08" filter="url(#blur)"/>
  <circle cx="900" cy="450" r="250" fill="#22D3EE" opacity="0.05" filter="url(#blur)"/>

  <!-- Dot grid pattern -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="white" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Shield logo mark -->
  <g transform="translate(80, 60)">
    <path d="M40 4 L72 16 L72 44 C72 60 56 72 40 76 C24 72 8 60 8 44 L8 16 Z" fill="url(#accent)" opacity="0.9"/>
    <circle cx="40" cy="38" r="12" fill="none" stroke="white" stroke-width="3"/>
    <line x1="40" y1="26" x2="40" y2="21" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="156" y="108" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800" fill="white" letter-spacing="-1">Onam Security</text>

  <!-- Divider -->
  <rect x="80" y="130" width="120" height="2" rx="1" fill="url(#accent)"/>

  <!-- Main headline -->
  <text x="80" y="240" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-2">Unified Cloud Security</text>
  <text x="80" y="318" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="800" letter-spacing="-2">
    <tspan fill="url(#accent)">for every cloud, every team.</tspan>
  </text>

  <!-- Subline -->
  <text x="80" y="390" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#94A3B8" letter-spacing="-0.5">10,000+ rules · 16+ engines · 7 clouds · 13 frameworks · 100% agentless</text>

  <!-- Stat pills -->
  <g transform="translate(80, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="52" rx="10" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="16" y="22" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">847</text>
    <text x="16" y="40" font-family="Arial,sans-serif" font-size="11" fill="#94A3B8">avg findings first scan</text>

    <!-- Pill 2 -->
    <rect x="196" y="0" width="180" height="52" rx="10" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="212" y="22" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">&lt; 8 min</text>
    <text x="212" y="40" font-family="Arial,sans-serif" font-size="11" fill="#94A3B8">to first critical alert</text>

    <!-- Pill 3 -->
    <rect x="392" y="0" width="200" height="52" rx="10" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <text x="408" y="22" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">48 hrs</text>
    <text x="408" y="40" font-family="Arial,sans-serif" font-size="11" fill="#94A3B8">SOC 2 audit prep</text>
  </g>

  <!-- Right side — security dashboard illustration -->
  <g transform="translate(730, 120)">
    <!-- Panel background -->
    <rect x="0" y="0" width="390" height="390" rx="16" fill="white" fill-opacity="0.03" stroke="white" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="390" height="44" rx="16" fill="white" fill-opacity="0.05"/>
    <rect x="0" y="28" width="390" height="16" fill="white" fill-opacity="0.05"/>
    <circle cx="20" cy="22" r="5" fill="#EF4444" opacity="0.7"/>
    <circle cx="36" cy="22" r="5" fill="#F59E0B" opacity="0.7"/>
    <circle cx="52" cy="22" r="5" fill="#10B981" opacity="0.7"/>
    <text x="80" y="27" font-family="monospace" font-size="11" fill="#94A3B8">Onam Security Platform</text>

    <!-- Risk score circle -->
    <circle cx="195" cy="140" r="55" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="10"/>
    <circle cx="195" cy="140" r="55" fill="none" stroke="url(#accent)" stroke-width="3"
      stroke-dasharray="240" stroke-dashoffset="80" stroke-linecap="round"
      transform="rotate(-90 195 140)"/>
    <text x="195" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="white">68</text>
    <text x="195" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">Risk Score</text>

    <!-- Finding rows -->
    <rect x="16" y="215" width="358" height="32" rx="6" fill="white" fill-opacity="0.04"/>
    <circle cx="34" cy="231" r="5" fill="#EF4444"/>
    <rect x="48" y="225" width="120" height="8" rx="3" fill="white" fill-opacity="0.25"/>
    <rect x="48" y="237" width="80" height="5" rx="2" fill="white" fill-opacity="0.1"/>
    <rect x="310" y="227" width="48" height="8" rx="4" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-opacity="0.4" stroke-width="0.5"/>
    <text x="334" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#EF4444">CRITICAL</text>

    <rect x="16" y="255" width="358" height="32" rx="6" fill="white" fill-opacity="0.02"/>
    <circle cx="34" cy="271" r="5" fill="#F59E0B"/>
    <rect x="48" y="265" width="140" height="8" rx="3" fill="white" fill-opacity="0.2"/>
    <rect x="48" y="277" width="90" height="5" rx="2" fill="white" fill-opacity="0.08"/>
    <rect x="316" y="267" width="40" height="8" rx="4" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="0.5"/>
    <text x="336" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#F59E0B">HIGH</text>

    <rect x="16" y="295" width="358" height="32" rx="6" fill="white" fill-opacity="0.02"/>
    <circle cx="34" cy="311" r="5" fill="#F59E0B"/>
    <rect x="48" y="305" width="100" height="8" rx="3" fill="white" fill-opacity="0.15"/>
    <rect x="48" y="317" width="70" height="5" rx="2" fill="white" fill-opacity="0.07"/>
    <rect x="316" y="307" width="40" height="8" rx="4" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="0.5"/>
    <text x="336" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#F59E0B">HIGH</text>

    <!-- Bottom bar -->
    <text x="16" y="368" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">847 findings</text>
    <circle cx="102" cy="364" r="3" fill="#94A3B8" opacity="0.4"/>
    <text x="112" y="368" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">12 critical</text>
    <circle cx="178" cy="364" r="3" fill="#94A3B8" opacity="0.4"/>
    <text x="188" y="368" font-family="Arial,sans-serif" font-size="10" fill="#94A3B8">scan: 4m 38s</text>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="622" width="1200" height="8" rx="0" fill="url(#accent)" opacity="0.6"/>
</svg>
