<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 465" width="792" height="465" font-family="Inter, 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a framework score is calculated</title>
  <desc id="d">Applicable rules are evaluated against every resource in scope; each result is a pass, a fail or not applicable; the framework score is passes divided by passes plus fails, times 100, banded into compliant, partially compliant and non-compliant.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
  <rect width="792" height="465" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="396.0" y="28.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="1">FRAMEWORK SCORING: HOW THE PLATFORM CALCULATES POSTURE</text>
  <line x1="16.0" y1="40.0" x2="776.0" y2="40.0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="12.0" y="52.0" width="241.3" height="369.8" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="132.7" y="74.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="0.6">INPUT AND EVALUATION</text>
  <line x1="20.0" y1="84.0" x2="245.3" y2="84.0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="20.0" y="94.0" width="225.3" height="71.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="132.7" y="116.0" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Applicable rules</text>
  <text x="132.7" y="136.9" font-size="12" fill="#475569" text-anchor="middle">The rule definitions (of 11,856) that</text>
  <text x="132.7" y="153.0" font-size="12" fill="#475569" text-anchor="middle">apply to this framework</text>
  <rect x="20.0" y="173.1" width="225.3" height="55.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="132.7" y="195.1" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Evaluate each rule</text>
  <text x="132.7" y="216.0" font-size="12" fill="#475569" text-anchor="middle">against each resource in scope</text>
  <rect x="20.0" y="236.1" width="225.3" height="71.1" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="132.7" y="258.1" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">EXAMPLE: PCI DSS v4.0</text>
  <text x="132.7" y="279.0" font-size="12" fill="#475569" text-anchor="middle">145 rules apply × 3,400 resources =</text>
  <text x="132.7" y="295.1" font-size="12" fill="#475569" text-anchor="middle">493,000 evaluations</text>
  <rect x="275.3" y="52.0" width="241.3" height="369.8" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="396.0" y="74.0" font-size="12" fill="#1D4ED8" text-anchor="middle" font-weight="700">OUTCOME PER RESOURCE × RULE</text>
  <line x1="283.3" y1="84.0" x2="508.7" y2="84.0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="283.3" y="94.0" width="225.3" height="71.1" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
  <text x="396.0" y="116.0" font-size="13" fill="#15803D" text-anchor="middle" font-weight="700">✓ PASS</text>
  <text x="396.0" y="136.9" font-size="12" fill="#475569" text-anchor="middle">The resource satisfies the rule: adds</text>
  <text x="396.0" y="153.0" font-size="12" fill="#475569" text-anchor="middle">to the pass count, no finding</text>
  <rect x="283.3" y="173.1" width="225.3" height="87.2" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
  <text x="396.0" y="195.1" font-size="13" fill="#B91C1C" text-anchor="middle" font-weight="700">✕ FAIL</text>
  <text x="396.0" y="216.0" font-size="12" fill="#475569" text-anchor="middle">The resource violates the rule: adds</text>
  <text x="396.0" y="232.1" font-size="12" fill="#475569" text-anchor="middle">to the fail count, a finding is created</text>
  <text x="396.0" y="248.2" font-size="12" fill="#475569" text-anchor="middle">with its severity</text>
  <rect x="283.3" y="268.3" width="225.3" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="396.0" y="290.3" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">– NOT APPLICABLE</text>
  <text x="396.0" y="311.2" font-size="12" fill="#475569" text-anchor="middle">The rule does not apply to this</text>
  <text x="396.0" y="327.3" font-size="12" fill="#475569" text-anchor="middle">resource type or context: left out of</text>
  <text x="396.0" y="343.4" font-size="12" fill="#475569" text-anchor="middle">the score</text>
  <text x="396.0" y="375.5" font-size="12" fill="#475569" text-anchor="middle">Suppressed findings, each with a</text>
  <text x="396.0" y="391.6" font-size="12" fill="#475569" text-anchor="middle">documented reason, are tracked</text>
  <text x="396.0" y="407.7" font-size="12" fill="#475569" text-anchor="middle">separately and left out of the score.</text>
  <rect x="538.7" y="52.0" width="241.3" height="369.8" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="659.3" y="74.0" font-size="12" fill="#1D4ED8" text-anchor="middle" font-weight="700">FRAMEWORK SCORE AND STATUS</text>
  <line x1="546.7" y1="84.0" x2="772.0" y2="84.0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="546.7" y="94.0" width="225.3" height="51.8" rx="8" fill="#EFF4FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="659.3" y="116.0" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Score = PASS ÷ (PASS + FAIL)</text>
  <text x="659.3" y="132.9" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">× 100</text>
  <rect x="546.7" y="153.8" width="225.3" height="55.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="659.3" y="175.8" font-size="13" fill="#15803D" text-anchor="middle" font-weight="700">● 80% or more</text>
  <text x="659.3" y="196.7" font-size="12" fill="#475569" text-anchor="middle">Compliant: audit-ready</text>
  <rect x="546.7" y="216.8" width="225.3" height="55.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="659.3" y="238.8" font-size="13" fill="#B45309" text-anchor="middle" font-weight="700">● 60 to 79%</text>
  <text x="659.3" y="259.7" font-size="12" fill="#475569" text-anchor="middle">Partially compliant</text>
  <rect x="546.7" y="279.8" width="225.3" height="55.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="659.3" y="301.8" font-size="13" fill="#B91C1C" text-anchor="middle" font-weight="700">● Below 60%</text>
  <text x="659.3" y="322.7" font-size="12" fill="#475569" text-anchor="middle">Non-compliant: gaps to fix</text>
  <text x="659.3" y="354.8" font-size="12" fill="#475569" text-anchor="middle">Recalculated after every scan; the trend</text>
  <text x="659.3" y="370.9" font-size="12" fill="#475569" text-anchor="middle">is kept over time.</text>
  <line x1="256.3" y1="236.9" x2="272.3" y2="236.9" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="519.7" y1="236.9" x2="535.7" y2="236.9" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="396.0" y="445.8" font-size="12" fill="#475569" text-anchor="middle">144 compliance frameworks: 119 with automated checks, 25 attestation-only.</text>
</svg>
