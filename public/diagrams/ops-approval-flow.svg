<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Onam Operations — approval lifecycle</title>
  <desc id="d">A proposal is classified by policy and waits as pending. An approver can simulate, modify, reject with a reason, or approve. Approval binds to the change's hash and expires; critical changes need a second, distinct approver. Before execution the target is re-read; if it drifted, the approval is superseded and must be requested again.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="960" height="330" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="30" y="34" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="1.4">APPROVAL · BOUND TO ONE EXACT CHANGE</text>

  <g font-size="11" text-anchor="middle">
    <rect x="30" y="64" width="130" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="95" y="88" font-weight="700" fill="#0B1220" font-size="12">Proposal</text><text x="95" y="106" fill="#475569">change + rollback</text>
    <line x1="160" y1="93" x2="186" y2="93" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="188" y="64" width="150" height="58" rx="8" fill="#EFF4FF" stroke="#2563EB"/>
    <text x="263" y="88" font-weight="700" fill="#1E3A8A" font-size="12">Risk class</text><text x="263" y="106" fill="#334155">set by policy, never lowered</text>
    <line x1="338" y1="93" x2="364" y2="93" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="366" y="56" width="190" height="74" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="461" y="80" font-weight="700" fill="#9A3412" font-size="12.5">Pending</text>
    <text x="461" y="98" fill="#7C2D12">in the approval centre,</text><text x="461" y="113" fill="#7C2D12">diff first</text>
    <line x1="556" y1="93" x2="582" y2="93" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="584" y="56" width="160" height="74" rx="8" fill="#16A34A"/>
    <text x="664" y="80" font-weight="700" fill="#FFFFFF" font-size="12.5">Approved</text>
    <text x="664" y="98" fill="#ECFDF5">bound to change hash</text><text x="664" y="113" fill="#ECFDF5">expires after 7 days</text>
    <line x1="744" y1="93" x2="770" y2="93" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="772" y="56" width="158" height="74" rx="8" fill="#FFFFFF" stroke="#334155"/>
    <text x="851" y="80" font-weight="700" fill="#0B1220" font-size="12.5">Drift check</text>
    <text x="851" y="98" fill="#475569">target re-read just</text><text x="851" y="113" fill="#475569">before execution</text>
  </g>

  <!-- decisions -->
  <g font-size="11">
    <text x="366" y="162" font-weight="700" fill="#334155">THE FOUR DECISIONS</text>
    <rect x="366" y="172" width="208" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="376" y="189" fill="#0B1220"><tspan font-weight="700">Simulate</tspan> — dry run, no side effect</text>
    <rect x="366" y="204" width="208" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="376" y="221" fill="#0B1220"><tspan font-weight="700">Modify</tspan> — within bounds, re-classified</text>
    <rect x="366" y="236" width="208" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="376" y="253" fill="#0B1220"><tspan font-weight="700">Reject</tspan> — a reason is mandatory</text>
    <rect x="366" y="268" width="208" height="26" rx="5" fill="#ECFDF5" stroke="#16A34A"/><text x="376" y="285" fill="#065F46"><tspan font-weight="700">Approve</tspan> — a named person</text>
    <line x1="461" y1="130" x2="461" y2="148" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>

  <g font-size="11">
    <rect x="584" y="160" width="160" height="62" rx="8" fill="#FFFFFF" stroke="#16A34A"/>
    <text x="664" y="182" text-anchor="middle" font-weight="700" fill="#065F46">Critical risk</text>
    <text x="664" y="198" text-anchor="middle" fill="#334155">two distinct approvers,</text>
    <text x="664" y="213" text-anchor="middle" fill="#334155">one an organisation admin</text>
    <line x1="664" y1="130" x2="664" y2="158" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3"/>

    <line x1="851" y1="130" x2="851" y2="158" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="772" y="160" width="158" height="44" rx="8" fill="#DC2626"/>
    <text x="851" y="178" text-anchor="middle" font-weight="700" fill="#FFFFFF">unchanged → execute</text>
    <text x="851" y="194" text-anchor="middle" fill="#FEE2E2">in the sandbox</text>
    <rect x="772" y="214" width="158" height="44" rx="8" fill="#FFFFFF" stroke="#B45309"/>
    <text x="851" y="232" text-anchor="middle" font-weight="700" fill="#92400E">changed → superseded</text>
    <text x="851" y="248" text-anchor="middle" fill="#92400E">ask for approval again</text>
  </g>

  <g font-size="11">
    <text x="30" y="162" font-weight="700" fill="#334155">WHAT MAKES IT REAL</text>
    <text x="30" y="184" fill="#475569">• The approver sees the rollback first.</text>
    <text x="30" y="204" fill="#475569">• Approving one change cannot</text>
    <text x="40" y="219" fill="#475569">authorise a different one.</text>
    <text x="30" y="239" fill="#475569">• An approval link in an email only</text>
    <text x="40" y="254" fill="#475569">opens the workspace; it never decides.</text>
    <text x="30" y="274" fill="#475569">• Review time is measured, so rubber-</text>
    <text x="40" y="289" fill="#475569">stamping shows up for admins.</text>
  </g>
  <text x="30" y="318" font-size="10.5" fill="#64748B">The approval centre is in early access. Executing an approved change in a customer cloud is on the roadmap.</text>
</svg>
