  <line x1="634.0" y1="254.0" x2="660.0" y2="254.0" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="662.0" y="230.0" width="100.0" height="48.0" rx="24.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.3"/>
