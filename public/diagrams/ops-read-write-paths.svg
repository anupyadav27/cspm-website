  <text x="712.0" y="266.5" font-size="12" fill="#312E81" text-anchor="middle">by policy</text>
  <path d="M712.0,278 L712.0,303" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="592.0" y="306.0" width="170.0" height="52.0" rx="26.0" fill="#16A34A"/>
  <text x="677.0" y="328.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">A person approves</text>
  <text x="677.0" y="344.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">this exact change</text>
  <rect x="418.0" y="306.0" width="140.0" height="52.0" rx="26.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.3"/>
  <text x="488.0" y="328.5" font-size="12" fill="#312E81" text-anchor="middle">Drift check:</text>
  <text x="488.0" y="344.5" font-size="12" fill="#312E81" text-anchor="middle">target unchanged</text>
  <rect x="272.0" y="306.0" width="112.0" height="52.0" rx="6" fill="#DC2626"/>
  <text x="328.0" y="328.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Sandbox</text>
  <text x="328.0" y="344.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">executes</text>
