<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 442" width="792" height="442" font-family="Inter, 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Onam AI: the read path and the write path</title>
  <desc id="d">A read passes three automatic gates and returns an answer with evidence from Onam Security&#x27;s inventory and graph. A write passes seven gates, one of them a person approving the exact change, then runs in a sandbox, is validated and produces evidence; a failed validation rolls back.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
  <rect width="792" height="442" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#4F46E5" font-weight="700" letter-spacing="1.2">TWO PATHS THROUGH THE SAME BLOCKS</text>
  <text x="24.0" y="50.0" font-size="12.5" fill="#475569">Reading is cheap because it is safe. Changing your cloud is deliberately expensive: the asymmetry is the product.</text>
  <rect x="16.0" y="64.0" width="760.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="30.0" y="88.0" font-size="12.5" fill="#0B1220" font-weight="700" letter-spacing="0.6">READ PATH</text>
  <text x="112.0" y="88.0" font-size="12" fill="#475569">three automatic gates · no person needed</text>
  <rect x="30.0" y="104.0" width="84.0" height="52.0" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="72.0" y="134.5" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="700">Question</text>
  <line x1="116.0" y1="130.0" x2="137.2" y2="130.0" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="139.2" y="104.0" width="98.0" height="52.0" rx="26.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.3"/>
  <text x="188.2" y="134.5" font-size="12.5" fill="#312E81" text-anchor="middle">Entitlement</text>
  <line x1="239.2" y1="130.0" x2="260.4" y2="130.0" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="262.4" y="104.0" width="98.0" height="52.0" rx="26.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.3"/>
  <text x="311.4" y="134.5" font-size="12.5" fill="#312E81" text-anchor="middle">Agent scope</text>
  <line x1="362.4" y1="130.0" x2="383.6" y2="130.0" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="385.6" y="104.0" width="98.0" height="52.0" rx="26.0" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.3"/>
  <text x="434.6" y="134.5" font-size="12.5" fill="#312E81" text-anchor="middle">Tenant filter</text>
  <line x1="485.6" y1="130.0" x2="506.8" y2="130.0" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="508.8" y="104.0" width="132.0" height="52.0" rx="6" fill="#082869"/>
  <text x="574.8" y="126.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Onam Security</text>
  <text x="574.8" y="142.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">inventory &amp; graph</text>
  <line x1="642.8" y1="130.0" x2="664.0" y2="130.0" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="666.0" y="104.0" width="96.0" height="52.0" rx="26.0" fill="#16A34A"/>
  <text x="714.0" y="126.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">Answer +</text>
  <text x="714.0" y="142.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">evidence</text>
  <rect x="16.0" y="190.0" width="760.0" height="236.0" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/>
