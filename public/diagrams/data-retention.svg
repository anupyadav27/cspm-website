<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" font-family="Arial, sans-serif">
  <!-- Canvas -->
  <rect width="920" height="380" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" rx="10"/>

  <!-- Title -->
  <text x="460" y="20" text-anchor="middle" fill="#4F46E5" font-size="9" font-weight="700" letter-spacing="1.2">DATA RETENTION AND DELETION POLICY</text>
  <line x1="20" y1="28" x2="900" y2="28" stroke="#94A3B8" stroke-width="1"/>

  <!-- ===== TIMELINE ===== -->
  <!-- Horizontal connector line -->
  <line x1="174" y1="100" x2="186" y2="100" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="184,95 193,100 184,105" fill="#94A3B8"/>
  <line x1="340" y1="100" x2="352" y2="100" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="350,95 359,100 350,105" fill="#94A3B8"/>
  <line x1="518" y1="100" x2="530" y2="100" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="528,95 537,100 528,105" fill="#94A3B8"/>
  <line x1="684" y1="100" x2="696" y2="100" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="694,95 703,100 694,105" fill="#94A3B8"/>

  <!-- Box 1: Data Ingested -->
  <rect x="20" y="44" width="154" height="112" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="97" y="66" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Data Ingested</text>
  <text x="97" y="84" text-anchor="middle" fill="#64748B" font-size="9">Cloud API responses</text>
  <text x="97" y="100" text-anchor="middle" fill="#64748B" font-size="9">Encrypted at rest</text>
  <text x="97" y="116" text-anchor="middle" fill="#64748B" font-size="9">Stored in tenant silo</text>
  <text x="97" y="134" text-anchor="middle" fill="#3B82F6" font-size="8">Ingestion timestamp logged</text>

  <!-- Box 2: Active Storage -->
  <rect x="186" y="44" width="154" height="112" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="263" y="66" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Active Storage</text>
  <text x="263" y="84" text-anchor="middle" fill="#64748B" font-size="9">Full fidelity: 90 days</text>
  <text x="263" y="100" text-anchor="middle" fill="#64748B" font-size="9">Findings history retained</text>
  <text x="263" y="116" text-anchor="middle" fill="#64748B" font-size="9">Dashboard always current</text>
  <text x="263" y="134" text-anchor="middle" fill="#3B82F6" font-size="8">Fast query: &lt;500ms</text>

  <!-- Box 3: Rollup Archive -->
  <rect x="352" y="44" width="166" height="112" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="435" y="66" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Rollup Archive</text>
  <text x="435" y="84" text-anchor="middle" fill="#64748B" font-size="9">90 days → 1 year</text>
  <text x="435" y="100" text-anchor="middle" fill="#64748B" font-size="9">Aggregated metrics kept</text>
  <text x="435" y="116" text-anchor="middle" fill="#64748B" font-size="9">Raw findings summarised</text>
  <text x="435" y="134" text-anchor="middle" fill="#64748B" font-size="8">Immutable after archival</text>

  <!-- Box 4: Long-term Archive -->
  <rect x="530" y="44" width="154" height="112" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="607" y="66" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Long-term Archive</text>
  <text x="607" y="84" text-anchor="middle" fill="#64748B" font-size="9">1 year → 3 years</text>
  <text x="607" y="100" text-anchor="middle" fill="#64748B" font-size="9">Compliance evidence only</text>
  <text x="607" y="116" text-anchor="middle" fill="#64748B" font-size="9">Immutable audit log</text>
  <text x="607" y="134" text-anchor="middle" fill="#3B82F6" font-size="8">Cold storage · S3 Glacier</text>

  <!-- Box 5: Permanent Delete -->
  <rect x="700" y="44" width="200" height="112" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="800" y="66" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Permanent Delete</text>
  <text x="800" y="84" text-anchor="middle" fill="#64748B" font-size="9">After 3 years OR</text>
  <text x="800" y="100" text-anchor="middle" fill="#64748B" font-size="9">Account closure + 30 days</text>
  <text x="800" y="116" text-anchor="middle" fill="#64748B" font-size="9">Cryptographic erasure</text>
  <text x="800" y="134" text-anchor="middle" fill="#64748B" font-size="8">NIST 800-88 compliant</text>

  <!-- ===== POLICY TABLE ===== -->
  <!-- Header -->
  <rect x="20" y="172" width="880" height="34" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="185" y="194" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Data Type</text>
  <text x="520" y="194" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Retention Period</text>
  <text x="780" y="194" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Deletion Method</text>

  <!-- Row 0: Cloud resource metadata -->
  <rect x="20" y="206" width="880" height="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="223" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">Cloud resource metadata</text>
  <text x="520" y="223" text-anchor="middle" fill="#64748B" font-size="9">3 years</text>
  <text x="780" y="223" text-anchor="middle" fill="#64748B" font-size="9">Cryptographic erasure</text>
  <line x1="20" y1="230" x2="900" y2="230" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- Row 1: Security findings -->
  <rect x="20" y="230" width="880" height="24" fill="#F8FAFC"/>
  <text x="28" y="247" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">Security findings</text>
  <text x="520" y="247" text-anchor="middle" fill="#64748B" font-size="9">3 years</text>
  <text x="780" y="247" text-anchor="middle" fill="#64748B" font-size="9">Cryptographic erasure</text>
  <line x1="20" y1="254" x2="900" y2="254" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- Row 2: Audit logs -->
  <rect x="20" y="254" width="880" height="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="271" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">Audit logs</text>
  <text x="520" y="271" text-anchor="middle" fill="#64748B" font-size="9">7 years</text>
  <text x="780" y="271" text-anchor="middle" fill="#64748B" font-size="9">Secure delete (SOC 2)</text>
  <line x1="20" y1="278" x2="900" y2="278" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- Row 3: User activity logs -->
  <rect x="20" y="278" width="880" height="24" fill="#F8FAFC"/>
  <text x="28" y="295" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">User activity logs</text>
  <text x="520" y="295" text-anchor="middle" fill="#64748B" font-size="9">1 year</text>
  <text x="780" y="295" text-anchor="middle" fill="#64748B" font-size="9">Automated purge</text>
  <line x1="20" y1="302" x2="900" y2="302" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- Row 4: Compliance reports -->
  <rect x="20" y="302" width="880" height="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="319" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">Compliance reports</text>
  <text x="520" y="319" text-anchor="middle" fill="#64748B" font-size="9">5 years</text>
  <text x="780" y="319" text-anchor="middle" fill="#64748B" font-size="9">Cryptographic erasure</text>
  <line x1="20" y1="326" x2="900" y2="326" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- Row 5: API access logs -->
  <rect x="20" y="326" width="880" height="24" fill="#F8FAFC"/>
  <text x="28" y="343" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">API access logs</text>
  <text x="520" y="343" text-anchor="middle" fill="#64748B" font-size="9">90 days</text>
  <text x="780" y="343" text-anchor="middle" fill="#64748B" font-size="9">Automated purge</text>
  <line x1="20" y1="350" x2="900" y2="350" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- Row 6: Support tickets -->
  <rect x="20" y="350" width="880" height="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="367" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">Support tickets</text>
  <text x="520" y="367" text-anchor="middle" fill="#64748B" font-size="9">3 years</text>
  <text x="780" y="367" text-anchor="middle" fill="#64748B" font-size="9">Anonymised after closure</text>
  <line x1="20" y1="374" x2="900" y2="374" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- Table border -->
  <rect x="20" y="172" width="880" height="202" fill="none" stroke="#CBD5E1" stroke-width="1" rx="4"/>
  <line x1="370" y1="172" x2="370" y2="374" stroke="#94A3B8" stroke-width="0.5"/>
  <line x1="670" y1="172" x2="670" y2="374" stroke="#94A3B8" stroke-width="0.5"/>
</svg>
