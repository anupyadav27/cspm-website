<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 553" width="792" height="553" font-family="Inter, 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Onam Code Security: from repository to a fix branch</title>
  <desc id="d">A repository, an optional target URL or an SBOM file feed one scan job. The job runs static analysis and secret rules, dependency analysis with an SBOM, IaC and Dockerfile checks, and dynamic testing. Results are split into security issues, hotspots to review, dependency risk and runtime findings, shown in the console and the posture score. Fixes go to a separate branch for your own review.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
  <rect width="792" height="553" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="396.0" y="28.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="1">HOW ONAM CODE SECURITY WORKS: FROM REPOSITORY TO REVIEWED FIX</text>
  <line x1="16.0" y1="40.0" x2="776.0" y2="40.0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="12.0" y="52.0" width="178.5" height="485.1" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="101.2" y="74.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="0.6">1. CONNECT</text>
  <text x="101.2" y="91.0" font-size="12" fill="#475569" text-anchor="middle">What you point the scan at</text>
  <line x1="20.0" y1="104.1" x2="182.5" y2="104.1" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="20.0" y="114.1" width="162.5" height="119.4" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="101.2" y="136.1" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Git repository</text>
  <text x="101.2" y="157.0" font-size="12" fill="#475569" text-anchor="middle">HTTPS URL and branch</text>
  <text x="101.2" y="173.1" font-size="12" fill="#475569" text-anchor="middle">· GitHub, GitLab,</text>
  <text x="101.2" y="189.2" font-size="12" fill="#475569" text-anchor="middle">Bitbucket · default</text>
  <text x="101.2" y="205.3" font-size="12" fill="#475569" text-anchor="middle">branch detected if left</text>
  <text x="101.2" y="221.4" font-size="12" fill="#475569" text-anchor="middle">blank</text>
  <rect x="20.0" y="241.5" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="101.2" y="263.5" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Target URL</text>
  <text x="101.2" y="284.4" font-size="12" fill="#475569" text-anchor="middle">Optional: a running web</text>
  <text x="101.2" y="300.5" font-size="12" fill="#475569" text-anchor="middle">app or API you are</text>
  <text x="101.2" y="316.6" font-size="12" fill="#475569" text-anchor="middle">authorised to test</text>
  <rect x="20.0" y="336.7" width="162.5" height="103.3" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="101.2" y="358.7" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">SBOM file</text>
  <text x="101.2" y="379.6" font-size="12" fill="#475569" text-anchor="middle">Optional: upload a</text>
  <text x="101.2" y="395.7" font-size="12" fill="#475569" text-anchor="middle">CycloneDX or SPDX</text>
  <text x="101.2" y="411.8" font-size="12" fill="#475569" text-anchor="middle">JSON instead of a</text>
  <text x="101.2" y="427.9" font-size="12" fill="#475569" text-anchor="middle">repository</text>
  <text x="101.2" y="460.0" font-size="12" fill="#475569" text-anchor="middle">Shallow clone of one</text>
  <text x="101.2" y="476.1" font-size="12" fill="#475569" text-anchor="middle">branch, deleted when the</text>
  <text x="101.2" y="492.2" font-size="12" fill="#475569" text-anchor="middle">scan ends</text>
  <rect x="208.5" y="52.0" width="178.5" height="485.1" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="297.8" y="74.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="0.6">2. SCAN</text>
  <text x="297.8" y="91.0" font-size="12" fill="#475569" text-anchor="middle">One isolated job per scan</text>
  <line x1="216.5" y1="104.1" x2="379.0" y2="104.1" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="216.5" y="114.1" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="297.8" y="136.1" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">SAST + secrets</text>
  <text x="297.8" y="157.0" font-size="12" fill="#475569" text-anchor="middle">Onam engine: data-flow,</text>
  <text x="297.8" y="173.1" font-size="12" fill="#475569" text-anchor="middle">structure and reviewed</text>
  <text x="297.8" y="189.2" font-size="12" fill="#475569" text-anchor="middle">pattern rules</text>
  <rect x="216.5" y="209.3" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="297.8" y="231.3" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">SCA + SBOM</text>
  <text x="297.8" y="252.2" font-size="12" fill="#475569" text-anchor="middle">Manifests and lockfiles</text>
  <text x="297.8" y="268.3" font-size="12" fill="#475569" text-anchor="middle">parsed → OSV / NVD ·</text>
  <text x="297.8" y="284.4" font-size="12" fill="#475569" text-anchor="middle">EPSS · CISA KEV</text>
  <rect x="216.5" y="304.5" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="297.8" y="326.5" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">IaC + Dockerfiles</text>
  <text x="297.8" y="347.4" font-size="12" fill="#475569" text-anchor="middle">Terraform · Kubernetes</text>
  <text x="297.8" y="363.5" font-size="12" fill="#475569" text-anchor="middle">YAML · CloudFormation ·</text>
  <text x="297.8" y="379.6" font-size="12" fill="#475569" text-anchor="middle">Dockerfile</text>
  <rect x="216.5" y="399.7" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="297.8" y="421.7" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">DAST</text>
  <text x="297.8" y="442.6" font-size="12" fill="#475569" text-anchor="middle">Runs only when a target</text>
  <text x="297.8" y="458.7" font-size="12" fill="#475569" text-anchor="middle">URL is given ·</text>
  <text x="297.8" y="474.8" font-size="12" fill="#475569" text-anchor="middle">rate-limited</text>
  <text x="297.8" y="506.9" font-size="12" fill="#475569" text-anchor="middle">Scanners run side by side,</text>
  <text x="297.8" y="523.0" font-size="12" fill="#475569" text-anchor="middle">not in sequence</text>
  <rect x="405.0" y="52.0" width="178.5" height="485.1" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="494.2" y="74.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="0.6">3. TRIAGE</text>
  <text x="494.2" y="91.0" font-size="12" fill="#475569" text-anchor="middle">How results are separated</text>
  <line x1="413.0" y1="104.1" x2="575.5" y2="104.1" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="413.0" y="114.1" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="494.2" y="136.1" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Security issues</text>
  <text x="494.2" y="157.0" font-size="12" fill="#475569" text-anchor="middle">Confirmed by data-flow</text>
  <text x="494.2" y="173.1" font-size="12" fill="#475569" text-anchor="middle">or structure rules · CWE</text>
  <text x="494.2" y="189.2" font-size="12" fill="#475569" text-anchor="middle">and OWASP</text>
  <rect x="413.0" y="209.3" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="494.2" y="231.3" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Hotspots to review</text>
  <text x="494.2" y="252.2" font-size="12" fill="#475569" text-anchor="middle">Pattern matches ·</text>
  <text x="494.2" y="268.3" font-size="12" fill="#475569" text-anchor="middle">severity capped at</text>
  <text x="494.2" y="284.4" font-size="12" fill="#475569" text-anchor="middle">medium</text>
  <rect x="413.0" y="304.5" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="494.2" y="326.5" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Dependency risk</text>
  <text x="494.2" y="347.4" font-size="12" fill="#475569" text-anchor="middle">0–10 score from CVSS,</text>
  <text x="494.2" y="363.5" font-size="12" fill="#475569" text-anchor="middle">EPSS, KEV and fix</text>
  <text x="494.2" y="379.6" font-size="12" fill="#475569" text-anchor="middle">availability</text>
  <rect x="413.0" y="399.7" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="494.2" y="421.7" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Runtime findings</text>
  <text x="494.2" y="442.6" font-size="12" fill="#475569" text-anchor="middle">Endpoint · payload class</text>
  <text x="494.2" y="458.7" font-size="12" fill="#475569" text-anchor="middle">· JSON, HTML or SARIF</text>
  <text x="494.2" y="474.8" font-size="12" fill="#475569" text-anchor="middle">report</text>
  <text x="494.2" y="506.9" font-size="12" fill="#475569" text-anchor="middle">Code-quality pattern rules</text>
  <text x="494.2" y="523.0" font-size="12" fill="#475569" text-anchor="middle">dropped</text>
  <rect x="601.5" y="52.0" width="178.5" height="485.1" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="690.8" y="74.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="0.6">4. ACT</text>
  <text x="690.8" y="91.0" font-size="12" fill="#475569" text-anchor="middle">Where the result goes</text>
  <line x1="609.5" y1="104.1" x2="772.0" y2="104.1" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="609.5" y="114.1" width="162.5" height="71.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="690.8" y="136.1" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Console and reports</text>
  <text x="690.8" y="157.0" font-size="12" fill="#475569" text-anchor="middle">Projects · alerts · trends ·</text>
  <text x="690.8" y="173.1" font-size="12" fill="#475569" text-anchor="middle">CSV and PDF export</text>
  <rect x="609.5" y="193.2" width="162.5" height="71.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="690.8" y="215.2" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Posture score</text>
  <text x="690.8" y="236.1" font-size="12" fill="#475569" text-anchor="middle">The code security area</text>
  <text x="690.8" y="252.2" font-size="12" fill="#475569" text-anchor="middle">of the CNAPP score</text>
  <rect x="609.5" y="272.3" width="162.5" height="71.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="690.8" y="294.3" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">AI fix prompt</text>
  <text x="690.8" y="315.2" font-size="12" fill="#475569" text-anchor="middle">Per finding: copy it into</text>
  <text x="690.8" y="331.3" font-size="12" fill="#475569" text-anchor="middle">your own assistant</text>
  <rect x="609.5" y="351.4" width="162.5" height="87.2" rx="8" fill="#EFF4FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="690.8" y="373.4" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">AI Code Fix</text>
  <text x="690.8" y="394.3" font-size="12" fill="#475569" text-anchor="middle">On request: corrected</text>
  <text x="690.8" y="410.4" font-size="12" fill="#475569" text-anchor="middle">files on a separate fix</text>
  <text x="690.8" y="426.5" font-size="12" fill="#475569" text-anchor="middle">branch</text>
  <text x="690.8" y="458.6" font-size="12" fill="#475569" text-anchor="middle">Nothing merges or deploys</text>
  <text x="690.8" y="474.7" font-size="12" fill="#475569" text-anchor="middle">itself: your review and CI</text>
  <text x="690.8" y="490.8" font-size="12" fill="#475569" text-anchor="middle">decide</text>
  <line x1="192.5" y1="294.6" x2="206.5" y2="294.6" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="389.0" y1="294.6" x2="403.0" y2="294.6" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="585.5" y1="294.6" x2="599.5" y2="294.6" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
