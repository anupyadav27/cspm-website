<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 378" width="792" height="378" font-family="Inter, 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Identity attack path: privilege escalation from a low-privilege Lambda to full admin</title>
  <desc id="d">Illustrative example. A compromised Lambda assumes the app-processor role, which can pass data-pipeline-role; that role can create a new policy version, so the attacker writes an admin policy and attaches it, reaching full admin.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
  <rect width="792" height="378" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="396.0" y="28.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="1">IDENTITY ATTACK PATH: A LOW-PRIVILEGE LAMBDA TO FULL ADMIN</text>
  <text x="776.0" y="28.0" font-size="12" fill="#475569" text-anchor="end" font-style="italic">Example</text>
  <line x1="16.0" y1="40.0" x2="776.0" y2="40.0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="12.0" y="52.0" width="142.4" height="160.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="83.2" y="72.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="700" letter-spacing="0.8">START</text>
  <text x="83.2" y="92.0" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Compromised</text>
  <text x="83.2" y="109.0" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Lambda function</text>
  <text x="83.2" y="130.0" font-size="12" fill="#475569" text-anchor="middle">Low privilege, the</text>
  <text x="83.2" y="146.0" font-size="12" fill="#475569" text-anchor="middle">attacker&#x27;s entry point</text>
  <line x1="155.4" y1="132.0" x2="167.4" y2="132.0" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="168.4" y="52.0" width="142.4" height="160.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="239.6" y="72.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="700" letter-spacing="0.8">HOP 1</text>
  <text x="239.6" y="90.0" font-size="12" fill="#475569" text-anchor="middle">via</text>
  <text x="239.6" y="106.0" font-size="12" fill="#1D4ED8" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">sts:AssumeRole</text>
  <text x="239.6" y="132.0" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">IAM role</text>
  <text x="239.6" y="149.0" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">app-processor</text>
  <text x="239.6" y="170.0" font-size="12" fill="#475569" text-anchor="middle">Has iam:PassRole on</text>
  <text x="239.6" y="186.0" font-size="12" fill="#475569" text-anchor="middle">data-pipeline-role</text>
  <line x1="311.8" y1="132.0" x2="323.8" y2="132.0" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="324.8" y="52.0" width="142.4" height="160.0" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
  <text x="396.0" y="72.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="700" letter-spacing="0.8">HOP 2</text>
  <text x="396.0" y="90.0" font-size="12" fill="#475569" text-anchor="middle">via</text>
  <text x="396.0" y="106.0" font-size="12" fill="#1D4ED8" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">iam:PassRole</text>
  <text x="396.0" y="132.0" font-size="13" fill="#9A3412" text-anchor="middle" font-weight="700">IAM role</text>
  <text x="396.0" y="149.0" font-size="13" fill="#9A3412" text-anchor="middle" font-weight="700">data-pipeline-role</text>
  <text x="396.0" y="170.0" font-size="12" fill="#475569" text-anchor="middle">Has S3 admin and</text>
  <text x="396.0" y="186.0" font-size="12" fill="#475569" text-anchor="middle">iam:CreatePolicyVersion</text>
  <line x1="468.2" y1="132.0" x2="480.2" y2="132.0" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="481.2" y="52.0" width="142.4" height="160.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="552.4" y="72.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="700" letter-spacing="0.8">HOP 3</text>
  <text x="552.4" y="90.0" font-size="12" fill="#475569" text-anchor="middle">via</text>
  <text x="552.4" y="106.0" font-size="12" fill="#1D4ED8" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">iam:</text>
  <text x="552.4" y="121.0" font-size="12" fill="#1D4ED8" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">CreatePolicyVersion</text>
  <text x="552.4" y="147.0" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Privilege</text>
  <text x="552.4" y="164.0" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">escalation</text>
  <text x="552.4" y="185.0" font-size="12" fill="#475569" text-anchor="middle">Writes an admin</text>
  <text x="552.4" y="201.0" font-size="12" fill="#475569" text-anchor="middle">policy version and</text>
  <text x="552.4" y="217.0" font-size="12" fill="#475569" text-anchor="middle">attaches it to itself</text>
  <line x1="624.6" y1="132.0" x2="636.6" y2="132.0" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="637.6" y="52.0" width="142.4" height="160.0" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="708.8" y="72.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="700" letter-spacing="0.8">RESULT</text>
  <text x="708.8" y="90.0" font-size="12" fill="#475569" text-anchor="middle">via</text>
  <text x="708.8" y="106.0" font-size="12" fill="#1D4ED8" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">iam:</text>
  <text x="708.8" y="121.0" font-size="12" fill="#1D4ED8" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">AttachUserPolicy</text>
  <text x="708.8" y="147.0" font-size="13" fill="#991B1B" text-anchor="middle" font-weight="700">Full admin access</text>
  <text x="708.8" y="168.0" font-size="12" fill="#475569" text-anchor="middle">All services, all</text>
  <text x="708.8" y="184.0" font-size="12" fill="#475569" text-anchor="middle">regions</text>
  <rect x="12.0" y="226.0" width="768.0" height="1.0" rx="0" fill="#CBD5E1"/>
  <text x="396.0" y="252.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="0.8">HOW THE PLATFORM FINDS THIS</text>
  <text x="396.0" y="274.0" font-size="12.5" fill="#334155" text-anchor="middle">CIEM enumerates every role reachable from each identity, follows iam:PassRole and sts:AssumeRole edges, and flags any</text>
  <text x="396.0" y="292.0" font-size="12.5" fill="#334155" text-anchor="middle">chain that ends in a permission able to escalate itself (iam:CreatePolicyVersion, iam:AttachUserPolicy, iam:PutRolePolicy</text>
  <text x="396.0" y="310.0" font-size="12.5" fill="#334155" text-anchor="middle">and others).</text>
  <text x="396.0" y="334.0" font-size="12.5" fill="#334155" text-anchor="middle">Attack Paths shows each hop and the permission it abuses, and the control that would have stopped the chain. The</text>
  <text x="396.0" y="352.0" font-size="12.5" fill="#334155" text-anchor="middle">highlighted hop is the one to fix first.</text>
</svg>
