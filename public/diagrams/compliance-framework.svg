<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="Arial, sans-serif">
  <rect width="960" height="320" fill="#F8FAFC" rx="10"/>

  <!-- ══ PANEL 1: Security Rules ═══════════════════ -->
  <rect x="16" y="16" width="200" height="288" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="116" y="36" text-anchor="middle" font-size="9" font-weight="700" fill="#2563EB" letter-spacing="1">SECURITY RULES</text>
  <line x1="26" y1="44" x2="206" y2="44" stroke="#CBD5E1" stroke-width="1"/>

  <rect x="28" y="54"  width="176" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="116" y="73"  text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">S3 public access</text>
  <text x="116" y="89"  text-anchor="middle" font-size="9"  fill="#64748B">blocked check</text>

  <rect x="28" y="108" width="176" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="116" y="127" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Root MFA enabled</text>
  <text x="116" y="143" text-anchor="middle" font-size="9"  fill="#64748B">account-level check</text>

  <rect x="28" y="162" width="176" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="116" y="181" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">RDS encrypted</text>
  <text x="116" y="197" text-anchor="middle" font-size="9"  fill="#64748B">at rest</text>

  <rect x="28" y="216" width="176" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="116" y="235" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">CloudTrail enabled</text>
  <text x="116" y="251" text-anchor="middle" font-size="9"  fill="#64748B">all regions</text>

  <!-- ── ARROW 1 ─────────────────────────────────── -->
  <line x1="216" y1="160" x2="258" y2="160" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="256,154 268,160 256,166" fill="#94A3B8"/>
  <text x="237" y="152" text-anchor="middle" font-size="9" fill="#2563EB">evaluate</text>

  <!-- ══ PANEL 2: Check Engine ══════════════════════ -->
  <rect x="268" y="16" width="174" height="288" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="10"/>
  <text x="355" y="36" text-anchor="middle" font-size="9" font-weight="700" fill="#1E3A8A" letter-spacing="1">CHECK ENGINE</text>
  <line x1="278" y1="44" x2="432" y2="44" stroke="#94A3B8" stroke-width="1"/>

  <rect x="282" y="60" width="146" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="355" y="83"  text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Live Resource</text>
  <text x="355" y="99"  text-anchor="middle" font-size="9"  fill="#64748B">Fetch from cloud API</text>
  <text x="355" y="113" text-anchor="middle" font-size="9"  fill="#64748B">via read-only IAM role</text>

  <text x="355" y="142" text-anchor="middle" font-size="20" fill="#64748B">↓</text>

  <rect x="282" y="156" width="146" height="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="355" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Rule Evaluation</text>
  <text x="355" y="195" text-anchor="middle" font-size="9"  fill="#64748B">Apply 1,900+ YAML rules</text>

  <text x="355" y="224" text-anchor="middle" font-size="20" fill="#64748B">↓</text>

  <rect x="294" y="234" width="56" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="322" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">PASS</text>

  <rect x="368" y="234" width="56" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="396" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">FAIL</text>

  <!-- ── ARROW 2 ─────────────────────────────────── -->
  <line x1="442" y1="160" x2="484" y2="160" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="482,154 494,160 482,166" fill="#94A3B8"/>
  <text x="463" y="152" text-anchor="middle" font-size="9" fill="#2563EB">map to</text>

  <!-- ══ PANEL 3: Frameworks ════════════════════════ -->
  <rect x="494" y="16" width="220" height="288" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="604" y="36" text-anchor="middle" font-size="9" font-weight="700" fill="#2563EB" letter-spacing="1">FRAMEWORKS</text>
  <line x1="504" y1="44" x2="704" y2="44" stroke="#CBD5E1" stroke-width="1"/>

  <!-- framework badges -->
  <rect x="508" y="54"  width="192" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="604" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">CIS Benchmarks</text>

  <rect x="508" y="99"  width="192" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="604" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">NIST CSF 2.0</text>

  <rect x="508" y="144" width="192" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="604" y="167" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">PCI-DSS v4  ·  HIPAA</text>

  <rect x="508" y="189" width="192" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="604" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">ISO 27001  ·  GDPR</text>

  <rect x="508" y="234" width="192" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="604" y="257" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">SOC 2  ·  FedRAMP</text>

  <!-- ── ARROW 3 ─────────────────────────────────── -->
  <line x1="714" y1="160" x2="756" y2="160" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="754,154 766,160 754,166" fill="#94A3B8"/>
  <text x="735" y="152" text-anchor="middle" font-size="9" fill="#10B981">score</text>

  <!-- ══ PANEL 4: Compliance Score ══════════════════ -->
  <rect x="766" y="16" width="178" height="288" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="855" y="36" text-anchor="middle" font-size="9" font-weight="700" fill="#059669" letter-spacing="1">COMPLIANCE SCORE</text>
  <line x1="776" y1="44" x2="934" y2="44" stroke="#94A3B8" stroke-width="1"/>

  <rect x="780" y="56"  width="150" height="52" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="855" y="78"  text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Pass Count</text>
  <text x="855" y="96"  text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A8A">✓</text>

  <rect x="780" y="118" width="150" height="52" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="855" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Fail Count</text>
  <text x="855" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A8A">✗</text>

  <line x1="855" y1="170" x2="855" y2="186" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="849,184 855,194 861,184" fill="#94A3B8"/>

  <rect x="780" y="194" width="150" height="44" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="855" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Score</text>
  <text x="855" y="230" text-anchor="middle" font-size="10" fill="#64748B">pass ÷ total × 100</text>

  <line x1="855" y1="238" x2="855" y2="252" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="849,250 855,260 861,250" fill="#94A3B8"/>

  <rect x="780" y="260" width="150" height="36" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="855" y="281" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Compliance Report</text>
  <text x="855" y="295" text-anchor="middle" font-size="9" fill="#64748B">per framework</text>
</svg>
