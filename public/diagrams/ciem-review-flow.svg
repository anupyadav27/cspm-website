<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" font-family="Arial, sans-serif" role="img" aria-label="Identity risk score components and the access review states">
  <title>Identity risk score components and the access review states</title>
  <rect width="920" height="340" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" rx="10"/>
  <text x="460" y="24" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.2" fill="#1E40AF">FROM IDENTITY RISK SCORE TO ACCESS REVIEW (AWS IDENTITIES)</text>
  <line x1="16" y1="32" x2="904" y2="32" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="16" y="44" width="340" height="280" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="186.0" y="64" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1" fill="#1E40AF">IDENTITY RISK SCORE</text>
  <text x="186.0" y="77" text-anchor="middle" font-size="8" fill="#64748B">Additive, capped at 100</text>
  <line x1="26" y1="85" x2="346" y2="85" stroke="#CBD5E1" stroke-width="1"/>
  <text x="30" y="110" text-anchor="start" font-size="10" font-weight="700" fill="#0F172A">Escalation paths</text>
  <text x="30" y="123" text-anchor="start" font-size="8.5" fill="#475569">10 per path, up to 30</text>
  <rect x="250" y="102" width="90" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="250" y="102" width="67.5" height="10" rx="5" fill="#EF4444"/>
  <text x="30" y="156" text-anchor="start" font-size="10" font-weight="700" fill="#0F172A">Recent escalation activity (CDR)</text>
  <text x="30" y="169" text-anchor="start" font-size="8.5" fill="#475569">40 when confirmed</text>
  <rect x="250" y="148" width="90" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="250" y="148" width="90.0" height="10" rx="5" fill="#B91C1C"/>
  <text x="30" y="202" text-anchor="start" font-size="10" font-weight="700" fill="#0F172A">Blast radius</text>
  <text x="30" y="215" text-anchor="start" font-size="8.5" fill="#475569">2 per reachable risky resource, up to 20</text>
  <rect x="250" y="194" width="90" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="250" y="194" width="45.0" height="10" rx="5" fill="#F59E0B"/>
  <text x="30" y="248" text-anchor="start" font-size="10" font-weight="700" fill="#0F172A">Permission gap</text>
  <text x="30" y="261" text-anchor="start" font-size="8.5" fill="#475569">gap % ÷ 5, up to 20</text>
  <rect x="250" y="240" width="90" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="250" y="240" width="45.0" height="10" rx="5" fill="#6366F1"/>
  <text x="186" y="296" text-anchor="middle" font-size="8.5" fill="#64748B">Tiers: critical 80+ · high 60+ · medium 30+ · low</text>
  <line x1="358" y1="184" x2="384" y2="184" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="382,179 392,184 382,189" fill="#94A3B8"/>
  <rect x="394" y="134" width="150" height="100" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" rx="10"/>
  <text x="469" y="164" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1E40AF">High tier or above</text>
  <text x="469" y="182" text-anchor="middle" font-size="8.5" fill="#475569">opens a review with</text>
  <text x="469" y="195" text-anchor="middle" font-size="8.5" fill="#475569">gap, granted vs used and</text>
  <text x="469" y="208" text-anchor="middle" font-size="8.5" fill="#475569">high-risk unused actions</text>
  <line x1="546" y1="184" x2="572" y2="184" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="570,179 580,184 570,189" fill="#94A3B8"/>
  <rect x="582" y="44" width="322" height="280" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="743.0" y="64" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1" fill="#1E40AF">ACCESS REVIEW</text>
  <text x="743.0" y="77" text-anchor="middle" font-size="8" fill="#64748B">Every change written to an audit trail</text>
  <line x1="592" y1="85" x2="894" y2="85" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="742" y1="116" x2="640" y2="168" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="742" y1="116" x2="742" y2="168" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="742" y1="116" x2="852" y2="168" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="704.0" y="94" width="76" height="24" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="1.2"/>
  <text x="742" y="109.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">Pending</text>
  <rect x="602.0" y="168" width="76" height="24" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="1.2"/>
  <text x="640" y="183.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803D">Reviewed</text>
  <rect x="688.0" y="168" width="108" height="24" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.2"/>
  <text x="742" y="183.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B91C1C">Needs remediation</text>
  <rect x="814.0" y="168" width="76" height="24" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.2"/>
  <text x="852" y="183.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#B45309">Deferred</text>
  <text x="743" y="232" text-anchor="middle" font-size="8.5" fill="#475569">Decisions expire and return to pending.</text>
  <text x="743" y="245" text-anchor="middle" font-size="8.5" fill="#475569">A re-flagged reviewed or deferred identity</text>
  <text x="743" y="258" text-anchor="middle" font-size="8.5" fill="#475569">returns to pending.</text>
  <text x="743" y="284" text-anchor="middle" font-size="8.5" fill="#64748B">Deciding needs the review:decide permission.</text>
  <text x="743" y="299" text-anchor="middle" font-size="8.5" fill="#64748B">Removing access is your change — Onam never edits IAM.</text>
</svg>
