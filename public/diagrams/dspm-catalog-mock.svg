<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Illustrative data store catalog</title>
  <desc id="d">A stylised mock of the DSPM data catalog showing labels inferred from metadata, the metadata signal likely behind each label, encryption, public access and the governance score. Not a console screenshot.</desc>
  <rect width="960" height="330" fill="#F8FAFC" rx="10"/>

  <text x="24" y="28" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">DATA CATALOG — WHAT A STORE LOOKS LIKE AFTER A SCAN</text>
  <rect x="704" y="15" width="232" height="20" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="820" y="29" text-anchor="middle" font-size="8" font-weight="700" fill="#92400E">ILLUSTRATIVE MOCK · NOT A SCREENSHOT</text>

  <rect x="16" y="44" width="928" height="250" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="10"/>

  <!-- header row -->
  <g font-size="8" font-weight="700" fill="#64748B" letter-spacing="0.8">
    <text x="32" y="68">STORE</text>
    <text x="210" y="68">TYPE · REGION</text>
    <text x="364" y="68">LABELS</text>
    <text x="474" y="68">LIKELY SIGNAL</text>
    <text x="680" y="68">ENCRYPTED</text>
    <text x="764" y="68">PUBLIC</text>
    <text x="842" y="68">SCORE</text>
  </g>
  <line x1="16" y1="78" x2="944" y2="78" stroke="#E2E8F0" stroke-width="1"/>

  <!-- row 1 -->
  <text x="32" y="102" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#0B1220">customer-profile-exports</text>
  <text x="210" y="102" font-size="9" fill="#475569">S3 bucket · eu-west-1</text>
  <rect x="364" y="91" width="34" height="16" rx="8" fill="#FDECEA"/><text x="381" y="102" text-anchor="middle" font-size="8" font-weight="700" fill="#B91C1C">PII</text>
  <text x="474" y="102" font-size="9" fill="#475569">name contains "customer", "profile"</text>
  <text x="680" y="102" font-size="9" font-weight="700" fill="#047857">Yes</text>
  <text x="764" y="102" font-size="9" font-weight="700" fill="#B91C1C">Yes · ACL</text>
  <text x="842" y="102" font-size="9" font-weight="700" fill="#B45309">66</text>
  <line x1="16" y1="116" x2="944" y2="116" stroke="#F1F5F9" stroke-width="1"/>

  <!-- row 2 -->
  <text x="32" y="140" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#0B1220">billing-ledger</text>
  <text x="210" y="140" font-size="9" fill="#475569">RDS instance · us-east-1</text>
  <rect x="364" y="129" width="62" height="16" rx="8" fill="#FEF3C7"/><text x="395" y="140" text-anchor="middle" font-size="8" font-weight="700" fill="#92400E">FINANCIAL</text>
  <text x="474" y="140" font-size="9" fill="#475569">name contains "billing"</text>
  <text x="680" y="140" font-size="9" font-weight="700" fill="#B91C1C">No</text>
  <text x="764" y="140" font-size="9" fill="#475569">No</text>
  <text x="842" y="140" font-size="9" font-weight="700" fill="#B45309">66</text>
  <line x1="16" y1="154" x2="944" y2="154" stroke="#F1F5F9" stroke-width="1"/>

  <!-- row 3 -->
  <text x="32" y="178" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#0B1220">patient-intake</text>
  <text x="210" y="178" font-size="9" fill="#475569">DynamoDB table · us-east-2</text>
  <rect x="364" y="167" width="34" height="16" rx="8" fill="#FDECEA"/><text x="381" y="178" text-anchor="middle" font-size="8" font-weight="700" fill="#B91C1C">PII</text>
  <rect x="402" y="167" width="36" height="16" rx="8" fill="#FDECEA"/><text x="420" y="178" text-anchor="middle" font-size="8" font-weight="700" fill="#B91C1C">PHI</text>
  <text x="474" y="178" font-size="9" fill="#475569">name contains "patient"</text>
  <text x="680" y="178" font-size="9" font-weight="700" fill="#047857">Yes</text>
  <text x="764" y="178" font-size="9" fill="#475569">No</text>
  <text x="842" y="178" font-size="9" font-weight="700" fill="#047857">100</text>
  <line x1="16" y1="192" x2="944" y2="192" stroke="#F1F5F9" stroke-width="1"/>

  <!-- row 4 -->
  <text x="32" y="216" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#0B1220">app-config</text>
  <text x="210" y="216" font-size="9" fill="#475569">K8s ConfigMap · prod</text>
  <rect x="364" y="205" width="82" height="16" rx="8" fill="#FEF3C7"/><text x="405" y="216" text-anchor="middle" font-size="8" font-weight="700" fill="#92400E">CONFIDENTIAL</text>
  <text x="474" y="216" font-size="9" fill="#475569">has a key named like a password</text>
  <text x="680" y="216" font-size="9" fill="#475569">—</text>
  <text x="764" y="216" font-size="9" fill="#475569">—</text>
  <text x="842" y="216" font-size="9" fill="#475569">—</text>
  <line x1="16" y1="230" x2="944" y2="230" stroke="#F1F5F9" stroke-width="1"/>

  <!-- row 5 -->
  <text x="32" y="254" font-size="10" font-weight="700" font-family="Menlo, monospace" fill="#0B1220">nightly-exports</text>
  <text x="210" y="254" font-size="9" fill="#475569">S3 bucket · us-east-1</text>
  <rect x="364" y="243" width="56" height="16" rx="8" fill="#F1F5F9"/><text x="392" y="254" text-anchor="middle" font-size="8" font-weight="700" fill="#475569">no label</text>
  <text x="474" y="254" font-size="9" fill="#475569">nothing in the name or tags says</text>
  <text x="474" y="266" font-size="9" fill="#475569">what it holds — tag it to classify it</text>
  <text x="680" y="254" font-size="9" font-weight="700" fill="#047857">Yes</text>
  <text x="764" y="254" font-size="9" fill="#475569">No</text>
  <text x="842" y="254" font-size="9" font-weight="700" fill="#B45309">66</text>

  <text x="24" y="314" font-size="8" fill="#64748B">Score: the share of three checks a store passes — encrypted at rest, not public, access logging on — so 0, 33, 66 or 100. Below 80 is a finding.</text>
</svg>
