<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 739" width="792" height="739" font-family="Inter, 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How Onam CIEM works: identity sources, effective-permission resolver, identity graph, findings and access reviews</title>
  <desc id="d">Identity sources from seven clouds feed a five-step permission resolver; the results become an identity graph with edges such as member-of, assumes, has-policy and can-access; the console shows escalation and hidden admins, risky trust, unused permissions, identity risk scores and access reviews.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
  <rect width="792" height="739" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="396.0" y="28.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="1">ONAM CIEM: FROM IDENTITY SOURCES TO FINDINGS AND REVIEWS</text>
  <line x1="16.0" y1="40.0" x2="776.0" y2="40.0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="12.0" y="52.0" width="178.5" height="671.1" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="101.2" y="74.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="0.6">1. IDENTITY SOURCES</text>
  <text x="101.2" y="91.0" font-size="12" fill="#475569" text-anchor="middle">From Onam&#x27;s cloud</text>
  <text x="101.2" y="107.1" font-size="12" fill="#475569" text-anchor="middle">inventory</text>
  <line x1="20.0" y1="120.2" x2="182.5" y2="120.2" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="20.0" y="130.2" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="101.2" y="152.2" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">AWS</text>
  <text x="101.2" y="173.1" font-size="12" fill="#475569" text-anchor="middle">Users · roles · groups ·</text>
  <text x="101.2" y="189.2" font-size="12" fill="#475569" text-anchor="middle">policies · trust policies ·</text>
  <text x="101.2" y="205.3" font-size="12" fill="#475569" text-anchor="middle">SCPs</text>
  <rect x="20.0" y="225.4" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="101.2" y="247.4" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Azure</text>
  <text x="101.2" y="268.3" font-size="12" fill="#475569" text-anchor="middle">Role definitions and</text>
  <text x="101.2" y="284.4" font-size="12" fill="#475569" text-anchor="middle">assignments · service</text>
  <text x="101.2" y="300.5" font-size="12" fill="#475569" text-anchor="middle">principals · managed IDs</text>
  <rect x="20.0" y="320.6" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="101.2" y="342.6" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Google Cloud</text>
  <text x="101.2" y="363.5" font-size="12" fill="#475569" text-anchor="middle">IAM bindings · service</text>
  <text x="101.2" y="379.6" font-size="12" fill="#475569" text-anchor="middle">accounts · workload</text>
  <text x="101.2" y="395.7" font-size="12" fill="#475569" text-anchor="middle">identity pools</text>
  <rect x="20.0" y="415.8" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="101.2" y="437.8" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Kubernetes</text>
  <text x="101.2" y="458.7" font-size="12" fill="#475569" text-anchor="middle">RBAC bindings · service</text>
  <text x="101.2" y="474.8" font-size="12" fill="#475569" text-anchor="middle">accounts · workload</text>
  <text x="101.2" y="490.9" font-size="12" fill="#475569" text-anchor="middle">identity</text>
  <rect x="20.0" y="511.0" width="162.5" height="104.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="101.2" y="533.0" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">OCI · Alibaba · IBM</text>
  <text x="101.2" y="549.9" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Cloud</text>
  <text x="101.2" y="570.8" font-size="12" fill="#475569" text-anchor="middle">Users, groups, policies,</text>
  <text x="101.2" y="586.9" font-size="12" fill="#475569" text-anchor="middle">keys · dynamic groups ·</text>
  <text x="101.2" y="603.0" font-size="12" fill="#475569" text-anchor="middle">trusted profiles</text>
  <rect x="20.0" y="623.1" width="162.5" height="88.0" rx="8" fill="#EFF4FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="101.2" y="645.1" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Audit-log activity</text>
  <text x="101.2" y="662.0" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">(AWS, Google Cloud)</text>
  <text x="101.2" y="682.9" font-size="12" fill="#475569" text-anchor="middle">collected by threat</text>
  <text x="101.2" y="699.0" font-size="12" fill="#475569" text-anchor="middle">detection</text>
  <rect x="208.5" y="52.0" width="178.5" height="671.1" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="297.8" y="74.0" font-size="12" fill="#1D4ED8" text-anchor="middle" font-weight="700">2. PERMISSION RESOLVER</text>
  <text x="297.8" y="91.0" font-size="12" fill="#475569" text-anchor="middle">What each identity can do</text>
  <line x1="216.5" y1="104.1" x2="379.0" y2="104.1" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="216.5" y="114.1" width="162.5" height="71.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="226.5" y="136.1" font-size="13" fill="#1E3A8A" font-weight="700">1 · Group expansion</text>
  <text x="226.5" y="157.0" font-size="12" fill="#475569">Group policies copied</text>
  <text x="226.5" y="173.1" font-size="12" fill="#475569">onto members</text>
  <rect x="216.5" y="193.2" width="162.5" height="71.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="226.5" y="215.2" font-size="13" fill="#1E3A8A" font-weight="700">2 · Condition classes</text>
  <text x="226.5" y="236.1" font-size="12" fill="#475569">Can an attacker satisfy</text>
  <text x="226.5" y="252.2" font-size="12" fill="#475569">it?</text>
  <rect x="216.5" y="272.3" width="162.5" height="88.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="226.5" y="294.3" font-size="13" fill="#1E3A8A" font-weight="700">3 · Explicit-deny</text>
  <text x="226.5" y="311.2" font-size="13" fill="#1E3A8A" font-weight="700">netting</text>
  <text x="226.5" y="332.1" font-size="12" fill="#475569">A deny overrides an</text>
  <text x="226.5" y="348.2" font-size="12" fill="#475569">allow</text>
  <rect x="216.5" y="368.3" width="162.5" height="71.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="226.5" y="390.3" font-size="13" fill="#1E3A8A" font-weight="700">4 · SCP deny check</text>
  <text x="226.5" y="411.2" font-size="12" fill="#475569">Org guardrails, where</text>
  <text x="226.5" y="427.3" font-size="12" fill="#475569">readable</text>
  <rect x="216.5" y="447.4" width="162.5" height="88.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="226.5" y="469.4" font-size="13" fill="#1E3A8A" font-weight="700">5 · Access level and</text>
  <text x="226.5" y="486.3" font-size="13" fill="#1E3A8A" font-weight="700">flags</text>
  <text x="226.5" y="507.2" font-size="12" fill="#475569">admin · IAM control ·</text>
  <text x="226.5" y="523.3" font-size="12" fill="#475569">write · read</text>
  <text x="297.8" y="555.4" font-size="12" fill="#475569" text-anchor="middle">Full chain on AWS; Azure,</text>
  <text x="297.8" y="571.5" font-size="12" fill="#475569" text-anchor="middle">Google Cloud and</text>
  <text x="297.8" y="587.6" font-size="12" fill="#475569" text-anchor="middle">Kubernetes resolve</text>
  <text x="297.8" y="603.7" font-size="12" fill="#475569" text-anchor="middle">assignments and bindings</text>
  <text x="297.8" y="619.8" font-size="12" fill="#475569" text-anchor="middle">into the same table.</text>
  <rect x="405.0" y="52.0" width="178.5" height="671.1" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="494.2" y="74.0" font-size="12.5" fill="#1D4ED8" text-anchor="middle" font-weight="700" letter-spacing="0.6">3. IDENTITY GRAPH</text>
  <text x="494.2" y="91.0" font-size="12" fill="#475569" text-anchor="middle">Edge types, shown as an</text>
  <text x="494.2" y="107.1" font-size="12" fill="#475569" text-anchor="middle">example</text>
  <line x1="413.0" y1="120.2" x2="575.5" y2="120.2" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="413.0" y="130.2" width="162.5" height="240.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="479.0" y1="172.2" x2="507.5" y2="172.2" stroke="#64748B" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="479.0" y1="324.2" x2="507.5" y2="324.2" stroke="#64748B" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="449.0" y1="186.2" x2="449.0" y2="232.2" stroke="#64748B" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="539.5" y1="186.2" x2="539.5" y2="232.2" stroke="#64748B" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="449.0" y1="262.2" x2="449.0" y2="308.2" stroke="#64748B" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="494.2" y="151.2" font-size="12" fill="#475569" text-anchor="middle">member-of</text>
  <text x="454.0" y="206.2" font-size="12" fill="#475569">assumes</text>
  <text x="534.5" y="228.2" font-size="12" fill="#475569" text-anchor="end">has-policy</text>
  <text x="454.0" y="290.2" font-size="12" fill="#475569">assumes</text>
  <text x="494.2" y="358.2" font-size="12" fill="#475569" text-anchor="middle">can-access</text>
  <rect x="419.0" y="158.2" width="60.0" height="28.0" rx="14" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="449.0" y="176.7" font-size="12.5" fill="#1E3A8A" text-anchor="middle" font-weight="700">User</text>
  <rect x="509.5" y="158.2" width="60.0" height="28.0" rx="14" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="539.5" y="176.7" font-size="12.5" fill="#1E3A8A" text-anchor="middle" font-weight="700">Group</text>
  <rect x="419.0" y="234.2" width="60.0" height="28.0" rx="14" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="449.0" y="252.7" font-size="12.5" fill="#1E3A8A" text-anchor="middle" font-weight="700">Role A</text>
  <rect x="509.5" y="234.2" width="60.0" height="28.0" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="539.5" y="252.7" font-size="12.5" fill="#5B21B6" text-anchor="middle" font-weight="700">Policy</text>
  <rect x="419.0" y="310.2" width="60.0" height="28.0" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
  <text x="449.0" y="328.7" font-size="12.5" fill="#991B1B" text-anchor="middle" font-weight="700">Role B</text>
  <rect x="509.5" y="310.2" width="60.0" height="28.0" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.4"/>
  <text x="539.5" y="328.7" font-size="12.5" fill="#166534" text-anchor="middle" font-weight="700">Bucket</text>
  <rect x="413.0" y="378.2" width="162.5" height="71.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="494.2" y="400.2" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Runs-as edges</text>
  <text x="494.2" y="421.1" font-size="12" fill="#475569" text-anchor="middle">VM, instance or pod →</text>
  <text x="494.2" y="437.2" font-size="12" fill="#475569" text-anchor="middle">the identity it runs as</text>
  <rect x="413.0" y="457.3" width="162.5" height="71.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="494.2" y="479.3" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Used downstream</text>
  <text x="494.2" y="500.2" font-size="12" fill="#475569" text-anchor="middle">Attack paths join identity,</text>
  <text x="494.2" y="516.3" font-size="12" fill="#475569" text-anchor="middle">network and data edges</text>
  <rect x="601.5" y="52.0" width="178.5" height="671.1" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="690.8" y="74.0" font-size="12" fill="#1D4ED8" text-anchor="middle" font-weight="700">4. FINDINGS AND ACTIONS</text>
  <text x="690.8" y="91.0" font-size="12" fill="#475569" text-anchor="middle">What lands in the console</text>
  <line x1="609.5" y1="104.1" x2="772.0" y2="104.1" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="609.5" y="114.1" width="162.5" height="104.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="690.8" y="136.1" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Escalation and</text>
  <text x="690.8" y="153.0" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">hidden admins</text>
  <text x="690.8" y="173.9" font-size="12" fill="#475569" text-anchor="middle">PassRole · role and</text>
  <text x="690.8" y="190.0" font-size="12" fill="#475569" text-anchor="middle">service-account chains ·</text>
  <text x="690.8" y="206.1" font-size="12" fill="#475569" text-anchor="middle">policy attach or rewrite</text>
  <rect x="609.5" y="226.2" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="690.8" y="248.2" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Risky trust</text>
  <text x="690.8" y="269.1" font-size="12" fill="#475569" text-anchor="middle">External accounts ·</text>
  <text x="690.8" y="285.2" font-size="12" fill="#475569" text-anchor="middle">wildcard · no ExternalId ·</text>
  <text x="690.8" y="301.3" font-size="12" fill="#475569" text-anchor="middle">federation</text>
  <rect x="609.5" y="321.4" width="162.5" height="104.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="690.8" y="343.4" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Unused permissions</text>
  <text x="690.8" y="360.3" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">(AWS, Google Cloud)</text>
  <text x="690.8" y="381.2" font-size="12" fill="#475569" text-anchor="middle">Granted vs used · stale</text>
  <text x="690.8" y="397.3" font-size="12" fill="#475569" text-anchor="middle">roles · high-risk unused</text>
  <text x="690.8" y="413.4" font-size="12" fill="#475569" text-anchor="middle">actions</text>
  <rect x="609.5" y="433.5" width="162.5" height="87.2" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="690.8" y="455.5" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Identity risk score</text>
  <text x="690.8" y="476.4" font-size="12" fill="#475569" text-anchor="middle">0–100 with a breakdown:</text>
  <text x="690.8" y="492.5" font-size="12" fill="#475569" text-anchor="middle">escalation · blast radius ·</text>
  <text x="690.8" y="508.6" font-size="12" fill="#475569" text-anchor="middle">gap</text>
  <rect x="609.5" y="528.7" width="162.5" height="71.1" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="690.8" y="550.7" font-size="13" fill="#1E3A8A" text-anchor="middle" font-weight="700">Access reviews</text>
  <text x="690.8" y="571.6" font-size="12" fill="#475569" text-anchor="middle">Pending → reviewed,</text>
  <text x="690.8" y="587.7" font-size="12" fill="#475569" text-anchor="middle">needs a fix, or deferred</text>
  <text x="690.8" y="619.8" font-size="12" fill="#475569" text-anchor="middle">Severity-ranked ·</text>
  <text x="690.8" y="635.9" font-size="12" fill="#475569" text-anchor="middle">MITRE-tagged · Onam never</text>
  <text x="690.8" y="652.0" font-size="12" fill="#475569" text-anchor="middle">edits your IAM</text>
  <line x1="192.5" y1="387.5" x2="206.5" y2="387.5" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="389.0" y1="387.5" x2="403.0" y2="387.5" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#ah)"/>
