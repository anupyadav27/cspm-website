  <text x="848" y="168" text-anchor="middle" font-size="8" fill="#64748B">root cause + fix</text>

  <line x1="40" y1="200" x2="880" y2="200" stroke="#94A3B8" stroke-width="1"/>
  <text x="460" y="222" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">MONTHLY SLO REPORT — DELIVERED IN YOUR ACCOUNT DASHBOARD</text>
  <text x="460" y="240" text-anchor="middle" font-size="9" fill="#64748B">Monthly uptime % · scan success rate · P95 / P99 API latency · incident count and total downtime minutes ·</text>
  <text x="460" y="254" text-anchor="middle" font-size="9" fill="#64748B">SLA credit eligibility · downloadable as PDF for compliance evidence</text>
  <text x="460" y="270" text-anchor="middle" font-size="9" fill="#64748B">Status page subscriptions: email or SMS alerts for incidents and scheduled maintenance</text>
