<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Arial, sans-serif">
  <rect width="920" height="400" fill="#F8FAFC" rx="10"/>

  <!-- header -->
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">CLOUD IDENTITY &amp; ENTITLEMENT MANAGEMENT — HOW IT WORKS</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <!-- ── COL 1: Identity Types ── -->
  <rect x="16" y="42" width="218" height="342" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="125" y="62" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">IDENTITY TYPES</text>
  <line x1="26" y1="70" x2="224" y2="70" stroke="#CBD5E1" stroke-width="1"/>

  <rect x="30"  y="80"  width="190" height="72" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="125" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Human Identities</text>
  <text x="125" y="119" text-anchor="middle" font-size="9"  fill="#64748B">IAM users · Federated SSO</text>
  <text x="125" y="133" text-anchor="middle" font-size="9"  fill="#64748B">Groups · Assumed roles</text>

  <rect x="30"  y="162" width="190" height="72" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="125" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Machine Identities</text>
  <text x="125" y="201" text-anchor="middle" font-size="9"  fill="#64748B">Service accounts · Lambda roles</text>
  <text x="125" y="215" text-anchor="middle" font-size="9"  fill="#64748B">EC2 instance profiles · Pods</text>

  <rect x="30"  y="244" width="190" height="72" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="125" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Third-party Identities</text>
  <text x="125" y="283" text-anchor="middle" font-size="9"  fill="#64748B">SaaS integrations · CI/CD</text>
  <text x="125" y="297" text-anchor="middle" font-size="9"  fill="#64748B">Cross-account roles · Vendors</text>

  <!-- stat badge -->
  <rect x="46" y="330" width="158" height="42" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="125" y="349" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Avg. 80% of permissions</text>
  <text x="125" y="364" text-anchor="middle" font-size="10" fill="#64748B">never used in production</text>

  <!-- ── ARROW 1 ── -->
  <line x1="234" y1="213" x2="260" y2="213" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="258,207 270,213 258,219" fill="#94A3B8"/>
  <text x="252" y="205" text-anchor="middle" font-size="8" fill="#2563EB">analyze</text>

  <!-- ── COL 2: Risk Analysis ── -->
  <rect x="270" y="42" width="252" height="342" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" rx="10"/>
  <text x="396" y="62" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">RISK ANALYSIS</text>
  <line x1="280" y1="70" x2="512" y2="70" stroke="#CBD5E1" stroke-width="1"/>

  <rect x="284" y="80"  width="224" height="58" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="396" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Overprivileged Identities</text>
  <text x="396" y="120" text-anchor="middle" font-size="9"  fill="#64748B">Permissions granted vs. permissions used (90-day)</text>

  <rect x="284" y="148" width="224" height="58" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="396" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Shadow Admin Paths</text>
  <text x="396" y="188" text-anchor="middle" font-size="9"  fill="#64748B">Indirect admin escalation through policy chains</text>

  <rect x="284" y="216" width="224" height="58" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="396" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Stale Identities</text>
  <text x="396" y="256" text-anchor="middle" font-size="9"  fill="#64748B">90+ days inactive · Ex-employees · Orphaned roles</text>

  <rect x="284" y="284" width="224" height="58" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="396" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Cross-Account Trust</text>
  <text x="396" y="324" text-anchor="middle" font-size="9"  fill="#64748B">Third-party roles · External ID validation</text>

  <!-- ── ARROW 2 ── -->
  <line x1="522" y1="213" x2="548" y2="213" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="546,207 558,213 546,219" fill="#94A3B8"/>
  <text x="540" y="205" text-anchor="middle" font-size="8" fill="#10B981">remediate</text>

  <!-- ── COL 3: Recommended Actions ── -->
  <rect x="558" y="42" width="178" height="342" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="647" y="62" text-anchor="middle" font-size="9" font-weight="700" fill="#059669" letter-spacing="1">RECOMMENDED ACTIONS</text>
  <line x1="568" y1="70" x2="726" y2="70" stroke="#94A3B8" stroke-width="1"/>

  <rect x="572" y="80"  width="150" height="56" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="647" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Right-size Permissions</text>
  <text x="647" y="120" text-anchor="middle" font-size="9"  fill="#64748B">Remove unused · Apply least privilege</text>

  <rect x="572" y="146" width="150" height="56" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="647" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Revoke Stale Access</text>
  <text x="647" y="186" text-anchor="middle" font-size="9"  fill="#64748B">Disable inactive accounts and roles</text>

  <rect x="572" y="212" width="150" height="56" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="647" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Break Escalation Paths</text>
  <text x="647" y="252" text-anchor="middle" font-size="9"  fill="#64748B">Remove indirect admin chains</text>

  <rect x="572" y="278" width="150" height="56" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="647" y="302" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Audit Third-party Access</text>
  <text x="647" y="318" text-anchor="middle" font-size="9"  fill="#64748B">Validate external IDs · Scope roles</text>

  <!-- ── COL 4: Outcomes ── -->
  <rect x="748" y="42" width="156" height="342" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="826" y="62" text-anchor="middle" font-size="9" font-weight="700" fill="#059669" letter-spacing="1">OUTCOMES</text>
  <line x1="758" y1="70" x2="894" y2="70" stroke="#94A3B8" stroke-width="1"/>

  <rect x="762" y="82"  width="128" height="38" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="826" y="99"  text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Access Graph</text>
  <text x="826" y="113" text-anchor="middle" font-size="9"  fill="#64748B">Visual identity map</text>

  <rect x="762" y="130" width="128" height="38" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="826" y="147" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Risk Scores</text>
  <text x="826" y="161" text-anchor="middle" font-size="9"  fill="#64748B">Per identity 0–100</text>

  <rect x="762" y="178" width="128" height="38" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="826" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">MITRE Mapping</text>
  <text x="826" y="209" text-anchor="middle" font-size="9"  fill="#64748B">ATT&amp;CK technique IDs</text>

  <rect x="762" y="226" width="128" height="38" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="826" y="243" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Compliance Report</text>
  <text x="826" y="257" text-anchor="middle" font-size="9"  fill="#64748B">SOC 2 · ISO · PCI-DSS</text>

  <rect x="762" y="274" width="128" height="38" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="826" y="291" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Remediation PRs</text>
  <text x="826" y="305" text-anchor="middle" font-size="9"  fill="#64748B">IAM policy diffs ready</text>

  <rect x="762" y="322" width="128" height="50" fill="#FFFFFF" rx="6" stroke="#CBD5E1" stroke-width="1"/>
  <text x="826" y="344" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">90-Day Trend</text>
  <text x="826" y="359" text-anchor="middle" font-size="9"  fill="#64748B">Overpriv. % over time</text>
</svg>
