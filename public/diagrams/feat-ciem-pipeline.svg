<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="Arial, sans-serif">
  <rect width="920" height="430" fill="#F8FAFC" rx="10"/>

  <!-- header -->
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">HOW CIEM WORKS — FROM IAM CONFIGURATION TO IDENTITY RISK FINDINGS</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <!-- ── COLUMN 1: COLLECT ── -->
  <rect x="16" y="48" width="262" height="354" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="147" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">1. COLLECT</text>
  <text x="147" y="82" text-anchor="middle" font-size="8" fill="#64748B">What the platform reads from your cloud</text>
  <line x1="26" y1="90" x2="268" y2="90" stroke="#CBD5E1" stroke-width="1"/>

  <!-- input 1: IAM policies -->
  <rect x="32" y="106" width="230" height="74" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="147" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">IAM Policies</text>
  <text x="147" y="146" text-anchor="middle" font-size="9" fill="#64748B">Identity policies · Resource policies</text>
  <text x="147" y="160" text-anchor="middle" font-size="9" fill="#64748B">SCPs · Permission boundaries</text>
  <text x="147" y="174" text-anchor="middle" font-size="9" fill="#64748B">Trust relationships</text>

  <!-- input 2: usage logs -->
  <rect x="32" y="190" width="230" height="74" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="147" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Usage History</text>
  <text x="147" y="230" text-anchor="middle" font-size="9" fill="#64748B">CloudTrail · Activity Logs</text>
  <text x="147" y="244" text-anchor="middle" font-size="9" fill="#64748B">Audit logs · Service usage</text>
  <text x="147" y="258" text-anchor="middle" font-size="9" fill="#64748B">Last 90 days of activity</text>

  <!-- input 3: identity catalog -->
  <rect x="32" y="274" width="230" height="74" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="147" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Identity Catalog</text>
  <text x="147" y="314" text-anchor="middle" font-size="9" fill="#64748B">Users · Groups · Roles</text>
  <text x="147" y="328" text-anchor="middle" font-size="9" fill="#64748B">Service accounts · Workload identities</text>
  <text x="147" y="342" text-anchor="middle" font-size="9" fill="#64748B">Federated &amp; cross-account</text>

  <!-- footer note -->
  <text x="147" y="378" text-anchor="middle" font-size="8" fill="#64748B">Read-only · agentless ·</text>
  <text x="147" y="390" text-anchor="middle" font-size="8" fill="#64748B">no changes to your environment</text>

  <!-- ── arrow column 1 → column 2 ── -->
  <line x1="278" y1="225" x2="306" y2="225" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="304,220 314,225 304,230" fill="#94A3B8"/>

  <!-- ── COLUMN 2: ANALYZE ── -->
  <rect x="316" y="48" width="288" height="354" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="460" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#3730A3" letter-spacing="1">2. ANALYZE</text>
  <text x="460" y="82" text-anchor="middle" font-size="8" fill="#64748B">What the platform calculates</text>
  <line x1="326" y1="90" x2="594" y2="90" stroke="#94A3B8" stroke-width="1"/>

  <!-- analysis 1: effective permissions -->
  <rect x="332" y="106" width="256" height="58" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="460" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Effective Permissions</text>
  <text x="460" y="142" text-anchor="middle" font-size="9" fill="#C7D2FE">Resolves intersection across</text>
  <text x="460" y="155" text-anchor="middle" font-size="9" fill="#C7D2FE">all 5 AWS policy sources</text>

  <!-- analysis 2: used permissions -->
  <rect x="332" y="172" width="256" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="460" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#3730A3">Used Permissions</text>
  <text x="460" y="208" text-anchor="middle" font-size="9" fill="#475569">What this identity actually called</text>
  <text x="460" y="221" text-anchor="middle" font-size="9" fill="#475569">in the last 90 days</text>

  <!-- analysis 3: unused permissions -->
  <rect x="332" y="238" width="256" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="460" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#3730A3">Unused Permissions</text>
  <text x="460" y="274" text-anchor="middle" font-size="9" fill="#475569">Granted but never exercised</text>
  <text x="460" y="287" text-anchor="middle" font-size="9" fill="#475569">→ candidates for removal</text>

  <!-- analysis 4: attack paths -->
  <rect x="332" y="304" width="256" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="460" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#3730A3">Identity Attack Paths</text>
  <text x="460" y="340" text-anchor="middle" font-size="9" fill="#475569">Multi-hop role-assumption chains</text>
  <text x="460" y="353" text-anchor="middle" font-size="9" fill="#475569">that reach admin</text>

  <!-- footer -->
  <text x="460" y="386" text-anchor="middle" font-size="8" fill="#64748B">Identity-by-identity · re-run on every scan</text>

  <!-- ── arrow column 2 → column 3 ── -->
  <line x1="604" y1="225" x2="632" y2="225" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="630,220 640,225 630,230" fill="#94A3B8"/>

  <!-- ── COLUMN 3: OUTPUT ── -->
  <rect x="642" y="48" width="262" height="354" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="773" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">3. FINDINGS</text>
  <text x="773" y="82" text-anchor="middle" font-size="8" fill="#64748B">What you see in the dashboard</text>
  <line x1="652" y1="90" x2="894" y2="90" stroke="#94A3B8" stroke-width="1"/>

  <!-- finding 1: overprivileged -->
  <rect x="658" y="106" width="230" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <circle cx="678" cy="125" r="6" fill="#EF4444"/>
  <text x="773" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#64748B">Overprivileged Identities</text>
  <text x="773" y="142" text-anchor="middle" font-size="9" fill="#475569">Least-privilege gap score 0–100</text>
  <text x="773" y="156" text-anchor="middle" font-size="9" fill="#475569">with suggested remediation policy</text>

  <!-- finding 2: shadow admins -->
  <rect x="658" y="174" width="230" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <circle cx="678" cy="193" r="6" fill="#EF4444"/>
  <text x="773" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#64748B">Shadow Admins</text>
  <text x="773" y="210" text-anchor="middle" font-size="9" fill="#475569">Indirect paths to admin via</text>
  <text x="773" y="224" text-anchor="middle" font-size="9" fill="#475569">role assumption chains</text>

  <!-- finding 3: stale access -->
  <rect x="658" y="242" width="230" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <circle cx="678" cy="261" r="6" fill="#F59E0B"/>
  <text x="773" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#64748B">Stale Access</text>
  <text x="773" y="278" text-anchor="middle" font-size="9" fill="#475569">90+ days inactive identities</text>
  <text x="773" y="292" text-anchor="middle" font-size="9" fill="#475569">unrotated keys · ex-employee accounts</text>

  <!-- finding 4: cross-account -->
  <rect x="658" y="310" width="230" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <circle cx="678" cy="329" r="6" fill="#F59E0B"/>
  <text x="773" y="329" text-anchor="middle" font-size="11" font-weight="700" fill="#64748B">Cross-Account Risks</text>
  <text x="773" y="346" text-anchor="middle" font-size="9" fill="#475569">Trust relationships with</text>
  <text x="773" y="360" text-anchor="middle" font-size="9" fill="#475569">unknown or external accounts</text>

  <!-- footer -->
  <text x="773" y="390" text-anchor="middle" font-size="8" fill="#64748B">Severity-ranked · MITRE-mapped · exportable</text>
</svg>
