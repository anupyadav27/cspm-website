  <text x="122" y="236" text-anchor="middle" fill="#64748B" font-size="8">Identity posture · MFA · Policies</text>

  <!-- Network Security -->
  <rect x="236" y="196" width="204" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="338" y="220" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">Network Security</text>
  <text x="338" y="236" text-anchor="middle" fill="#64748B" font-size="8">7-layer topology · SG · VPC</text>

  <!-- CIEM -->
  <rect x="452" y="196" width="204" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="554" y="220" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">CIEM</text>
  <text x="554" y="236" text-anchor="middle" fill="#64748B" font-size="8">Entitlements · CloudTrail</text>

  <!-- Data Security -->
  <rect x="668" y="196" width="232" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="784" y="220" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">Data Security</text>
  <text x="784" y="236" text-anchor="middle" fill="#64748B" font-size="8">DSPM · S3 classification</text>

  <!-- Row 3b: Security Engines bottom -->
  <!-- Compliance -->
  <rect x="20" y="260" width="204" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="122" y="284" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">Compliance</text>
  <text x="122" y="300" text-anchor="middle" fill="#64748B" font-size="8">78 frameworks · CIS · NIST</text>

  <!-- Risk Engine -->
  <rect x="236" y="260" width="204" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="338" y="284" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">Risk Engine</text>
  <text x="338" y="300" text-anchor="middle" fill="#64748B" font-size="8">FAIR model · 0–100 score</text>

  <!-- Vulnerability -->
  <rect x="452" y="260" width="204" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="554" y="284" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">Vulnerability</text>
  <text x="554" y="300" text-anchor="middle" fill="#64748B" font-size="8">CVE · SBOM · Agent-based</text>

  <!-- Container Sec -->
  <rect x="668" y="260" width="232" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="784" y="284" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">Container Security</text>
  <text x="784" y="300" text-anchor="middle" fill="#64748B" font-size="8">EKS · K8s RBAC · Images</text>

  <!-- Arrow Row3 -> Row4 -->
  <line x1="460" y1="316" x2="460" y2="332" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="455,330 465,330 460,336" fill="#94A3B8"/>

  <!-- Row 4: Data Platform -->
  <rect x="20" y="336" width="880" height="46" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="460" y="356" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Data Platform</text>
  <text x="460" y="372" text-anchor="middle" fill="#64748B" font-size="9">PostgreSQL (per-engine) · Neo4j (security graph) · Redis (cache) · S3 (exports)</text>

  <!-- Arrow Row4 -> Row5 -->
  <line x1="460" y1="382" x2="460" y2="396" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="455,394 465,394 460,400" fill="#94A3B8"/>

  <!-- Row 5: Output -->
  <rect x="20" y="400" width="880" height="52" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="460" y="422" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Posture Score + Compliance Reports + Threat Findings + Remediation Guidance</text>
  <text x="460" y="440" text-anchor="middle" fill="#64748B" font-size="9">Continuous · Real-time · 78 compliance frameworks · 0–100 risk score</text>

  <!-- Footer -->
  <text x="460" y="530" text-anchor="middle" fill="#94A3B8" font-size="8">Onam CSPM Platform — Cloud Scan Pipeline Architecture</text>
