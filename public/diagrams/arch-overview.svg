<svg xmlns="http://www.w3.org/2000/svg" width="920" height="504" viewBox="0 36 920 504" font-family="Arial, sans-serif">
  <!-- Canvas -->
  <rect width="920" height="504" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" rx="10"/>

  <!-- Title -->
