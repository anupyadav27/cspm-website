  <text x="465" y="152" text-anchor="middle" fill="#64748B" font-size="9">1,900+ rules</text>

  <!-- Arrow 3->4 -->
  <line x1="543" y1="140" x2="559" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="557,136 565,140 557,144" fill="#94A3B8"/>

  <!-- Box 4: Threat -->
  <rect x="563" y="113" width="155" height="55" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="640" y="136" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Threat</text>
  <text x="640" y="152" text-anchor="middle" fill="#64748B" font-size="9">MITRE ATT&amp;CK</text>

  <!-- Arrow 4->5 -->
  <line x1="718" y1="140" x2="734" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="732,136 740,140 732,144" fill="#94A3B8"/>

  <!-- Box 5: Analysis -->
  <rect x="738" y="113" width="155" height="55" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="815" y="136" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Analysis</text>
  <text x="815" y="152" text-anchor="middle" fill="#64748B" font-size="9">All engines</text>

  <!-- Connector Row2 -> Row3 -->
  <line x1="460" y1="168" x2="460" y2="190" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="455,188 465,188 460,194" fill="#94A3B8"/>

