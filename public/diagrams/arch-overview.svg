  <line x1="20" y1="28" x2="900" y2="28" stroke="#94A3B8" stroke-width="1"/>

  <!-- Row 1: Cloud Provider Badges -->
  <!-- Badge 1: AWS -->
  <rect x="20" y="34" width="118" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="79" y="58" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">AWS</text>
  <!-- Badge 2: Azure -->
  <rect x="144" y="34" width="118" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="203" y="58" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">Azure</text>
  <!-- Badge 3: GCP -->
  <rect x="268" y="34" width="118" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="327" y="58" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">GCP</text>
  <!-- Badge 4: OCI -->
  <rect x="392" y="34" width="118" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="451" y="58" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">OCI</text>
  <!-- Badge 5: AliCloud -->
  <rect x="516" y="34" width="118" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="575" y="58" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">AliCloud</text>
  <!-- Badge 6: IBM Cloud -->
  <rect x="640" y="34" width="118" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="699" y="58" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">IBM Cloud</text>
  <!-- Badge 7: Kubernetes -->
  <rect x="764" y="34" width="118" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="823" y="58" text-anchor="middle" fill="#1E3A8A" font-size="10" font-weight="700">Kubernetes</text>

  <!-- 7 cloud providers label -->
  <text x="460" y="90" text-anchor="middle" fill="#3B82F6" font-size="8">7 cloud providers</text>

  <!-- Connector arrow row1 -> row2 -->
  <line x1="460" y1="94" x2="460" y2="104" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="455,104 465,104 460,110" fill="#94A3B8"/>
  <text x="460" y="102" text-anchor="middle" fill="#64748B" font-size="8">Read-only API · No agents · Continuous</text>

  <!-- Row 2: Core Pipeline -->
  <!-- Box 1: Discovery -->
  <rect x="38" y="113" width="155" height="55" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="120" y="136" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Discovery</text>
  <text x="120" y="152" text-anchor="middle" fill="#64748B" font-size="9">#8001</text>

  <!-- Arrow 1->2 -->
  <line x1="193" y1="140" x2="209" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="207,136 215,140 207,144" fill="#94A3B8"/>

  <!-- Box 2: Inventory -->
  <rect x="213" y="113" width="155" height="55" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="290" y="136" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Inventory</text>
  <text x="290" y="152" text-anchor="middle" fill="#64748B" font-size="9">#8022</text>

  <!-- Arrow 2->3 -->
  <line x1="368" y1="140" x2="384" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="382,136 390,140 382,144" fill="#94A3B8"/>

  <!-- Box 3: Check -->
  <rect x="388" y="113" width="155" height="55" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
