<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Onam Operations — the specialist agents and their levels</title>
  <desc id="d">An orchestrator routes work to read-and-recommend agents (Asset, Security, Compliance, Data, FinOps, DR) and to proposing agents (Architecture, Automation planner). Proposals pass a human approval gate before the Automation actor may execute. Each agent is marked early access, in development or on the roadmap.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="960" height="560" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="30" y="34" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="1.4">THE AGENT TEAM · WHO MAY DO WHAT</text>

  <!-- legend -->
  <g font-size="10.5">
    <rect x="560" y="22" width="12" height="12" rx="3" fill="#EFF4FF" stroke="#2563EB"/><text x="578" y="32" fill="#334155">Early access</text>
    <rect x="660" y="22" width="12" height="12" rx="3" fill="#FFFBEB" stroke="#B45309"/><text x="678" y="32" fill="#334155">In development</text>
    <rect x="778" y="22" width="12" height="12" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="3 2"/><text x="796" y="32" fill="#334155">On the roadmap</text>
  </g>

  <!-- orchestrator -->
  <rect x="250" y="52" width="460" height="56" rx="10" fill="#082869"/>
  <text x="480" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Orchestrator · L4</text>
  <text x="480" y="96" text-anchor="middle" font-size="11" fill="#CBD5E1">intent · plan · route · aggregate · surface conflicts — reads no estate data</text>
  <rect x="722" y="66" width="92" height="22" rx="11" fill="#EFF4FF" stroke="#2563EB"/>
  <text x="768" y="81" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4ED8">Early access</text>

  <line x1="480" y1="108" x2="480" y2="128" stroke="#64748B" stroke-width="1.5"/>
  <line x1="95" y1="128" x2="865" y2="128" stroke="#64748B" stroke-width="1.5"/>

  <!-- L1 row -->
  <text x="30" y="274" font-size="11" font-weight="700" fill="#334155">L1 · INVESTIGATE — read and recommend, change nothing</text>
  <g font-size="11" text-anchor="middle">
    <line x1="95" y1="128" x2="95" y2="160" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="25" y="162" width="140" height="92" rx="8" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="25" y="162" width="5" height="92" fill="#0F766E"/>
    <text x="97" y="186" font-size="13" font-weight="700" fill="#0B1220">Asset</text>
    <text x="97" y="204" fill="#475569">what exists, how it</text><text x="97" y="218" fill="#475569">connects, who owns it</text>
    <text x="97" y="242" font-size="10" font-weight="700" fill="#1D4ED8">EARLY ACCESS</text>

    <line x1="249" y1="128" x2="249" y2="160" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="179" y="162" width="140" height="92" rx="8" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="179" y="162" width="5" height="92" fill="#1D4ED8"/>
    <text x="251" y="186" font-size="13" font-weight="700" fill="#0B1220">Security</text>
    <text x="251" y="204" fill="#475569">what is exposed,</text><text x="251" y="218" fill="#475569">reachable, risky</text>
    <text x="251" y="242" font-size="10" font-weight="700" fill="#1D4ED8">EARLY ACCESS</text>

    <line x1="403" y1="128" x2="403" y2="160" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="333" y="162" width="140" height="92" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
    <rect x="333" y="162" width="5" height="92" fill="#4338CA"/>
    <text x="405" y="186" font-size="13" font-weight="700" fill="#0B1220">Compliance</text>
    <text x="405" y="204" fill="#475569">which controls hold,</text><text x="405" y="218" fill="#475569">with evidence</text>
    <text x="405" y="242" font-size="10" font-weight="700" fill="#B45309">IN DEVELOPMENT</text>

    <line x1="557" y1="128" x2="557" y2="160" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="487" y="162" width="140" height="92" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
    <rect x="487" y="162" width="5" height="92" fill="#7C3AED"/>
    <text x="559" y="186" font-size="13" font-weight="700" fill="#0B1220">Data</text>
    <text x="559" y="204" fill="#475569">what data is where,</text><text x="559" y="218" fill="#475569">and who can reach it</text>
    <text x="559" y="242" font-size="10" font-weight="700" fill="#B45309">IN DEVELOPMENT</text>

    <line x1="711" y1="128" x2="711" y2="160" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="641" y="162" width="140" height="92" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="641" y="162" width="5" height="92" fill="#047857"/>
    <text x="713" y="186" font-size="13" font-weight="700" fill="#0B1220">FinOps</text>
    <text x="713" y="204" fill="#475569">what it costs, and is</text><text x="713" y="218" fill="#475569">removing it safe</text>
    <text x="713" y="242" font-size="10" font-weight="700" fill="#475569">ON THE ROADMAP</text>

    <line x1="865" y1="128" x2="865" y2="160" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="795" y="162" width="140" height="92" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="795" y="162" width="5" height="92" fill="#0369A1"/>
    <text x="867" y="186" font-size="13" font-weight="700" fill="#0B1220">DR</text>
    <text x="867" y="204" fill="#475569">what would come</text><text x="867" y="218" fill="#475569">back, and how fast</text>
    <text x="867" y="242" font-size="10" font-weight="700" fill="#475569">ON THE ROADMAP</text>
  </g>

  <!-- L2 row -->
  <text x="30" y="296" font-size="11" font-weight="700" fill="#334155">L2 · PROPOSE — write a proposal, never apply it</text>
  <line x1="480" y1="254" x2="480" y2="300" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="490" y="274" font-size="10" fill="#64748B">a recommendation that needs a change escalates to the planner</text>
  <g font-size="11" text-anchor="middle">
    <rect x="160" y="302" width="250" height="78" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="160" y="302" width="5" height="78" fill="#B45309"/>
    <text x="287" y="326" font-size="13" font-weight="700" fill="#0B1220">Architecture</text>
    <text x="287" y="344" fill="#475569">is the design sound, what should change</text>
    <text x="287" y="368" font-size="10" font-weight="700" fill="#475569">ON THE ROADMAP</text>

    <rect x="550" y="302" width="250" height="78" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
    <rect x="550" y="302" width="5" height="78" fill="#BE185D"/>
    <text x="677" y="326" font-size="13" font-weight="700" fill="#0B1220">Automation — planner</text>
    <text x="677" y="344" fill="#475569">exact change · rollback · blast radius · dry run</text>
    <text x="677" y="368" font-size="10" font-weight="700" fill="#B45309">IN DEVELOPMENT</text>
  </g>

  <!-- gate -->
  <line x1="287" y1="380" x2="430" y2="420" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="677" y1="380" x2="532" y2="420" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
  <polygon points="380,422 580,422 600,446 580,470 380,470 360,446" fill="#16A34A"/>
  <text x="480" y="443" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Human approval</text>
  <text x="480" y="460" text-anchor="middle" font-size="10.5" fill="#ECFDF5">a named person · this exact change</text>
  <text x="620" y="442" font-size="10.5" fill="#065F46">Agents can never approve —</text>
  <text x="620" y="457" font-size="10.5" fill="#065F46">the database refuses it.</text>

  <!-- L3 -->
  <text x="30" y="500" font-size="11" font-weight="700" fill="#334155">L3 · ACT — only from an approval record</text>
  <line x1="480" y1="470" x2="480" y2="484" stroke="#64748B" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="330" y="486" width="300" height="60" rx="8" fill="#F1F5F9" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="330" y="486" width="5" height="60" fill="#BE185D"/>
  <text x="482" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#0B1220">Automation — actor</text>
  <text x="482" y="525" text-anchor="middle" font-size="11" fill="#475569">apply in a sandbox · validate · roll back on failure</text>
  <text x="482" y="540" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">ON THE ROADMAP · built, enabled for no customer</text>
</svg>
