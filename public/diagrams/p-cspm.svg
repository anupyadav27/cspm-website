<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 416" width="380" height="416" font-family="Arial, sans-serif">
  <rect width="380" height="416" fill="#F8FAFC" rx="10" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Step 1 -->
  <rect x="20" y="10" width="340" height="66" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="7"/>
  <text x="190" y="35" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Connect Cloud Accounts</text>
