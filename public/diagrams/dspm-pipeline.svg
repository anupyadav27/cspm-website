<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How Onam Security DSPM works</title>
  <desc id="d">Five stages: data stores, discovery, metadata classification, the access and exposure join, and findings.</desc>
  <rect width="960" height="470" fill="#F8FAFC" rx="10"/>

  <text x="480" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">HOW DSPM WORKS — FROM DATA STORES TO FINDINGS ON THE SECURITY GRAPH</text>
  <line x1="16" y1="34" x2="944" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <!-- ── 1. DATA STORES ── -->
  <rect x="16" y="48" width="170" height="370" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="101" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">1. DATA STORES</text>
  <text x="101" y="82" text-anchor="middle" font-size="8" fill="#64748B">What gets analysed</text>
  <line x1="26" y1="90" x2="176" y2="90" stroke="#CBD5E1" stroke-width="1"/>

  <rect x="26" y="100" width="150" height="66" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" rx="8"/>
  <text x="101" y="119" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Object storage</text>
  <text x="101" y="135" text-anchor="middle" font-size="8" fill="#64748B">S3 · Azure Storage</text>
  <text x="101" y="147" text-anchor="middle" font-size="8" fill="#64748B">Cloud Storage · OCI · OSS</text>
  <text x="101" y="159" text-anchor="middle" font-size="8" fill="#64748B">IBM Cloud Object Storage</text>

  <rect x="26" y="174" width="150" height="66" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" rx="8"/>
  <text x="101" y="193" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Databases</text>
  <text x="101" y="209" text-anchor="middle" font-size="8" fill="#64748B">RDS · DynamoDB · Redshift</text>
  <text x="101" y="221" text-anchor="middle" font-size="8" fill="#64748B">Azure SQL · Cosmos DB</text>
  <text x="101" y="233" text-anchor="middle" font-size="8" fill="#64748B">Cloud SQL · BigQuery · Spanner</text>

  <rect x="26" y="248" width="150" height="66" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" rx="8"/>
  <text x="101" y="267" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Streams &amp; Kubernetes</text>
  <text x="101" y="283" text-anchor="middle" font-size="8" fill="#64748B">Kinesis · OCI Streaming</text>
  <text x="101" y="295" text-anchor="middle" font-size="8" fill="#64748B">Event Streams</text>
  <text x="101" y="307" text-anchor="middle" font-size="8" fill="#64748B">Secrets · ConfigMaps · PVCs</text>

  <rect x="26" y="322" width="150" height="66" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" rx="8"/>
  <text x="101" y="341" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Self-hosted databases</text>
  <text x="101" y="357" text-anchor="middle" font-size="8" fill="#64748B">PostgreSQL · MySQL · MongoDB</text>
  <text x="101" y="369" text-anchor="middle" font-size="8" fill="#64748B">Oracle · SQL Server · Snowflake</text>
  <text x="101" y="381" text-anchor="middle" font-size="8" fill="#64748B">onboarded as technology accounts</text>

  <text x="101" y="406" text-anchor="middle" font-size="8" fill="#64748B">Seven clouds plus self-hosted</text>

  <!-- arrow -->
  <line x1="186" y1="233" x2="196" y2="233" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="195,228 204,233 195,238" fill="#94A3B8"/>

  <!-- ── 2. DISCOVER ── -->
  <rect x="206" y="48" width="170" height="370" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="291" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">2. DISCOVER</text>
  <text x="291" y="82" text-anchor="middle" font-size="8" fill="#64748B">Configuration, not contents</text>
  <line x1="216" y1="90" x2="366" y2="90" stroke="#CBD5E1" stroke-width="1"/>

  <rect x="216" y="100" width="150" height="104" fill="#EFF4FF" stroke="#C7D2FE" stroke-width="1.2" rx="8"/>
  <text x="291" y="119" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Read-only cloud roles</text>
  <text x="291" y="137" text-anchor="middle" font-size="8" fill="#475569">The same posture scan that</text>
  <text x="291" y="149" text-anchor="middle" font-size="8" fill="#475569">feeds CSPM inventories each</text>
  <text x="291" y="161" text-anchor="middle" font-size="8" fill="#475569">store and its settings.</text>
  <text x="291" y="181" text-anchor="middle" font-size="8" fill="#475569">No object or row is opened.</text>

  <text x="226" y="228" font-size="8" font-weight="700" fill="#334155">Recorded per store</text>
  <text x="226" y="246" font-size="8" fill="#64748B">• Encryption settings &amp; key</text>
  <text x="226" y="262" font-size="8" fill="#64748B">• Bucket policy, ACLs, public-</text>
  <text x="232" y="274" font-size="8" fill="#64748B">access block, public flags</text>
  <text x="226" y="290" font-size="8" fill="#64748B">• Access logging</text>
  <text x="226" y="306" font-size="8" fill="#64748B">• Versioning, lifecycle, backup</text>
  <text x="232" y="318" font-size="8" fill="#64748B">retention, point-in-time restore</text>
  <text x="226" y="334" font-size="8" fill="#64748B">• Region and account</text>
  <text x="226" y="350" font-size="8" fill="#64748B">• Name, tags, description</text>
  <text x="226" y="366" font-size="8" fill="#64748B">• Relationships to other</text>
  <text x="232" y="378" font-size="8" fill="#64748B">resources (for lineage)</text>

  <line x1="376" y1="233" x2="386" y2="233" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="385,228 394,233 385,238" fill="#94A3B8"/>

  <!-- ── 3. CLASSIFY ── -->
  <rect x="396" y="48" width="170" height="370" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="481" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#3730A3" letter-spacing="1">3. CLASSIFY</text>
  <text x="481" y="82" text-anchor="middle" font-size="8" fill="#64748B">From metadata only</text>
  <line x1="406" y1="90" x2="556" y2="90" stroke="#CBD5E1" stroke-width="1"/>

  <text x="416" y="110" font-size="8" font-weight="700" fill="#334155">Signals read</text>
  <text x="416" y="126" font-size="8" fill="#64748B">• Store names and descriptions</text>
  <text x="416" y="140" font-size="8" fill="#64748B">• Tags</text>
  <text x="416" y="154" font-size="8" fill="#64748B">• Database and schema names</text>
  <text x="416" y="168" font-size="8" fill="#64748B">• Rule metadata on findings</text>

  <text x="416" y="194" font-size="8" font-weight="700" fill="#334155">Labels</text>
  <rect x="416" y="202" width="40" height="18" rx="9" fill="#FDECEA"/>
  <text x="436" y="214" text-anchor="middle" font-size="8" font-weight="700" fill="#B91C1C">PII</text>
  <rect x="460" y="202" width="40" height="18" rx="9" fill="#FDECEA"/>
  <text x="480" y="214" text-anchor="middle" font-size="8" font-weight="700" fill="#B91C1C">PHI</text>
  <rect x="504" y="202" width="40" height="18" rx="9" fill="#FDECEA"/>
  <text x="524" y="214" text-anchor="middle" font-size="8" font-weight="700" fill="#B91C1C">PCI</text>
  <rect x="416" y="226" width="62" height="18" rx="9" fill="#FEF3C7"/>
  <text x="447" y="238" text-anchor="middle" font-size="8" font-weight="700" fill="#92400E">FINANCIAL</text>
  <rect x="482" y="226" width="74" height="18" rx="9" fill="#FEF3C7"/>
  <text x="519" y="238" text-anchor="middle" font-size="8" font-weight="700" fill="#92400E">CONFIDENTIAL</text>

  <rect x="406" y="262" width="150" height="122" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.2" rx="8"/>
  <text x="481" y="281" text-anchor="middle" font-size="9" font-weight="700" fill="#9A3412">The limit, stated plainly</text>
  <text x="481" y="299" text-anchor="middle" font-size="8" fill="#7C2D12">Contents are not read.</text>
  <text x="481" y="313" text-anchor="middle" font-size="8" fill="#7C2D12">A bucket named "exports"</text>
  <text x="481" y="327" text-anchor="middle" font-size="8" fill="#7C2D12">holding customer records</text>
  <text x="481" y="341" text-anchor="middle" font-size="8" fill="#7C2D12">gets no label until it is</text>
  <text x="481" y="355" text-anchor="middle" font-size="8" fill="#7C2D12">named or tagged for what</text>
  <text x="481" y="369" text-anchor="middle" font-size="8" fill="#7C2D12">it holds.</text>

  <line x1="566" y1="233" x2="576" y2="233" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="575,228 584,233 575,238" fill="#94A3B8"/>

  <!-- ── 4. JOIN ── -->
  <rect x="586" y="48" width="170" height="370" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="671" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">4. JOIN</text>
  <text x="671" y="82" text-anchor="middle" font-size="8" fill="#64748B">Who and what can reach it</text>
  <line x1="596" y1="90" x2="746" y2="90" stroke="#CBD5E1" stroke-width="1"/>

  <rect x="596" y="100" width="150" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" rx="8"/>
  <text x="671" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#1E3A8A">Public exposure</text>
  <text x="671" y="134" text-anchor="middle" font-size="8" fill="#64748B">Policy status, ACL grants,</text>
  <text x="671" y="146" text-anchor="middle" font-size="8" fill="#64748B">wildcard principals</text>

  <rect x="596" y="162" width="150" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" rx="8"/>
  <text x="671" y="180" text-anchor="middle" font-size="9" font-weight="700" fill="#1E3A8A">Cross-account grants</text>
  <text x="671" y="196" text-anchor="middle" font-size="8" fill="#64748B">Bucket policies that allow</text>
  <text x="671" y="208" text-anchor="middle" font-size="8" fill="#64748B">other accounts in</text>

  <rect x="596" y="224" width="150" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" rx="8"/>
  <text x="671" y="242" text-anchor="middle" font-size="9" font-weight="700" fill="#1E3A8A">Observed access</text>
  <text x="671" y="258" text-anchor="middle" font-size="8" fill="#64748B">Who touched it in the last</text>
  <text x="671" y="270" text-anchor="middle" font-size="8" fill="#64748B">30 days, from audit events</text>

  <rect x="596" y="286" width="150" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" rx="8"/>
  <text x="671" y="304" text-anchor="middle" font-size="9" font-weight="700" fill="#1E3A8A">Encryption &amp; keys</text>
  <text x="671" y="320" text-anchor="middle" font-size="8" fill="#64748B">Unencrypted, or on a</text>
  <text x="671" y="332" text-anchor="middle" font-size="8" fill="#64748B">provider-managed key</text>

  <rect x="596" y="348" width="150" height="56" fill="#EFF4FF" stroke="#C7D2FE" stroke-width="1.2" rx="8"/>
  <text x="671" y="366" text-anchor="middle" font-size="9" font-weight="700" fill="#1E3A8A">Identity &amp; attack paths</text>
  <text x="671" y="382" text-anchor="middle" font-size="8" fill="#475569">Sensitive stores become the</text>
  <text x="671" y="394" text-anchor="middle" font-size="8" fill="#475569">targets attack paths end at</text>

  <line x1="756" y1="233" x2="766" y2="233" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="765,228 774,233 765,238" fill="#94A3B8"/>

  <!-- ── 5. FINDINGS ── -->
  <rect x="776" y="48" width="168" height="370" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="860" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">5. FINDINGS</text>
  <text x="860" y="82" text-anchor="middle" font-size="8" fill="#64748B">Per store, every scan</text>
  <line x1="786" y1="90" x2="934" y2="90" stroke="#CBD5E1" stroke-width="1"/>

  <text x="792" y="110" font-size="8" fill="#334155">• Classification</text>
  <text x="792" y="126" font-size="8" fill="#334155">• Encryption posture</text>
  <text x="792" y="142" font-size="8" fill="#334155">• Access control</text>
  <text x="792" y="158" font-size="8" fill="#334155">• Data residency</text>
  <text x="792" y="174" font-size="8" fill="#334155">• Activity logging</text>
  <text x="792" y="190" font-size="8" fill="#334155">• Lifecycle &amp; backup</text>
  <text x="792" y="206" font-size="8" fill="#334155">• Lineage</text>
  <text x="792" y="222" font-size="8" fill="#334155">• Governance score 0–100</text>

  <rect x="786" y="240" width="148" height="164" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="860" y="258" text-anchor="middle" font-size="8" font-weight="700" fill="#334155">Shared with other engines</text>
  <text x="796" y="278" font-size="8" fill="#475569">→ Attack Path: sensitive,</text>
  <text x="806" y="290" font-size="8" fill="#475569">public, unencrypted</text>
  <text x="796" y="310" font-size="8" fill="#475569">→ Database Security:</text>
  <text x="806" y="322" font-size="8" fill="#475569">labels rank databases</text>
  <text x="796" y="342" font-size="8" fill="#475569">→ Encryption: sensitive</text>
  <text x="806" y="354" font-size="8" fill="#475569">data on weak keys</text>
  <text x="796" y="374" font-size="8" fill="#475569">→ Compliance: GDPR,</text>
  <text x="806" y="386" font-size="8" fill="#475569">HIPAA, PCI DSS mapping</text>

  <text x="480" y="446" text-anchor="middle" font-size="8" fill="#64748B">Posture scanning connects through read-only cloud roles. Classification reads metadata; it does not open files or query rows.</text>
</svg>
