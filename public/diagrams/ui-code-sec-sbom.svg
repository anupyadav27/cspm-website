<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Illustrative view of an SBOM result in the Onam console</title>
  <desc id="d">A stylised illustration, not a screenshot. It shows summary tiles for total components, vulnerable packages, total CVEs and license types, then a vulnerable packages table with package, package URL, CVE count, risk level and license. Package names and figures are invented examples.</desc>
  <rect width="920" height="440" fill="#E2E8F0" rx="12"/>
  <rect x="10" y="10" width="900" height="420" fill="#FFFFFF" rx="10"/>
  <rect x="10" y="10" width="900" height="34" fill="#F1F5F9" rx="10"/>
  <rect x="10" y="34" width="900" height="10" fill="#F1F5F9"/>
  <circle cx="30" cy="27" r="5" fill="#CBD5E1"/><circle cx="46" cy="27" r="5" fill="#CBD5E1"/><circle cx="62" cy="27" r="5" fill="#CBD5E1"/>
  <text x="460" y="31" text-anchor="middle" font-size="10" fill="#64748B">Code Security  ›  SCA  ›  SBOM  ·  example-org/storefront</text>
  <rect x="770" y="16" width="130" height="22" fill="#FEF3C7" stroke="#F59E0B" rx="11"/>
  <text x="835" y="31" text-anchor="middle" font-size="9" font-weight="700" fill="#92400E" letter-spacing="0.8">ILLUSTRATIVE</text>

  <g font-size="9" fill="#64748B">
    <rect x="30" y="60" width="200" height="70" fill="#FFFFFF" stroke="#E2E8F0" rx="8"/>
    <text x="44" y="80" letter-spacing="0.8">TOTAL COMPONENTS</text>
    <text x="44" y="112" font-size="24" font-weight="700" fill="#0F172A">312</text>
    <rect x="244" y="60" width="200" height="70" fill="#FFFFFF" stroke="#FECACA" rx="8"/>
    <text x="258" y="80" letter-spacing="0.8" fill="#B91C1C">VULNERABLE PACKAGES</text>
    <text x="258" y="112" font-size="24" font-weight="700" fill="#B91C1C">9</text>
    <rect x="458" y="60" width="200" height="70" fill="#FFFFFF" stroke="#E2E8F0" rx="8"/>
    <text x="472" y="80" letter-spacing="0.8">TOTAL CVES</text>
    <text x="472" y="112" font-size="24" font-weight="700" fill="#0F172A">14</text>
    <rect x="672" y="60" width="218" height="70" fill="#FFFFFF" stroke="#E2E8F0" rx="8"/>
    <text x="686" y="80" letter-spacing="0.8">LICENSE TYPES</text>
    <text x="686" y="112" font-size="24" font-weight="700" fill="#0F172A">7</text>
  </g>

  <text x="30" y="160" font-size="12" font-weight="700" fill="#0F172A">Vulnerable Packages</text>
  <text x="200" y="160" font-size="10" fill="#64748B">License Analysis</text>
  <rect x="30" y="170" width="860" height="26" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g font-size="9" font-weight="700" fill="#64748B" letter-spacing="0.6">
    <text x="42" y="187">PACKAGE</text><text x="200" y="187">PURL</text><text x="455" y="187">CVE COUNT</text><text x="540" y="187">RISK LEVEL</text><text x="660" y="187">LICENSE</text><text x="770" y="187">CVE IDS</text>
  </g>
  <g font-size="10" fill="#334155">
    <rect x="30" y="196" width="860" height="34" fill="#FFFFFF" stroke="#F1F5F9"/>
    <text x="42" y="217" font-weight="700">example-xml-lib</text><text x="200" y="217" font-family="Menlo, monospace" font-size="9">pkg:npm/example-xml-lib@2.1.0</text><text x="470" y="217">2</text>
    <rect x="540" y="205" width="80" height="16" rx="8" fill="#FEE2E2"/><text x="580" y="216" text-anchor="middle" font-size="8" font-weight="700" fill="#B91C1C">IMMEDIATE</text>
    <text x="660" y="217">MIT</text>
    <text x="770" y="217" font-size="9">CVE-0000-0001 …</text>
    <rect x="30" y="230" width="860" height="34" fill="#FFFFFF" stroke="#F1F5F9"/>
    <text x="42" y="251" font-weight="700">example-yaml</text><text x="200" y="251" font-family="Menlo, monospace" font-size="9">pkg:pypi/example-yaml@5.3</text><text x="470" y="251">1</text>
    <rect x="540" y="239" width="80" height="16" rx="8" fill="#FFEDD5"/><text x="580" y="250" text-anchor="middle" font-size="8" font-weight="700" fill="#C2410C">HIGH</text>
    <text x="660" y="251">MIT</text>
    <text x="770" y="251" font-size="9">CVE-0000-0002</text>
    <rect x="30" y="264" width="860" height="34" fill="#FFFFFF" stroke="#F1F5F9"/>
    <text x="42" y="285" font-weight="700">example-http</text><text x="200" y="285" font-family="Menlo, monospace" font-size="9">pkg:golang/example.com/http@v0.9.1</text><text x="470" y="285">3</text>
    <rect x="540" y="273" width="80" height="16" rx="8" fill="#FEF9C3"/><text x="580" y="284" text-anchor="middle" font-size="8" font-weight="700" fill="#A16207">MEDIUM</text>
    <text x="660" y="285">BSD-3-Clause</text><text x="770" y="285" font-size="9">CVE-0000-0003 …</text>
    <rect x="30" y="298" width="860" height="34" fill="#FFFFFF" stroke="#F1F5F9"/>
    <text x="42" y="319" font-weight="700">example-crypto</text><text x="200" y="319" font-family="Menlo, monospace" font-size="9">pkg:maven/org.example/crypto@1.4</text><text x="470" y="319">1</text>
    <rect x="540" y="307" width="80" height="16" rx="8" fill="#DCFCE7"/><text x="580" y="318" text-anchor="middle" font-size="8" font-weight="700" fill="#15803D">LOW</text>
    <text x="660" y="319">Apache-2.0</text><text x="770" y="319" font-size="9">CVE-0000-0004</text>
  </g>
  <rect x="30" y="350" width="860" height="56" fill="#F8FAFC" stroke="#E2E8F0" rx="8"/>
  <text x="46" y="374" font-size="10" font-weight="700" fill="#0F172A">Also available through the API: CycloneDX 1.5 download · VEX statements · SBOM diff</text>
  <text x="46" y="394" font-size="8" fill="#64748B">Stylised illustration of the console layout. Package names, CVE IDs and figures are invented.</text>
</svg>
