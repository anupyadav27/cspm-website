<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Onam "True North" mark: two-tone four-point star on a white disc.
       Arms are thicker and the star fills the disc — favicon sizes (16-32px)
       lose the thinner proportions used in logo.svg / logo-512.png. -->
  <circle cx="40" cy="40" r="40" fill="#FFFFFF"/>
  <polygon points="40,4 51,40 40,76 29,40" fill="#082869"/>
  <polygon points="4,40 40,29 76,40 40,51" fill="#2563EB"/>
  <circle cx="40" cy="40" r="3.5" fill="#FFFFFF"/>
</svg>
