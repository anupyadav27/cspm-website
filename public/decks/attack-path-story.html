<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onam — Sales Pitch (animated)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#082869; --navy2:#0B2545; --blue:#2563EB; --blue2:#1E6FD9;
  --ink:#1A2233; --mute:#5C6B84; --line:#E2E8F2; --light:#F3F7FC;
  --tint:#EAF1FB; --ice:#CADCFC; --white:#FFFFFF; --green:#1E7A46;
  --amber:#E4572E;
  --f:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a1224;font-family:var(--f);overflow:hidden}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;background:var(--white);
  border-radius:14px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.55);
  transform-origin:center center}
.slide{position:absolute;inset:0;padding:64px 72px;opacity:0;visibility:hidden;
  transition:opacity .5s var(--ease);pointer-events:none;display:flex;flex-direction:column}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}
.slide.dark{background:var(--navy);color:var(--white)}
.slide.lightbg{background:var(--light)}

/* entrance for active-slide primary elements */
.slide .rise{opacity:0;transform:translateY(16px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
.slide.active .rise{opacity:1;transform:none}
.slide.active .d1{transition-delay:.08s}.slide.active .d2{transition-delay:.18s}
.slide.active .d3{transition-delay:.28s}.slide.active .d4{transition-delay:.38s}

/* step-revealed elements */
.step{opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.step.on{opacity:1;transform:none}

.eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--blue)}
h1{font-size:40px;font-weight:800;line-height:1.06;color:var(--navy);letter-spacing:-.4px}
.dark h1{color:#fff}
h2{font-size:34px;font-weight:800;line-height:1.08;color:var(--navy);letter-spacing:-.3px}
.dark h2{color:#fff}
.sub{font-size:19px;font-weight:500;color:var(--mute);margin-top:14px;line-height:1.35;max-width:1000px}
.dark .sub{color:var(--ice)}
.src{position:absolute;left:72px;bottom:52px;font-size:12px;font-style:italic;color:#9AA7B8}
.foot{position:absolute;left:72px;bottom:26px;font-size:12px;color:var(--mute)}
.pagen{position:absolute;right:64px;bottom:24px;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}

/* premium bullets */
.pts{margin-top:40px;display:flex;flex-direction:column;gap:22px;max-width:1040px}
.pt{display:flex;gap:16px;align-items:flex-start;font-size:20px;line-height:1.35}
.pt .dot{width:14px;height:14px;background:var(--blue);transform:rotate(45deg);margin-top:7px;flex:0 0 auto;border-radius:2px}
.pt b{color:var(--ink);font-weight:700}
.pt span{color:var(--mute)}
.dark .pt b{color:#fff}.dark .pt span{color:var(--ice)}

.center{justify-content:center}
.spacer{flex:1}

/* compass mark */
.mark{display:inline-block}
.markwrap{position:absolute;right:64px;top:60px;opacity:.9}

/* cover */
.brandrow{display:flex;align-items:center;gap:16px}
.brandrow .bt{font-size:16px;font-weight:800;letter-spacing:2px;color:#fff}
.cover-h{font-size:46px;font-weight:800;line-height:1.08;color:#fff;letter-spacing:-.5px;max-width:1050px}
.cover-s{font-size:21px;color:var(--ice);margin-top:22px;max-width:900px;font-weight:500}
.cover-meta{font-size:14px;color:#9FB3D6;position:absolute;left:72px;bottom:56px}

/* stat */
.bignum{font-size:168px;font-weight:800;color:var(--blue);line-height:.9;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.statrow{display:flex;align-items:center;gap:48px;margin-top:8px}
.statside{max-width:440px}
.statside .l{font-size:23px;font-weight:700;color:var(--ink)}
.statside .r{font-size:17px;color:var(--mute);margin-top:12px;line-height:1.4}
.hl{background:linear-gradient(transparent 62%, #ffd97d 62%);padding:0 3px;font-weight:700;color:var(--ink)}
.statkick{font-size:19px;font-style:italic;color:var(--navy);font-weight:600;margin-top:38px}

/* attack path */
.pathwrap{margin-top:56px;position:relative;height:230px}
.pnode{position:absolute;top:40px;width:210px;height:104px;border-radius:12px;background:var(--light);
  border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;text-align:center;opacity:0;transform:scale(.9);transition:all .45s var(--ease)}
.pnode.on{opacity:1;transform:none}
.pnode .nt{font-size:17px;font-weight:700;color:var(--ink)}
.pnode .ns{font-size:13px;color:var(--mute)}
.pnode.brk{background:var(--tint);border-color:var(--blue);border-width:2px}
.pnode.dead{opacity:.32;filter:grayscale(.7)}
.pnode.dead .nt{color:var(--mute)}
.pconn{position:absolute;top:88px;height:3px;background:var(--blue);width:0;transition:width .4s var(--ease);border-radius:2px}
.pconn.on{width:var(--w)}
.pconn.dead{background:var(--line);opacity:.5}
.pconn .arw{position:absolute;right:-2px;top:-7px;color:var(--blue);font-size:20px;line-height:1;opacity:0;transition:opacity .3s}
.pconn.on .arw{opacity:1}
.pconn.dead .arw{color:var(--line)}
.fixchip{position:absolute;top:170px;width:210px;text-align:center;background:var(--blue);color:#fff;
  font-size:14px;font-weight:700;padding:11px 0;border-radius:9px;opacity:0;transform:translateY(-8px);
  transition:all .45s var(--ease);box-shadow:0 8px 22px rgba(37,99,235,.4)}
.fixchip.on{opacity:1;transform:none}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}50%{box-shadow:0 0 0 12px rgba(37,99,235,0)}}
.gloss{position:absolute;left:72px;bottom:88px;font-size:14px;color:var(--mute);max-width:1120px;line-height:1.4}
.gloss b{color:var(--navy)}
.pathkick{position:absolute;left:72px;bottom:60px;font-size:16px;font-style:italic;color:var(--ink);font-weight:600}

/* two-col firehose/queue */
.cols{display:flex;gap:36px;margin-top:44px;flex:1}
.card{flex:1;border-radius:14px;padding:30px 32px;position:relative}
.card.l{background:var(--light);border:1px solid var(--line)}
.card.r{background:var(--tint);border:1.5px solid var(--blue)}
.card h3{font-size:21px;font-weight:800;margin-bottom:8px}
.card.l h3{color:var(--ink)}.card.r h3{color:var(--navy)}
.card p{font-size:16px;line-height:1.4;margin-top:14px}
.card.l p{color:var(--mute)}.card.r p{color:var(--ink)}
.firehose{position:absolute;right:26px;top:74px;bottom:26px;left:26px;display:flex;flex-wrap:wrap;
  gap:5px;align-content:flex-start;opacity:.9;pointer-events:none}
.fbar{width:26px;height:9px;border-radius:2px;background:var(--amber);opacity:.85;
  animation:flick 1.6s var(--ease) infinite}
@keyframes flick{0%,100%{opacity:.35}50%{opacity:.9}}
.queue{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.qrow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--ice);
  border-radius:9px;padding:12px 16px;font-size:15px;font-weight:600;color:var(--navy);
  opacity:0;transform:translateX(18px);transition:all .5s var(--ease)}
.qrow.on{opacity:1;transform:none}
.qrow .qd{width:10px;height:10px;background:var(--blue);transform:rotate(45deg);border-radius:1px}

/* table */
table{width:100%;border-collapse:collapse;margin-top:44px;font-size:16px}
th{background:var(--navy);color:#fff;text-align:left;padding:15px 18px;font-weight:700;font-size:15px}
td{padding:15px 18px;border:1px solid var(--line);color:var(--ink);vertical-align:middle}
td.on-col{background:var(--tint);color:var(--navy);font-weight:700}
tr.tr{opacity:0;transform:translateY(10px);transition:all .45s var(--ease)}
tr.tr.on{opacity:1;transform:none}
tr.decisive.hot td{background:var(--ice)}
tr.decisive.hot td.on-col{background:var(--blue);color:#fff}
tr.decisive.hot td:first-child{font-weight:800}

/* recap */
.recap{margin-top:44px;display:flex;flex-direction:column;gap:26px}
.ritem{display:flex;align-items:center;gap:22px;opacity:0;transform:translateY(14px);
  transition:all .5s var(--ease)}
.ritem.on{opacity:1;transform:none}
.rnum{width:60px;height:60px;border-radius:50%;background:var(--navy);color:#fff;font-size:24px;
  font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ritem .rt{font-size:21px}.ritem .rt b{color:var(--ink);font-weight:700}.ritem .rt span{color:var(--mute)}

/* close */
.close-h{font-size:52px;font-weight:800;color:#fff;letter-spacing:-.5px}
.close-s{font-size:21px;color:var(--ice);margin-top:24px;line-height:1.4;max-width:820px}
.close-c{position:absolute;left:72px;bottom:60px;font-size:16px}
.close-c b{color:#fff;font-weight:700}.close-c span{color:#9FB3D6}

/* nav */
#nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;
  gap:14px;background:rgba(10,18,36,.72);backdrop-filter:blur(8px);padding:9px 16px;border-radius:30px;
  z-index:30;border:1px solid rgba(255,255,255,.12)}
#nav button{background:none;border:none;color:#cdd8ee;font-size:18px;cursor:pointer;width:30px;height:30px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.2s}
#nav button:hover{background:rgba(255,255,255,.14);color:#fff}
#dots{display:flex;gap:6px}
.dot-n{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28);cursor:pointer;transition:.2s}
.dot-n.cur{background:var(--blue);width:20px;border-radius:4px}
#hint{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#7f8db0;font-size:13px;
  z-index:30;transition:opacity .6s;font-family:var(--f)}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>

<div id="hint">Use → ← or click to advance builds · F for fullscreen</div>
<div id="nav">
  <button id="prev">‹</button>
  <div id="dots"></div>
  <button id="next">›</button>
  <button id="full" title="Fullscreen">⛶</button>
</div>

<script>
// ---------- compass mark (SVG) ----------
function mark(size, dark){
  const tall = dark ? '#CADCFC' : '#082869';
  return `<svg class="mark" width="${size}" height="${size}" viewBox="0 0 100 100">
    <polygon points="50,4 60,50 50,96 40,50" fill="${tall}"/>
    <polygon points="4,50 50,40 96,50 50,60" fill="#2563EB"/>
    <circle cx="50" cy="50" r="6" fill="#fff"/></svg>`;
}
const foot = n => `<div class="foot">onamsecurity.com</div>
  <div class="pagen"><span>${n}</span>${mark(16,false)}</div>`;

// ---------- slides ----------
const S = [];

// 1 · COVER
S.push({dark:true, steps:0, html:`
  <div class="brandrow rise d1">${mark(58,true)}<span class="bt">ONAM SECURITY</span></div>
  <div class="spacer"></div>
  <div class="cover-h rise d2">You can be looking at the finding that will breach you — and have no way to tell.</div>
  <div class="cover-s rise d3">Onam finds the attack paths adversaries would actually take — before they do.</div>
  <div class="spacer"></div>
  <div class="cover-meta rise d4">Anup Yadav &nbsp;·&nbsp; onamsecurity.com &nbsp;·&nbsp; August 2026</div>`});

// 2 · SITUATION
S.push({steps:2, html:`
  <h1 class="rise d1">You run six tools — and you are the integration between them.</h1>
  <div class="sub rise d2">Posture in one console, identity in another, data security in a third. The correlation layer is a person with tabs open.</div>
  <div class="pts">
    <div class="pt step" data-step="1"><div class="dot"></div><div><b>Every tool scores on its own scale</b> <span>— so ranking across them isn't hard work, it's impossible work.</span></div></div>
    <div class="pt step" data-step="2"><div class="dot"></div><div><b>The one stitching six views into one picture, by eye, is you</b> <span>— every morning.</span></div></div>
  </div>
  <div class="src">Source: onam messaging foundation · claims library</div>${foot(2)}`});

// 3 · COMPLICATION
S.push({steps:2, html:`
  <h1 class="rise d1">The breach doesn't live in a tool — it lives in the path between them.</h1>
  <div class="sub rise d2">Real risk is a chain across tools, and no single console can see the chain.</div>
  <div class="pts">
    <div class="pt step" data-step="1"><div class="dot"></div><div><b>A public subnet is medium. An over-privileged role is medium. A vulnerable workload is high.</b></div></div>
    <div class="pt step" data-step="2"><div class="dot"></div><div><b>The same three on one path is a breach waiting to happen</b> <span>— and not one of your tools shows the three together.</span></div></div>
  </div>
  <div class="src">Source: cspm-website · blog</div>${foot(3)}`});

// 4 · SECTION — the question
S.push({dark:true, steps:0, cls:'center', html:`
  <div class="markwrap">${mark(70,true)}</div>
  <div class="eyebrow rise d1">The question</div>
  <h2 class="rise d2" style="margin-top:18px;max-width:960px">With a thousand findings open, severity can't tell you which one fixes first.</h2>
  <div class="sub rise d3">Every team is already asking it. Labels rank inside one tool — never across the path.</div>
  ${foot(4)}`});

// 5 · STAT
S.push({lightbg:true, steps:1, custom:'stat', html:`
  <div class="statrow" style="margin-top:70px">
    <div class="bignum" id="bignum">0</div>
    <div class="statside">
      <div class="l rise d2">findings in one demo account</div>
      <div class="r rise d3"><span class="urg">101 flagged “urgent”</span> (12 critical · 89 high) — and not one tells you where to start.</div>
    </div>
  </div>
  <div class="statkick rise d4">Volume is not prioritisation. A wall of “critical” is the same as no priority at all.</div>
  <div class="src">Source: product UI (demo tenant — illustrative, not a customer average)</div>${foot(5)}`});

// 6 · ANSWER (differentiator, stated once)
S.push({steps:2, html:`
  <h1 class="rise d1">Onam ranks the route an attacker takes — not the row.</h1>
  <div class="sub rise d2">One graph across posture, identity, data, workloads and runtime — reasoned like an adversary.</div>
  <div class="pts">
    <div class="pt step" data-step="1"><div class="dot"></div><div><b>Everything lives on one data model</b> <span>— so findings connect instead of pile up.</span></div></div>
    <div class="pt step" data-step="2"><div class="dot"></div><div><b>The graph walks the identity chain wherever it goes</b> <span>— including across cloud providers.</span></div></div>
  </div>
  <div class="src">Source: onam introduction · architecture</div>${foot(6)}`});

// 7 · ATTACK PATH (hero, custom motion)
S.push({steps:5, custom:'path', html:`
  <h1 class="rise d1" style="max-width:1040px">Four hops. Three tools blind. One breach.</h1>
  <div class="sub rise d2" style="margin-top:8px">One real route — from a forgotten instance to your crown-jewel data. Every tool rated each hop on its own.</div>
  <div class="pathwrap" id="pathwrap" style="margin-top:34px">
    <div class="pnode" id="n0" style="left:0"><div class="nt">EC2</div><div class="ns">instance</div></div>
    <div class="pconn" id="c0" style="left:210px;--w:80px"><span class="arw">▶</span></div>
    <div class="pnode" id="n1" style="left:290px"><div class="nt">IMDSv1</div><div class="ns">enabled</div></div>
    <div class="pconn" id="c1" style="left:500px;--w:80px"><span class="arw">▶</span></div>
    <div class="pnode" id="n2" style="left:580px"><div class="nt">IAM role</div><div class="ns">via PassRole</div></div>
    <div class="pconn" id="c2" style="left:790px;--w:80px"><span class="arw">▶</span></div>
    <div class="pnode" id="n3" style="left:870px"><div class="nt">S3</div><div class="ns">crown-jewel data</div></div>
    <div class="fixchip" id="fix" style="left:290px">Fix P0 — Disable IMDSv1</div>
  </div>
  <div class="gloss"><b>IMDSv1</b> = the old metadata service that hands out credentials with no check. &nbsp;&nbsp; <b>PassRole</b> = the permission to hand an instance a role's keys.</div>
  <div class="pathkick" id="pathkick" style="opacity:0;transition:opacity .5s">Break any one link and the whole path is gone.</div>
  <div class="src" style="bottom:34px">Illustrative attack path — the pattern Onam surfaces on your own cloud.</div>${foot(7)}`});

// 8 · DIFFERENTIATOR PROVEN
S.push({steps:2, html:`
  <h1 class="rise d1">Break one link and the whole path is gone.</h1>
  <div class="sub rise d2">A chain fails at any link — so one change ends a path that three separate tickets never would.</div>
  <div class="pts">
    <div class="pt step" data-step="1"><div class="dot"></div><div><b>Disable IMDSv1 on that one instance and the path disappears</b> <span>— both findings still open, but no longer connected.</span></div></div>
    <div class="pt step" data-step="2"><div class="dot"></div><div><b>You fix the few things that break the most attacks</b> <span>— ranked by FAIR-model dollar exposure (FAIR = the standard way to put a defensible dollar figure on cyber risk).</span></div></div>
  </div>
  <div class="src">Source: cspm-website · blog</div>${foot(8)}`});

// 9 · TWO-COL firehose → queue
S.push({steps:1, custom:'queue', html:`
  <h1 class="rise d1">Rank by what's reachable, and the firehose becomes a short queue.</h1>
  <div class="cols">
    <div class="card l rise d2">
      <h3>Severity list</h3>
      <div class="firehose" id="firehose"></div>
    </div>
    <div class="card r">
      <h3 class="rise d2">Onam</h3>
      <div class="queue">
        <div class="qrow step" data-step="1"><div class="qd"></div>EC2 → IMDSv1 → S3 &nbsp;·&nbsp; reachable to crown-jewel</div>
        <div class="qrow step" data-step="1"><div class="qd"></div>Public LB → app role → RDS &nbsp;·&nbsp; reachable</div>
        <div class="qrow step" data-step="1"><div class="qd"></div>CI token → prod deploy &nbsp;·&nbsp; reachable</div>
        <div class="qrow step" data-step="1" style="border-style:dashed;color:var(--mute);font-weight:500">…the handful that matter — ranked by dollar risk</div>
      </div>
    </div>
  </div>
  <div class="src">Source: onam messaging foundation</div>${foot(9)}`});

// 10 · TABLE
S.push({steps:1, custom:'table', html:`
  <h1 class="rise d1" style="font-size:32px;max-width:1120px">Only a cross-cloud graph sees the path — that's the line between a platform and a drawer of tools.</h1>
  <table>
    <thead><tr><th style="width:24%">Dimension</th><th style="width:38%">Point tools / native</th><th>Onam</th></tr></thead>
    <tbody>
      <tr class="tr" data-step="1"><td>Coverage</td><td>One cloud or one layer</td><td class="on-col">7 clouds · every security layer · continuous</td></tr>
      <tr class="tr decisive" data-step="1"><td>Analysis</td><td>Per-tool silos — can't see a cross-cloud path</td><td class="on-col">One cross-cloud graph</td></tr>
      <tr class="tr" data-step="1"><td>Prioritisation</td><td>Severity labels</td><td class="on-col">FAIR-model dollar exposure</td></tr>
      <tr class="tr" data-step="1"><td>Deployment</td><td>Agents, weeks to value</td><td class="on-col">Read-only, agentless, minutes</td></tr>
    </tbody>
  </table>
  <div class="src">The decisive row is Analysis — silos structurally cannot see the path.</div>${foot(10)}`});

// 11 · LEAST EFFORT
S.push({steps:2, html:`
  <h1 class="rise d1">Read-only. No agents. First finding in minutes.</h1>
  <div class="sub rise d2">The trial feels like the product promise — because it is the product.</div>
  <div class="pts">
    <div class="pt step" data-step="1"><div class="dot"></div><div><b>Connect a read-only role in under 3 minutes</b> <span>— first critical in under 5.</span></div></div>
    <div class="pt step" data-step="2"><div class="dot"></div><div><b>No agents to deploy, no long-lived credentials stored</b> <span>— nothing to schedule, nothing to install.</span></div></div>
  </div>
  <div class="src">Source: onam claims library</div>${foot(11)}`});

// 12 · HONEST LIMIT
S.push({steps:2, html:`
  <h1 class="rise d1">We won't pretend to fix everything — and that's the point.</h1>
  <div class="sub rise d2">The honest limit, stated plainly.</div>
  <div class="pts">
    <div class="pt step" data-step="1"><div class="dot"></div><div><b>Onam surfaces the few paths that matter</b> <span>— the long tail still waits on the backlog.</span></div></div>
    <div class="pt step" data-step="2"><div class="dot"></div><div><b>The difference is you now know which few break the most attacks</b> <span>— instead of guessing.</span></div></div>
  </div>
  <div class="src">Source: onam message architecture</div>${foot(12)}`});

// 13 · RECAP
S.push({steps:3, custom:'recap', html:`
  <h1 class="rise d1">Three things to remember.</h1>
  <div class="recap">
    <div class="ritem" data-r="1"><div class="rnum">1</div><div class="rt"><b>Real risk is a path, not a row</b> <span>— and it lives between your tools.</span></div></div>
    <div class="ritem" data-r="2"><div class="rnum">2</div><div class="rt"><b>One graph makes the path visible</b> <span>— severity lists never will.</span></div></div>
    <div class="ritem" data-r="3"><div class="rnum">3</div><div class="rt"><b>Break the route, break the attack</b> <span>— the few fixes that matter, ranked by dollar risk.</span></div></div>
  </div>${foot(13)}`});

// 14 · CLOSE
S.push({dark:true, steps:0, cls:'center', html:`
  <div style="margin-bottom:26px" class="rise d1">${mark(56,true)}</div>
  <div class="close-h rise d2">Find your true north.</div>
  <div class="close-s rise d3">See it on your own cloud — a read-only role, first findings within a day.<br>Shall we schedule the connect this week?</div>
  <div class="close-c rise d4"><b>onamsecurity.com</b><span> &nbsp; · &nbsp; sales@onamsecurity.com</span></div>`});

// ---------- render ----------
const stage = document.getElementById('stage');
S.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'slide' + (s.dark?' dark':'') + (s.lightbg?' lightbg':'') + (s.cls?(' '+s.cls):'');
  d.innerHTML = s.html; d.dataset.idx = i;
  stage.appendChild(d); s.el = d;
});
const slides = [...document.querySelectorAll('.slide')];
const dots = document.getElementById('dots');
slides.forEach((_,i)=>{const b=document.createElement('div');b.className='dot-n';b.onclick=()=>goto(i,0);dots.appendChild(b);});
const dotEls=[...document.querySelectorAll('.dot-n')];

let cur=0, step=0;

function applySteps(idx){
  const s=S[idx], el=s.el;
  el.querySelectorAll('.step').forEach(e=>{
    const ds=+e.dataset.step;
    e.classList.toggle('on', ds<=step);
  });
  if(s.custom==='stat') statStep(el);
  if(s.custom==='path') pathStep(el);
  if(s.custom==='queue') queueStep(el);
  if(s.custom==='table') tableStep(el);
  if(s.custom==='recap') recapStep(el);
}

function show(idx){
  slides.forEach((s,i)=>s.classList.toggle('active', i===idx));
  dotEls.forEach((d,i)=>d.classList.toggle('cur', i===idx));
  // reset custom visuals on enter
  const s=S[idx];
  if(s.custom==='stat'){ el_reset_stat(s.el); }
  if(s.custom==='path'){ el_reset_path(s.el); }
  if(s.custom==='queue'){ buildFirehose(s.el); }
  applySteps(idx);
}
function goto(idx,st){ idx=Math.max(0,Math.min(slides.length-1,idx)); cur=idx; step=st||0; show(cur); }

function next(){
  const max=S[cur].steps;
  if(step<max){ step++; applySteps(cur); }
  else if(cur<slides.length-1){ goto(cur+1,0); }
}
function prev(){
  if(step>0){ step--; applySteps(cur); }
  else if(cur>0){ const p=cur-1; goto(p, S[p].steps); }
}

// ----- custom visual logic -----
function el_reset_stat(el){ el._counted=false; const n=el.querySelector('#bignum'); if(n) n.textContent='0';
  const u=el.querySelector('.urg'); if(u) u.classList.remove('hl'); }
function statStep(el){
  if(!el._counted){ el._counted=true; countUp(el.querySelector('#bignum'),847,1100); }
  if(step>=1){ const u=el.querySelector('.urg'); if(u) u.classList.add('hl'); }
}
function countUp(node,target,dur){
  if(!node) return; const t0=performance.now();
  function tick(t){ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3);
    node.textContent=Math.round(e*target).toLocaleString(); if(p<1) requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
}

function el_reset_path(el){
  ['n0','n1','n2','n3'].forEach(id=>{const n=el.querySelector('#'+id);n.classList.remove('on','dead','pulse');n.classList.toggle('brk',id==='n1'&&false);});
  el.querySelector('#n1').classList.remove('brk');
  ['c0','c1','c2'].forEach(id=>el.querySelector('#'+id).classList.remove('on','dead'));
  el.querySelector('#fix').classList.remove('on');
  el.querySelector('#pathkick').style.opacity=0;
}
function pathStep(el){
  const on=(id)=>el.querySelector('#'+id).classList.add('on');
  const nodes=['n0','n1','n2','n3'], conns=['c0','c1','c2'];
  // steps 1..4 build the path; step5 breaks it
  if(step>=1){ on('n0'); }
  if(step>=2){ on('c0'); on('n1'); }
  if(step>=3){ on('c1'); on('n2'); }
  if(step>=4){ on('c2'); on('n3'); }
  const brk = step>=5;
  const n1=el.querySelector('#n1');
  n1.classList.toggle('brk', step>=2);
  n1.classList.toggle('pulse', step>=2 && !brk);
  if(brk){
    n1.classList.remove('pulse');
    el.querySelector('#n2').classList.add('dead');
    el.querySelector('#n3').classList.add('dead');
    el.querySelector('#c1').classList.add('dead');
    el.querySelector('#c2').classList.add('dead');
    el.querySelector('#fix').classList.add('on');
    el.querySelector('#pathkick').style.opacity=1;
  } else {
    ['n2','n3'].forEach(id=>el.querySelector('#'+id).classList.remove('dead'));
    ['c1','c2'].forEach(id=>el.querySelector('#'+id).classList.remove('dead'));
    el.querySelector('#fix').classList.remove('on');
    el.querySelector('#pathkick').style.opacity=0;
  }
}

function buildFirehose(el){
  const fh=el.querySelector('#firehose'); if(!fh || fh._built) return;
  let h=''; for(let i=0;i<120;i++){ const d=(i%9)*0.13; h+=`<div class="fbar" style="animation-delay:${d}s"></div>`; }
  fh.innerHTML=h; fh._built=true;
}
function queueStep(el){ /* qrows handled by .step .on */ }

function tableStep(el){
  el.querySelectorAll('tr.tr').forEach((tr,i)=>{ setTimeout(()=>tr.classList.add('on'), i*90); });
  const dec=el.querySelector('tr.decisive');
  if(dec) dec.classList.toggle('hot', step>=1);
}
function recapStep(el){
  el.querySelectorAll('.ritem').forEach(r=>{ const rn=+r.dataset.r; r.classList.toggle('on', rn<=step); });
}

// ----- nav wiring -----
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('full').onclick=toggleFull;
stage.addEventListener('click',e=>{ if(e.target.closest('a'))return; next(); });
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home'){goto(0,0);}
  else if(e.key==='End'){goto(slides.length-1,0);}
  else if(e.key==='f'||e.key==='F'){toggleFull();}
});
function toggleFull(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen&&document.exitFullscreen(); }

// ----- scale stage to viewport -----
function fit(){
  const pad=40, vw=window.innerWidth-pad, vh=window.innerHeight-pad;
  const s=Math.min(vw/1280, vh/720);
  stage.style.transform='scale('+s+')';
}
window.addEventListener('resize',fit); fit();

// hint fade
setTimeout(()=>{const h=document.getElementById('hint'); if(h) h.style.opacity=0;},5200);

show(0);
</script>
</body>
</html>
