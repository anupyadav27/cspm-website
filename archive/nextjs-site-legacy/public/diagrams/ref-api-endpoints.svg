<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="Arial, sans-serif">
  <rect width="920" height="500" fill="#F8FAFC" rx="10"/>
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">API ENDPOINTS BY DOMAIN — UNIFIED API GATEWAY ROUTES TO PER-DOMAIN ENDPOINTS</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Center hub: API Gateway -->
  <rect x="370" y="220" width="180" height="60" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
  <text x="460" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">API Gateway</text>
  <text x="460" y="262" text-anchor="middle" font-size="9" fill="#64748B">/gateway/api/v1/</text>

  <!-- helper to compute lines from gateway to each card center -->
  <!-- Domain cards arranged in a circle -->

  <!-- Top row: Discovery, Inventory, Check, Threat -->
  <g font-family="ui-monospace, Monaco, monospace">
    <rect x="20" y="58" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="120" y="78" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">Discovery</text>
    <text x="120" y="94" text-anchor="middle" font-size="9" fill="#475569">/discoveries</text>
    <text x="120" y="110" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">resource enumeration</text>

    <rect x="240" y="58" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="340" y="78" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">Inventory</text>
    <text x="340" y="94" text-anchor="middle" font-size="9" fill="#475569">/inventory</text>
    <text x="340" y="110" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">normalized assets</text>

    <rect x="480" y="58" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="580" y="78" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">Check</text>
    <text x="580" y="94" text-anchor="middle" font-size="9" fill="#475569">/check</text>
    <text x="580" y="110" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">PASS / FAIL findings</text>

    <rect x="700" y="58" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="800" y="78" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">Threat</text>
    <text x="800" y="94" text-anchor="middle" font-size="9" fill="#475569">/threat</text>
    <text x="800" y="110" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">MITRE attack paths</text>

    <!-- Mid-left row -->
    <rect x="20" y="138" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="120" y="158" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">Compliance</text>
    <text x="120" y="174" text-anchor="middle" font-size="9" fill="#475569">/compliance</text>
    <text x="120" y="190" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">framework scores</text>

    <rect x="20" y="218" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="120" y="238" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">IAM</text>
    <text x="120" y="254" text-anchor="middle" font-size="9" fill="#475569">/iam</text>
    <text x="120" y="270" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">posture · policies</text>

    <rect x="20" y="298" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="120" y="318" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">CIEM</text>
    <text x="120" y="334" text-anchor="middle" font-size="9" fill="#475569">/ciem</text>
    <text x="120" y="350" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">entitlement findings</text>

    <!-- Mid-right row -->
    <rect x="700" y="138" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="800" y="158" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">Network Security</text>
    <text x="800" y="174" text-anchor="middle" font-size="9" fill="#475569">/network-security</text>
    <text x="800" y="190" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">7-layer findings</text>

    <rect x="700" y="218" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="800" y="238" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">Data Security</text>
    <text x="800" y="254" text-anchor="middle" font-size="9" fill="#475569">/datasec</text>
    <text x="800" y="270" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">DSPM findings</text>

    <rect x="700" y="298" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="800" y="318" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">Vulnerability</text>
    <text x="800" y="334" text-anchor="middle" font-size="9" fill="#475569">/vulnerability</text>
    <text x="800" y="350" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">CVE findings · SBOM</text>

    <!-- Bottom row -->
    <rect x="20" y="378" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="120" y="398" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">Container Security</text>
    <text x="120" y="414" text-anchor="middle" font-size="9" fill="#475569">/container-security</text>
    <text x="120" y="430" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">K8s posture · images</text>

    <rect x="240" y="378" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="340" y="398" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">Risk</text>
    <text x="340" y="414" text-anchor="middle" font-size="9" fill="#475569">/risk</text>
    <text x="340" y="430" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">FAIR scoring</text>

    <rect x="480" y="378" width="200" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
    <text x="580" y="398" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E40AF">SecOps</text>
    <text x="580" y="414" text-anchor="middle" font-size="9" fill="#475569">/secops</text>
    <text x="580" y="430" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">SAST · DAST · SCA · IaC</text>

    <rect x="700" y="378" width="200" height="64" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
    <text x="800" y="398" text-anchor="middle" font-size="11" font-weight="700" font-family="Arial" fill="#1E3A8A">BFF Views</text>
    <text x="800" y="414" text-anchor="middle" font-size="9" fill="#64748B">/views/{page}</text>
    <text x="800" y="430" text-anchor="middle" font-size="8" font-family="Arial" fill="#64748B">aggregated dashboard data</text>
  </g>

  <!-- Footer -->
  <text x="460" y="468" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">UNIFIED RESPONSE CONTRACT</text>
  <text x="460" y="484" text-anchor="middle" font-size="9" fill="#64748B">All list endpoints share `{ data, total, page, page_size, pages }` envelope · all errors share `{ error, detail, status_code }` envelope</text>
</svg>
