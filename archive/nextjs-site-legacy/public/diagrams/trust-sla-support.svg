<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" font-family="Arial, sans-serif">
  <rect width="920" height="360" fill="#F8FAFC" rx="10"/>
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">SUPPORT RESPONSE SLA — RESPONSE AND RESOLUTION TARGETS BY SEVERITY</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Top: ticket flow -->
  <rect x="20" y="56" width="200" height="80" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="120" y="80" text-anchor="middle" font-size="14">📩</text>
  <text x="120" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Support ticket submitted</text>
  <text x="120" y="120" text-anchor="middle" font-size="9" fill="#64748B">Email · in-app chat · Slack</text>

  <line x1="220" y1="96" x2="248" y2="96" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="246,91 256,96 246,101" fill="#94A3B8"/>

  <!-- Severity classifier -->
  <rect x="258" y="56" width="200" height="80" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="358" y="80" text-anchor="middle" font-size="14">⚖️</text>
  <text x="358" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#3730A3">Severity classification</text>
  <text x="358" y="120" text-anchor="middle" font-size="9" fill="#475569">By impact + urgency</text>

  <line x1="458" y1="96" x2="486" y2="96" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="484,91 494,96 484,101" fill="#94A3B8"/>

  <!-- Routing -->
  <rect x="496" y="56" width="200" height="80" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="596" y="80" text-anchor="middle" font-size="14">📞</text>
  <text x="596" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Routed to right team</text>
  <text x="596" y="120" text-anchor="middle" font-size="9" fill="#64748B">Engineer for technical · CSM for account</text>

  <line x1="696" y1="96" x2="724" y2="96" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="722,91 732,96 722,101" fill="#94A3B8"/>

  <!-- Resolution -->
  <rect x="734" y="56" width="170" height="80" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="819" y="80" text-anchor="middle" font-size="14">✅</text>
  <text x="819" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#64748B">Resolved</text>
  <text x="819" y="120" text-anchor="middle" font-size="9" fill="#64748B">Per-severity target</text>

  <!-- Severity rows -->
  <text x="460" y="166" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">SEVERITY → SLA TARGETS</text>

  <rect x="20" y="178" width="884" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="40" y="200" font-size="14">🔴</text>
  <text x="65" y="198" font-size="11" font-weight="700" fill="#64748B">CRITICAL</text>
  <text x="160" y="198" font-size="9" fill="#64748B">Platform inaccessible · data loss risk · security breach</text>
  <text x="540" y="198" font-size="9" font-weight="700" fill="#64748B">First response: &lt; 1 hr · Resolution: &lt; 4 hr · 24/7/365</text>

  <rect x="20" y="222" width="884" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="40" y="244" font-size="14">🟠</text>
  <text x="65" y="242" font-size="11" font-weight="700" fill="#64748B">HIGH</text>
  <text x="160" y="242" font-size="9" fill="#B45309">Core feature broken with no workaround · scan failures</text>
  <text x="540" y="242" font-size="9" font-weight="700" fill="#64748B">First response: &lt; 4 hr · Resolution: &lt; 24 hr · business hours</text>

  <rect x="20" y="266" width="884" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="40" y="288" font-size="14">🟡</text>
  <text x="65" y="286" font-size="11" font-weight="700" fill="#713F12">MEDIUM</text>
  <text x="160" y="286" font-size="9" fill="#854D0E">Feature degraded · workaround exists</text>
  <text x="540" y="286" font-size="9" font-weight="700" fill="#713F12">First response: &lt; 24 hr · Resolution: &lt; 5 biz days · biz hours</text>

  <rect x="20" y="310" width="884" height="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="40" y="332" font-size="14">🟢</text>
  <text x="65" y="330" font-size="11" font-weight="700" fill="#64748B">LOW</text>
  <text x="160" y="330" font-size="9" fill="#64748B">Questions · doc requests · feature suggestions</text>
  <text x="540" y="330" font-size="9" font-weight="700" fill="#64748B">First response: &lt; 72 hr · Resolution: &lt; 14 biz days · biz hours</text>
</svg>
