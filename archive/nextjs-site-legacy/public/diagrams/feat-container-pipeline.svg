<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="Arial, sans-serif">
  <rect width="920" height="430" fill="#F8FAFC" rx="10"/>
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">CONTAINER &amp; KUBERNETES SECURITY CHECK — FROM CLUSTER DISCOVERY TO RISK FINDINGS</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Col 1: DISCOVERY -->
  <rect x="16" y="48" width="262" height="354" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="147" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">1. DISCOVERY</text>
  <text x="147" y="82" text-anchor="middle" font-size="8" fill="#64748B">Read cluster state via API</text>
  <line x1="26" y1="90" x2="268" y2="90" stroke="#CBD5E1" stroke-width="1"/>

  <rect x="32" y="106" width="230" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="147" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">K8s API Server</text>
  <text x="147" y="142" text-anchor="middle" font-size="8" fill="#64748B">Read-only kubeconfig / IRSA</text>
  <text x="147" y="156" text-anchor="middle" font-size="8" fill="#64748B">No agents on nodes</text>

  <rect x="32" y="174" width="230" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="147" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Cluster Inventory</text>
  <text x="147" y="212" text-anchor="middle" font-size="8" fill="#64748B">Pods · Deployments · Services</text>
  <text x="147" y="226" text-anchor="middle" font-size="8" fill="#64748B">Roles · RoleBindings</text>
  <text x="147" y="240" text-anchor="middle" font-size="8" fill="#64748B">NetworkPolicies · Namespaces</text>
  <text x="147" y="254" text-anchor="middle" font-size="8" fill="#64748B">ConfigMaps · Secrets (refs only)</text>
  <text x="147" y="268" text-anchor="middle" font-size="8" fill="#64748B">Nodes · Container images</text>

  <rect x="32" y="284" width="230" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="147" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Image Registry</text>
  <text x="147" y="320" text-anchor="middle" font-size="8" fill="#64748B">ECR · ACR · GCR · GHCR</text>
  <text x="147" y="334" text-anchor="middle" font-size="8" fill="#64748B">Docker Hub · OCIR</text>

  <text x="147" y="372" text-anchor="middle" font-size="8" fill="#64748B">Single read-only cred</text>
  <text x="147" y="386" text-anchor="middle" font-size="8" fill="#64748B">per cluster — no agents</text>

  <line x1="278" y1="225" x2="306" y2="225" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="304,220 314,225 304,230" fill="#94A3B8"/>

  <!-- Col 2: EVALUATION -->
  <rect x="316" y="48" width="288" height="354" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="460" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#3730A3" letter-spacing="1">2. EVALUATION</text>
  <text x="460" y="82" text-anchor="middle" font-size="8" fill="#64748B">Apply rule catalogs</text>
  <line x1="326" y1="90" x2="594" y2="90" stroke="#94A3B8" stroke-width="1"/>

  <rect x="332" y="106" width="256" height="76" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="460" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">CIS Kubernetes Benchmark</text>
  <text x="460" y="146" text-anchor="middle" font-size="9" fill="#C7D2FE">v1.8 — 112 controls across</text>
  <text x="460" y="160" text-anchor="middle" font-size="9" fill="#C7D2FE">control plane, etcd, nodes,</text>
  <text x="460" y="174" text-anchor="middle" font-size="9" fill="#C7D2FE">policies, managed-K8s</text>

  <rect x="332" y="192" width="256" height="76" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="460" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#3730A3">NSA / CISA Hardening</text>
  <text x="460" y="232" text-anchor="middle" font-size="9" fill="#475569">Pod security · authentication</text>
  <text x="460" y="246" text-anchor="middle" font-size="9" fill="#475569">network · supply-chain · audit</text>
  <text x="460" y="260" text-anchor="middle" font-size="9" fill="#475569">2024 guidance edition</text>

  <rect x="332" y="278" width="256" height="76" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="460" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#3730A3">Custom Rules</text>
  <text x="460" y="318" text-anchor="middle" font-size="9" fill="#475569">YAML rules you define</text>
  <text x="460" y="332" text-anchor="middle" font-size="9" fill="#475569">for org-specific policies</text>
  <text x="460" y="346" text-anchor="middle" font-size="9" fill="#475569">composable with built-ins</text>

  <text x="460" y="386" text-anchor="middle" font-size="8" fill="#64748B">Rules update with platform releases</text>

  <line x1="604" y1="225" x2="632" y2="225" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="630,220 640,225 630,230" fill="#94A3B8"/>

  <!-- Col 3: FINDINGS -->
  <rect x="642" y="48" width="262" height="354" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="773" y="68" text-anchor="middle" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">3. FINDINGS</text>
  <text x="773" y="82" text-anchor="middle" font-size="8" fill="#64748B">Categorized output</text>
  <line x1="652" y1="90" x2="894" y2="90" stroke="#94A3B8" stroke-width="1"/>

  <rect x="658" y="106" width="230" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <circle cx="678" cy="125" r="6" fill="#EF4444"/>
  <text x="773" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">RBAC Findings</text>
  <text x="773" y="142" text-anchor="middle" font-size="9" fill="#475569">over-privileged service accounts</text>
  <text x="773" y="156" text-anchor="middle" font-size="9" fill="#475569">cluster-admin bindings</text>

  <rect x="658" y="174" width="230" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <circle cx="678" cy="193" r="6" fill="#EF4444"/>
  <text x="773" y="193" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">Workload Findings</text>
  <text x="773" y="210" text-anchor="middle" font-size="9" fill="#475569">privileged pods</text>
  <text x="773" y="224" text-anchor="middle" font-size="9" fill="#475569">missing resource limits</text>

  <rect x="658" y="242" width="230" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <circle cx="678" cy="261" r="6" fill="#F59E0B"/>
  <text x="773" y="261" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">Network Findings</text>
  <text x="773" y="278" text-anchor="middle" font-size="9" fill="#475569">no network policies</text>
  <text x="773" y="292" text-anchor="middle" font-size="9" fill="#475569">exposed services</text>

  <rect x="658" y="310" width="230" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <circle cx="678" cy="329" r="6" fill="#F59E0B"/>
  <text x="773" y="329" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">Image Findings</text>
  <text x="773" y="346" text-anchor="middle" font-size="9" fill="#475569">CVEs in image · secrets in layers</text>
  <text x="773" y="360" text-anchor="middle" font-size="9" fill="#475569">unsigned images in production</text>

  <text x="773" y="390" text-anchor="middle" font-size="8" fill="#64748B">CIS-mapped · severity-graded</text>
</svg>
