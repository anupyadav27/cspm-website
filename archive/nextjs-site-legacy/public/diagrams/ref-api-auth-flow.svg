<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" font-family="Arial, sans-serif">
  <rect width="920" height="280" fill="#F8FAFC" rx="10"/>
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">API AUTHENTICATION FLOW — FROM LOGIN TO TENANT-SCOPED API CALL</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <!-- 4 actor lanes -->
  <text x="115" y="58" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">API CLIENT</text>
  <line x1="115" y1="68" x2="115" y2="244" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="345" y="58" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">PLATFORM AUTH</text>
  <line x1="345" y1="68" x2="345" y2="244" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="575" y="58" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">API GATEWAY</text>
  <line x1="575" y1="68" x2="575" y2="244" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="805" y="58" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">SECURITY ENGINE</text>
  <line x1="805" y1="68" x2="805" y2="244" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Step 1: login -->
  <line x1="115" y1="84" x2="345" y2="84" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="343,79 353,84 343,89" fill="#94A3B8"/>
  <rect x="135" y="70" width="190" height="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="3"/>
  <text x="230" y="82" text-anchor="middle" font-size="9" fill="#1E40AF">1. POST /api/auth/login</text>

  <!-- Step 2: token -->
  <line x1="345" y1="114" x2="115" y2="114" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="117,109 107,114 117,119" fill="#94A3B8"/>
  <rect x="135" y="100" width="190" height="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="3"/>
  <text x="230" y="112" text-anchor="middle" font-size="9" fill="#64748B">2. Set-Cookie: access_token (signed)</text>

  <!-- Step 3: API call -->
  <line x1="115" y1="144" x2="575" y2="144" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="573,139 583,144 573,149" fill="#94A3B8"/>
  <rect x="265" y="130" width="220" height="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="3"/>
  <text x="375" y="142" text-anchor="middle" font-size="9" fill="#1E40AF">3. GET /gateway/api/v1/... + token cookie</text>

  <!-- Step 4: validate (within gateway) -->
  <rect x="455" y="160" width="240" height="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="3"/>
  <text x="575" y="172" text-anchor="middle" font-size="9" fill="#3730A3">4. Validate token · build AuthContext (tenant_id, role)</text>

  <!-- Step 5: forward to engine -->
  <line x1="575" y1="194" x2="805" y2="194" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="803,189 813,194 803,199" fill="#94A3B8"/>
  <rect x="595" y="180" width="190" height="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="3"/>
  <text x="690" y="192" text-anchor="middle" font-size="9" fill="#1E40AF">5. Forward + X-Auth-Context</text>

  <!-- Step 6: response -->
  <line x1="805" y1="224" x2="115" y2="224" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="117,219 107,224 117,229" fill="#94A3B8"/>
  <rect x="380" y="210" width="280" height="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="3"/>
  <text x="520" y="222" text-anchor="middle" font-size="9" fill="#64748B">6. Engine validates permission · returns scoped response</text>

  <!-- Footer -->
  <line x1="40" y1="252" x2="880" y2="252" stroke="#94A3B8" stroke-width="1"/>
  <text x="460" y="270" text-anchor="middle" font-size="8" fill="#64748B">Token is signed and tenant-scoped — engines never trust client-supplied identity. Permission is checked at the engine layer (require_permission), not just at the gateway.</text>
</svg>
