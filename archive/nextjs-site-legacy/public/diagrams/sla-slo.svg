<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="Arial, sans-serif">
  <!-- Canvas -->
  <rect width="920" height="440" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" rx="10"/>

  <!-- Title -->
  <text x="460" y="20" text-anchor="middle" fill="#4F46E5" font-size="9" font-weight="700" letter-spacing="1.2">SERVICE LEVEL AGREEMENT AND OBJECTIVES</text>
  <line x1="20" y1="28" x2="900" y2="28" stroke="#94A3B8" stroke-width="1"/>

  <!-- ===== SLA SECTION ===== -->
  <text x="28" y="50" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="700">SLA — CONTRACTUALLY COMMITTED</text>

  <!-- SLA Header -->
  <rect x="20" y="56" width="880" height="32" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="175" y="77" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Metric</text>
  <text x="400" y="77" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Commitment</text>
  <text x="600" y="77" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Measurement Window</text>
  <text x="800" y="77" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Remedy</text>

  <!-- SLA Row 1 (even) -->
  <rect x="20" y="88" width="880" height="34" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="109" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">Platform Availability</text>
  <text x="400" y="109" text-anchor="middle" fill="#64748B" font-size="9">99.9% / month</text>
  <text x="600" y="109" text-anchor="middle" fill="#64748B" font-size="9">Calendar month</text>
  <text x="800" y="109" text-anchor="middle" fill="#64748B" font-size="9">10% credit per 0.1% below</text>
  <line x1="20" y1="122" x2="900" y2="122" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- SLA Row 2 (odd) -->
  <rect x="20" y="122" width="880" height="34" fill="#F8FAFC"/>
  <text x="28" y="143" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">API Response Time (p95)</text>
  <text x="400" y="143" text-anchor="middle" fill="#64748B" font-size="9">&lt; 2 seconds</text>
  <text x="600" y="143" text-anchor="middle" fill="#64748B" font-size="9">Rolling 24h</text>
  <text x="800" y="143" text-anchor="middle" fill="#64748B" font-size="9">Service credit if sustained</text>
  <line x1="20" y1="156" x2="900" y2="156" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- SLA Row 3 (even) -->
  <rect x="20" y="156" width="880" height="34" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="177" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">Scan Completion</text>
  <text x="400" y="177" text-anchor="middle" fill="#64748B" font-size="9">&lt; 4 hours (standard)</text>
  <text x="600" y="177" text-anchor="middle" fill="#64748B" font-size="9">Per scan run</text>
  <text x="800" y="177" text-anchor="middle" fill="#64748B" font-size="9">Credit if exceeded</text>
  <line x1="20" y1="190" x2="900" y2="190" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- SLA Row 4 (odd) -->
  <rect x="20" y="190" width="880" height="34" fill="#F8FAFC"/>
  <text x="28" y="211" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">Incident Notification</text>
  <text x="400" y="211" text-anchor="middle" fill="#64748B" font-size="9">&lt; 30 minutes</text>
  <text x="600" y="211" text-anchor="middle" fill="#64748B" font-size="9">Per severity P1/P2</text>
  <text x="800" y="211" text-anchor="middle" fill="#64748B" font-size="9">Credit if exceeded</text>
  <line x1="20" y1="224" x2="900" y2="224" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- SLA Row 5 (even) -->
  <rect x="20" y="224" width="880" height="34" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="245" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">Data Durability</text>
  <text x="400" y="245" text-anchor="middle" fill="#64748B" font-size="9">99.999%</text>
  <text x="600" y="245" text-anchor="middle" fill="#64748B" font-size="9">Annual</text>
  <text x="800" y="245" text-anchor="middle" fill="#64748B" font-size="9">Full credit for data loss</text>
  <line x1="20" y1="258" x2="900" y2="258" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- SLA Table border -->
  <rect x="20" y="56" width="880" height="202" fill="none" stroke="#CBD5E1" stroke-width="1" rx="4"/>
  <line x1="320" y1="56" x2="320" y2="258" stroke="#94A3B8" stroke-width="0.5"/>
  <line x1="500" y1="56" x2="500" y2="258" stroke="#94A3B8" stroke-width="0.5"/>
  <line x1="700" y1="56" x2="700" y2="258" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- ===== SLO SECTION ===== -->
  <text x="28" y="280" text-anchor="start" fill="#64748B" font-size="9" font-weight="700">SLO — INTERNAL TARGETS (PUBLISHED FOR TRANSPARENCY)</text>

  <!-- SLO Header -->
  <rect x="20" y="286" width="880" height="32" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="175" y="307" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Metric</text>
  <text x="420" y="307" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Target</text>
  <text x="630" y="307" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Current (last 30d)</text>
  <text x="820" y="307" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Status</text>

  <!-- SLO Row 1 (even) -->
  <rect x="20" y="318" width="880" height="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="338" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">API p50 latency</text>
  <text x="420" y="338" text-anchor="middle" fill="#64748B" font-size="9">&lt; 300ms</text>
  <text x="630" y="338" text-anchor="middle" fill="#64748B" font-size="9">187ms</text>
  <rect x="776" y="323" width="88" height="18" fill="#FFFFFF" rx="3" stroke="#CBD5E1" stroke-width="1"/>
  <text x="820" y="336" text-anchor="middle" fill="#166534" font-size="9" font-weight="600">ON TARGET</text>
  <line x1="20" y1="350" x2="900" y2="350" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- SLO Row 2 (odd) -->
  <rect x="20" y="350" width="880" height="32" fill="#F8FAFC"/>
  <text x="28" y="370" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">Scan pipeline success rate</text>
  <text x="420" y="370" text-anchor="middle" fill="#64748B" font-size="9">&gt; 99%</text>
  <text x="630" y="370" text-anchor="middle" fill="#64748B" font-size="9">99.4%</text>
  <rect x="776" y="355" width="88" height="18" fill="#FFFFFF" rx="3" stroke="#CBD5E1" stroke-width="1"/>
  <text x="820" y="368" text-anchor="middle" fill="#166534" font-size="9" font-weight="600">ON TARGET</text>
  <line x1="20" y1="382" x2="900" y2="382" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- SLO Row 3 (even) -->
  <rect x="20" y="382" width="880" height="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="28" y="402" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">Finding delivery delay</text>
  <text x="420" y="402" text-anchor="middle" fill="#64748B" font-size="9">&lt; 5 min</text>
  <text x="630" y="402" text-anchor="middle" fill="#64748B" font-size="9">2.1 min</text>
  <rect x="776" y="387" width="88" height="18" fill="#FFFFFF" rx="3" stroke="#CBD5E1" stroke-width="1"/>
  <text x="820" y="400" text-anchor="middle" fill="#166534" font-size="9" font-weight="600">ON TARGET</text>
  <line x1="20" y1="414" x2="900" y2="414" stroke="#94A3B8" stroke-width="0.5"/>

  <!-- Bottom bar (SLO rows 4&5 collapsed into footer for space) -->
  <!-- SLO Row 4 metrics in footer -->
  <rect x="20" y="414" width="880" height="20" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="460" y="428" text-anchor="middle" fill="#64748B" font-size="8" font-weight="600">Status page: status.onam.io · Neo4j graph &lt;8min (current 5.3min) · BFF view &lt;500ms (current 310ms) · Incidents posted in real time · Uptime published monthly</text>

  <!-- SLO Table border -->
  <rect x="20" y="286" width="880" height="128" fill="none" stroke="#CBD5E1" stroke-width="1" rx="4"/>
  <line x1="320" y1="286" x2="320" y2="414" stroke="#94A3B8" stroke-width="0.5"/>
  <line x1="540" y1="286" x2="540" y2="414" stroke="#94A3B8" stroke-width="0.5"/>
  <line x1="740" y1="286" x2="740" y2="414" stroke="#94A3B8" stroke-width="0.5"/>
</svg>
