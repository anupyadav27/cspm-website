<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 36 920 424" width="920" height="424" font-family="Arial, sans-serif">
  <rect width="920" height="424" fill="#F8FAFC" rx="10"/>

  <!-- header -->
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">DEPLOYMENT ARCHITECTURE — EKS · ARGO WORKFLOWS · RDS · NEO4J</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <!-- ── INTERNET / USERS ── -->
  <rect x="340" y="42" width="240" height="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="460" y="62" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Users / CI-CD / API Clients</text>
  <line x1="460" y1="72" x2="460" y2="86" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="454,84 460,94 466,84" fill="#94A3B8"/>

  <!-- ── EKS CLUSTER OUTER BOX ── -->
  <rect x="16" y="94" width="888" height="280" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" rx="10"/>
  <text x="24" y="112" font-size="8" font-weight="700" fill="#2563EB" letter-spacing="1.2">EKS CLUSTER — threat-engine-engines namespace</text>

  <!-- Load Balancer -->
  <rect x="310" y="118" width="300" height="36" fill="#FFFFFF" rx="6" stroke="#CBD5E1" stroke-width="1"/>
  <text x="460" y="138" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">AWS ALB — Ingress / Load Balancer</text>
  <line x1="460" y1="154" x2="460" y2="166" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="454,164 460,174 466,164" fill="#94A3B8"/>

  <!-- API Gateway -->
  <rect x="310" y="174" width="300" height="36" fill="#FFFFFF" rx="6" stroke="#CBD5E1" stroke-width="1"/>
  <text x="460" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">API Gateway  :8000</text>
  <text x="460" y="204" text-anchor="middle" font-size="8" fill="#64748B">Auth · RBAC · BFF Views · Routing</text>

  <!-- fan-out to engines -->
  <line x1="460" y1="210" x2="460" y2="224" stroke="#94A3B8" stroke-width="2"/>

  <!-- ── Engine Services Grid ── -->
  <rect x="28" y="224" width="864" height="112" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="36" y="240" font-size="8" font-weight="700" fill="#1E40AF" letter-spacing="1">ENGINE MICROSERVICES</text>

  <rect x="38"  y="246" width="90" height="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="4"/>
  <text x="83"  y="264" text-anchor="middle" font-size="8" fill="#1E3A8A">Onboarding</text>
  <text x="83"  y="273" text-anchor="middle" font-size="7" fill="#94A3B8">:8008</text>

  <rect x="134" y="246" width="90" height="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="4"/>
  <text x="179" y="264" text-anchor="middle" font-size="8" fill="#1E3A8A">Discovery</text>
  <text x="179" y="273" text-anchor="middle" font-size="7" fill="#94A3B8">:8001</text>

  <rect x="230" y="246" width="90" height="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="4"/>
  <text x="275" y="264" text-anchor="middle" font-size="8" fill="#1E3A8A">Inventory</text>
  <text x="275" y="273" text-anchor="middle" font-size="7" fill="#94A3B8">:8022</text>

  <rect x="326" y="246" width="90" height="30" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="371" y="264" text-anchor="middle" font-size="8" fill="#64748B">Check</text>
  <text x="371" y="273" text-anchor="middle" font-size="7" fill="#64748B">:8002</text>

  <rect x="422" y="246" width="90" height="30" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="467" y="264" text-anchor="middle" font-size="8" fill="#64748B">Threat</text>
  <text x="467" y="273" text-anchor="middle" font-size="7" fill="#64748B">:8020</text>

  <rect x="518" y="246" width="90" height="30" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="563" y="264" text-anchor="middle" font-size="8" fill="#64748B">Compliance</text>
  <text x="563" y="273" text-anchor="middle" font-size="7" fill="#64748B">:8000</text>

  <rect x="614" y="246" width="90" height="30" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="659" y="264" text-anchor="middle" font-size="8" fill="#64748B">IAM</text>
  <text x="659" y="273" text-anchor="middle" font-size="7" fill="#64748B">:8021</text>

  <rect x="710" y="246" width="90" height="30" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="755" y="264" text-anchor="middle" font-size="8" fill="#64748B">Network</text>
  <text x="755" y="273" text-anchor="middle" font-size="7" fill="#64748B">:8004</text>

  <rect x="806" y="246" width="78" height="30" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="845" y="264" text-anchor="middle" font-size="8" fill="#64748B">+ 11 more</text>
  <text x="845" y="273" text-anchor="middle" font-size="7" fill="#64748B">engines</text>

  <!-- Second row -->
  <rect x="38"  y="284" width="130" height="44" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="4"/>
  <text x="103" y="302" text-anchor="middle" font-size="8" font-weight="700" fill="#374151">Argo Workflows</text>
  <text x="103" y="316" text-anchor="middle" font-size="7" fill="#64748B">cspm-pipeline DAG</text>
  <text x="103" y="326" text-anchor="middle" font-size="7" fill="#64748B">Pipeline Worker</text>

  <rect x="178" y="284" width="130" height="44" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="4"/>
  <text x="243" y="302" text-anchor="middle" font-size="8" font-weight="700" fill="#374151">Django Backend</text>
  <text x="243" y="316" text-anchor="middle" font-size="7" fill="#64748B">Auth · SSO · Tenant CRUD</text>
  <text x="243" y="326" text-anchor="middle" font-size="7" fill="#64748B">Celery Worker :8080</text>

  <rect x="318" y="284" width="130" height="44" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="4"/>
  <text x="383" y="302" text-anchor="middle" font-size="8" font-weight="700" fill="#374151">Spot Scanners</text>
  <text x="383" y="316" text-anchor="middle" font-size="7" fill="#64748B">min=0 · max=20 nodes</text>
  <text x="383" y="326" text-anchor="middle" font-size="7" fill="#64748B">Scale-to-zero (cost)</text>

  <rect x="458" y="284" width="130" height="44" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="4"/>
  <text x="523" y="302" text-anchor="middle" font-size="8" font-weight="700" fill="#374151">Pipeline Monitor</text>
  <text x="523" y="316" text-anchor="middle" font-size="7" fill="#64748B">SSE streaming</text>
  <text x="523" y="326" text-anchor="middle" font-size="7" fill="#64748B">Real-time progress</text>

  <rect x="598" y="284" width="290" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="4"/>
  <text x="743" y="302" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B">Technology Engine (4 sub-services)</text>
  <text x="743" y="316" text-anchor="middle" font-size="7" fill="#64748B">tech-discovery :8030 · tech-inventory :8031</text>
  <text x="743" y="326" text-anchor="middle" font-size="7" fill="#64748B">tech-check :8032 · tech-ciem :8033</text>

  <!-- ── DATA LAYER ── -->
  <rect x="16" y="382" width="888" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="24" y="399" font-size="8" font-weight="700" fill="#059669" letter-spacing="1.2">DATA LAYER</text>

  <rect x="28" y="406" width="228" height="34" fill="#FFFFFF" rx="6" stroke="#CBD5E1" stroke-width="1"/>
  <text x="142" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">PostgreSQL RDS</text>
  <text x="142" y="434" text-anchor="middle" font-size="8" fill="#64748B">Per-engine databases · ap-south-1</text>

  <rect x="268" y="406" width="228" height="34" fill="#FFFFFF" rx="6" stroke="#CBD5E1" stroke-width="1"/>
  <text x="382" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Neo4j Aura</text>
  <text x="382" y="434" text-anchor="middle" font-size="8" fill="#64748B">Security graph · Attack paths · Managed</text>

  <rect x="508" y="406" width="190" height="34" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="603" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">Secrets Manager</text>
  <text x="603" y="434" text-anchor="middle" font-size="8" fill="#64748B">Cloud credentials · No plaintext</text>

  <rect x="710" y="406" width="186" height="34" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="6"/>
  <text x="803" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">Redis</text>
  <text x="803" y="434" text-anchor="middle" font-size="8" fill="#64748B">Celery broker · Task queue</text>
</svg>
