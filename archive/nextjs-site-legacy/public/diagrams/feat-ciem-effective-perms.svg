<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" font-family="Arial, sans-serif">
  <rect width="920" height="360" fill="#F8FAFC" rx="10"/>

  <!-- header -->
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">EFFECTIVE PERMISSIONS — WHAT AN IDENTITY CAN ACTUALLY DO</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <!-- ── LEFT: 5 SOURCES (stacked) ── -->
  <text x="160" y="58" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">5 PERMISSION SOURCES</text>
  <text x="160" y="72" text-anchor="middle" font-size="8" fill="#64748B">All applicable to this identity</text>

  <!-- source 1: identity-based -->
  <rect x="20" y="84" width="280" height="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="6"/>
  <text x="32" y="103" font-size="10" font-weight="700" fill="#1E40AF">Identity-based Policies</text>
  <text x="32" y="118" font-size="8" fill="#64748B">Attached directly to user, group, or role</text>

  <!-- source 2: resource-based -->
  <rect x="20" y="132" width="280" height="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="6"/>
  <text x="32" y="151" font-size="10" font-weight="700" fill="#1E40AF">Resource-based Policies</text>
  <text x="32" y="166" font-size="8" fill="#64748B">S3 bucket policy · KMS key policy · Lambda perms</text>

  <!-- source 3: SCP -->
  <rect x="20" y="180" width="280" height="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="6"/>
  <text x="32" y="199" font-size="10" font-weight="700" fill="#1E40AF">Service Control Policies (SCPs)</text>
  <text x="32" y="214" font-size="8" fill="#64748B">Org-level guardrails — can only restrict, never grant</text>

  <!-- source 4: permission boundaries -->
  <rect x="20" y="228" width="280" height="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="6"/>
  <text x="32" y="247" font-size="10" font-weight="700" fill="#1E40AF">Permission Boundaries</text>
  <text x="32" y="262" font-size="8" fill="#64748B">Maximum effective permissions for this identity</text>

  <!-- source 5: session policies -->
  <rect x="20" y="276" width="280" height="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="6"/>
  <text x="32" y="295" font-size="10" font-weight="700" fill="#1E40AF">Session Policies</text>
  <text x="32" y="310" font-size="8" fill="#64748B">STS AssumeRole conditions — per-session limits</text>

  <!-- ── ARROWS converging to center ── -->
  <line x1="300" y1="105" x2="412" y2="180" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="300" y1="153" x2="412" y2="180" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="300" y1="201" x2="412" y2="180" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="300" y1="249" x2="412" y2="180" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="300" y1="297" x2="412" y2="180" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- ── CENTER: INTERSECTION ── -->
  <rect x="412" y="120" width="220" height="120" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
  <text x="522" y="146" text-anchor="middle" font-size="9" font-weight="700" fill="#C7D2FE" letter-spacing="1">EFFECTIVE PERMISSION</text>
  <text x="522" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Intersection</text>
  <text x="522" y="192" text-anchor="middle" font-size="10" fill="#C7D2FE">of all applicable policies</text>
  <text x="522" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">+ Explicit Deny wins</text>
  <text x="522" y="230" text-anchor="middle" font-size="9" fill="#C7D2FE">always overrides any Allow</text>

  <!-- arrow center → right -->
  <line x1="632" y1="180" x2="664" y2="180" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="662,175 672,180 662,185" fill="#94A3B8"/>

  <!-- ── RIGHT: RESULT ── -->
  <rect x="674" y="84" width="226" height="234" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="787" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">RESULT</text>
  <line x1="684" y1="112" x2="890" y2="112" stroke="#94A3B8" stroke-width="1"/>

  <text x="787" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#64748B">What this identity</text>
  <text x="787" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#64748B">can actually call</text>

  <line x1="710" y1="170" x2="864" y2="170" stroke="#94A3B8" stroke-width="1"/>

  <text x="787" y="194" text-anchor="middle" font-size="9" fill="#475569">Different from "what's attached"</text>
  <text x="787" y="208" text-anchor="middle" font-size="9" fill="#475569">— the platform shows you the</text>
  <text x="787" y="222" text-anchor="middle" font-size="9" fill="#475569">truly callable set, not the</text>
  <text x="787" y="236" text-anchor="middle" font-size="9" fill="#475569">raw policy text.</text>

  <text x="787" y="266" text-anchor="middle" font-size="9" fill="#475569">Compared against actual usage</text>
  <text x="787" y="280" text-anchor="middle" font-size="9" fill="#475569">to compute the gap score and</text>
  <text x="787" y="294" text-anchor="middle" font-size="9" fill="#475569">generate suggested policies.</text>
</svg>
