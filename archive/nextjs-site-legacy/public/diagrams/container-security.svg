  <text x="402" y="266" text-anchor="middle" font-size="9"  fill="#64748B">Unpatched base images · No digest pinning</text>

  <rect x="282" y="278" width="240" height="56" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="402" y="302" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Network Policy Gaps</text>
  <text x="402" y="318" text-anchor="middle" font-size="9"  fill="#64748B">Namespaces with no ingress/egress policy</text>
  <text x="402" y="332" text-anchor="middle" font-size="9"  fill="#64748B">Default-allow posture across namespaces</text>

  <rect x="282" y="344" width="240" height="48" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="402" y="368" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF">250+ rules · CIS Kubernetes Benchmark</text>

