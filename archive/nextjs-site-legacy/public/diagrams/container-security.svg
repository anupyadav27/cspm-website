  <text x="656" y="120" text-anchor="middle" font-size="9"  fill="#64748B">cluster-admin wildcard bind</text>
  <rect x="742" y="80"  width="148" height="56" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="816" y="104" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">High</text>
  <text x="816" y="120" text-anchor="middle" font-size="9"  fill="#64748B">Privileged pod on node</text>

  <rect x="582" y="146" width="148" height="56" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="656" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Medium</text>
  <text x="656" y="186" text-anchor="middle" font-size="9"  fill="#FEF08A">No network policy set</text>
  <rect x="742" y="146" width="148" height="56" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="816" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Low</text>
  <text x="816" y="186" text-anchor="middle" font-size="9"  fill="#64748B">Missing resource limits</text>

  <!-- outcome boxes -->
  <rect x="582" y="216" width="308" height="52" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="736" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Attack Path Detection</text>
  <text x="736" y="256" text-anchor="middle" font-size="9"  fill="#64748B">RBAC escalation → cloud credential access → data exfil</text>

  <rect x="582" y="278" width="308" height="52" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="736" y="302" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Compliance Mapping</text>
  <text x="736" y="318" text-anchor="middle" font-size="9"  fill="#64748B">CIS K8s Benchmark · NSA/CISA K8s Hardening Guide</text>

  <rect x="582" y="340" width="308" height="52" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="736" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Remediation Guidance</text>
  <text x="736" y="380" text-anchor="middle" font-size="9"  fill="#64748B">Kubectl commands · YAML patches · Policy templates</text>
