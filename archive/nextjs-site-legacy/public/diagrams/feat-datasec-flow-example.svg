<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" font-family="Arial, sans-serif">
  <rect width="920" height="360" fill="#F8FAFC" rx="10"/>

  <!-- header -->
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">DATA FLOW ANALYSIS — TRACING PII FROM PRODUCTION DB TO DOWNSTREAM EXPOSURE</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Source label -->
  <text x="120" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">SOURCE</text>

  <!-- Source: Production RDS (secure but spreads) -->
  <rect x="22" y="140" width="196" height="84" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Production RDS</text>
  <text x="120" y="184" text-anchor="middle" font-size="9" fill="#64748B">Encrypted at rest</text>
  <text x="120" y="198" text-anchor="middle" font-size="9" fill="#64748B">VPC-only access</text>
  <text x="120" y="214" text-anchor="middle" font-size="9" font-weight="700" fill="#1E3A8A">Contains: PII</text>

  <!-- Downstream column header -->
  <text x="600" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">DOWNSTREAM TARGETS — PLATFORM TRACES EACH ONE</text>

  <!-- Branch 1: Staging S3 (PUBLIC - red) -->
  <line x1="218" y1="160" x2="320" y2="100" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="318,98 326,100 320,107" fill="#94A3B8"/>
  <text x="265" y="118" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B">ETL pipeline</text>

  <rect x="328" y="76" width="278" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="345" y="100" font-size="14">⚠️</text>
  <text x="370" y="98" font-size="11" font-weight="700" fill="#64748B">Staging S3 bucket</text>
  <text x="370" y="116" font-size="9" fill="#64748B">PUBLIC · no encryption · no logging</text>
  <text x="370" y="129" font-size="9" font-weight="700" fill="#64748B">CRITICAL — PII exposed to internet</text>

  <!-- Branch 2: Backup S3 (orange) -->
  <line x1="218" y1="180" x2="320" y2="180" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="318,175 328,180 318,185" fill="#94A3B8"/>
  <text x="265" y="172" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B">Backup job</text>

  <rect x="328" y="156" width="278" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="345" y="180" font-size="14">▲</text>
  <text x="370" y="178" font-size="11" font-weight="700" fill="#64748B">S3 backup bucket</text>
  <text x="370" y="196" font-size="9" fill="#B45309">No lifecycle policy · stale data 18+ months</text>
  <text x="370" y="209" font-size="9" font-weight="700" fill="#64748B">HIGH — retention violation</text>

  <!-- Branch 3: Redshift (yellow) -->
  <line x1="218" y1="200" x2="320" y2="260" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="318,253 326,260 320,265" fill="#94A3B8"/>
  <text x="265" y="240" text-anchor="middle" font-size="8" font-weight="700" fill="#713F12">Analytics export</text>

  <rect x="328" y="236" width="278" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="345" y="260" font-size="14">·</text>
  <text x="370" y="258" font-size="11" font-weight="700" fill="#713F12">Redshift Data Warehouse</text>
  <text x="370" y="276" font-size="9" fill="#854D0E">Broad read access · 47 users · weak access logs</text>
  <text x="370" y="289" font-size="9" font-weight="700" fill="#713F12">MEDIUM — over-privileged access</text>

  <!-- arrow Redshift → BI -->
  <line x1="606" y1="265" x2="660" y2="265" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="658,260 668,265 658,270" fill="#94A3B8"/>
  <text x="633" y="258" text-anchor="middle" font-size="8" font-weight="700" fill="#713F12">BI tool</text>

  <!-- BI Tool (yellow) -->
  <rect x="668" y="236" width="232" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="685" y="260" font-size="14">·</text>
  <text x="710" y="258" font-size="11" font-weight="700" fill="#713F12">Tableau / Power BI</text>
  <text x="710" y="276" font-size="9" fill="#854D0E">External viewer accounts · no MFA</text>
  <text x="710" y="289" font-size="9" font-weight="700" fill="#713F12">MEDIUM — external exposure</text>

  <!-- Footer explanation -->
  <line x1="40" y1="312" x2="880" y2="312" stroke="#94A3B8" stroke-width="1"/>
  <text x="460" y="332" text-anchor="middle" font-size="9" fill="#64748B">A misconfiguration downstream from a secure source is flagged automatically. Even though the production RDS is encrypted and locked-down,</text>
  <text x="460" y="346" text-anchor="middle" font-size="9" fill="#64748B">the platform follows every data pipeline and surfaces the weakest link — here, three downstream gaps from a single secure source.</text>
</svg>
