<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="Arial, sans-serif">
  <!-- Canvas -->
  <rect width="920" height="440" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" rx="10"/>

  <!-- Title -->
  <text x="460" y="20" text-anchor="middle" fill="#4F46E5" font-size="9" font-weight="700" letter-spacing="1.2">REST API — AUTHENTICATION AND ENDPOINT STRUCTURE</text>
  <line x1="20" y1="28" x2="900" y2="28" stroke="#94A3B8" stroke-width="1"/>

  <!-- ===== COL 1: Auth Flow ===== -->
  <!-- Header -->
  <rect x="20" y="36" width="270" height="36" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="155" y="59" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Authentication</text>

  <!-- Box 1: API Key -->
  <rect x="20" y="76" width="270" height="70" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="155" y="97" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">API Key</text>
  <text x="155" y="114" text-anchor="middle" fill="#64748B" font-size="9">Authorization: Bearer &lt;key&gt;</text>
  <text x="155" y="130" text-anchor="middle" fill="#3B82F6" font-size="8">Obtain from Settings → API Keys</text>

  <!-- Arrow down -->
  <line x1="155" y1="146" x2="155" y2="158" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="150,156 160,156 155,163" fill="#94A3B8"/>

  <!-- Box 2: Session Token -->
  <rect x="20" y="162" width="270" height="70" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="155" y="183" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Session Token</text>
  <text x="155" y="200" text-anchor="middle" fill="#64748B" font-size="9">POST /api/v1/auth/token</text>
  <text x="155" y="216" text-anchor="middle" fill="#64748B" font-size="8">24h expiry · Refresh supported</text>

  <!-- Arrow down -->
  <line x1="155" y1="232" x2="155" y2="244" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="150,242 160,242 155,249" fill="#94A3B8"/>

  <!-- Box 3: RBAC -->
  <rect x="20" y="248" width="270" height="70" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="155" y="269" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">RBAC Enforced</text>
  <text x="155" y="286" text-anchor="middle" fill="#64748B" font-size="9">5 roles: viewer → platform_admin</text>
  <text x="155" y="302" text-anchor="middle" fill="#3B82F6" font-size="8">27 permissions · 403 on mismatch</text>

  <!-- Rate limit note -->
  <rect x="20" y="330" width="270" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="155" y="348" text-anchor="middle" fill="#475569" font-size="9" font-weight="600">Rate Limiting</text>
  <text x="155" y="364" text-anchor="middle" fill="#64748B" font-size="8">1,000 req/min per API key · Headers: X-RateLimit-*</text>

  <!-- ===== COL 2: Engine Endpoints ===== -->
  <!-- Header -->
  <rect x="310" y="36" width="290" height="36" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="455" y="59" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Engine Endpoints</text>

  <!-- Row 1: discoveries -->
  <rect x="310" y="76" width="290" height="55" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5" rx="0"/>
  <text x="318" y="99" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">/api/v1/discoveries/*</text>
  <text x="318" y="116" text-anchor="start" fill="#64748B" font-size="9">Cloud resource enumeration</text>

  <!-- Row 2: check -->
  <rect x="310" y="131" width="290" height="55" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5" rx="0"/>
  <text x="318" y="154" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">/api/v1/check/*</text>
  <text x="318" y="171" text-anchor="start" fill="#64748B" font-size="9">Rule evaluation · PASS/FAIL findings</text>

  <!-- Row 3: threat -->
  <rect x="310" y="186" width="290" height="55" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5" rx="0"/>
  <text x="318" y="209" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">/api/v1/threat/*</text>
  <text x="318" y="226" text-anchor="start" fill="#64748B" font-size="9">MITRE ATT&amp;CK findings · Attack paths</text>

  <!-- Row 4: compliance -->
  <rect x="310" y="241" width="290" height="55" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5" rx="0"/>
  <text x="318" y="264" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">/api/v1/compliance/*</text>
  <text x="318" y="281" text-anchor="start" fill="#64748B" font-size="9">Framework scores · Control mapping</text>

  <!-- Row 5: iam -->
  <rect x="310" y="296" width="290" height="55" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5" rx="0"/>
  <text x="318" y="319" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">/api/v1/iam/*</text>
  <text x="318" y="336" text-anchor="start" fill="#64748B" font-size="9">IAM posture · Policy analysis</text>

  <!-- Row 6: views -->
  <rect x="310" y="351" width="290" height="55" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5" rx="0"/>
  <text x="318" y="374" text-anchor="start" fill="#1E3A8A" font-size="10" font-weight="600">/api/v1/views/*</text>
  <text x="318" y="391" text-anchor="start" fill="#64748B" font-size="9">BFF aggregated views for UI</text>

  <!-- Border around endpoint rows -->
  <rect x="310" y="76" width="290" height="330" fill="none" stroke="#CBD5E1" stroke-width="1" rx="4"/>

  <!-- ===== COL 3: Response Format ===== -->
  <!-- Header -->
  <rect x="620" y="36" width="280" height="36" fill="#FFFFFF" rx="4" stroke="#CBD5E1" stroke-width="1"/>
  <text x="760" y="59" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">Response Format</text>

  <!-- Pagination box -->
  <rect x="620" y="76" width="280" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="760" y="97" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Pagination</text>
  <text x="760" y="116" text-anchor="middle" fill="#64748B" font-size="9">?page=1&amp;page_size=50</text>
  <text x="760" y="133" text-anchor="middle" fill="#64748B" font-size="9">X-Total-Count header</text>
  <text x="760" y="150" text-anchor="middle" fill="#3B82F6" font-size="8">Links: next/prev in body</text>

  <!-- Error format box -->
  <rect x="620" y="186" width="280" height="90" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <text x="760" y="207" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Error Format</text>
  <text x="760" y="226" text-anchor="middle" fill="#64748B" font-size="9">{ "error": "string",</text>
  <text x="760" y="243" text-anchor="middle" fill="#64748B" font-size="9">"code": 403, "detail": "..." }</text>

  <!-- Versioning + Base URL box -->
  <rect x="620" y="286" width="280" height="90" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="760" y="307" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Versioning + Base URL</text>
  <text x="760" y="326" text-anchor="middle" fill="#64748B" font-size="9">/api/v1/ prefix all engines</text>
  <text x="760" y="343" text-anchor="middle" fill="#64748B" font-size="9">Gateway: port 80 (ELB)</text>
  <text x="760" y="360" text-anchor="middle" fill="#64748B" font-size="8">OpenAPI docs at /docs</text>

  <!-- Footer -->
  <text x="460" y="430" text-anchor="middle" fill="#94A3B8" font-size="8">All engines enforce RBAC · require_permission() on every endpoint · Bearer token or API key</text>
</svg>
