  <text x="678" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">Customer notify</text>
  <text x="678" y="140" text-anchor="middle" font-size="8" fill="#B45309">Within 72 hours</text>
  <text x="678" y="154" text-anchor="middle" font-size="8" fill="#B45309">if data affected</text>
  <text x="678" y="168" text-anchor="middle" font-size="8" fill="#B45309">GDPR Article 33</text>

  <line x1="758" y1="124" x2="786" y2="124" stroke="#94A3B8" stroke-width="2"/>
