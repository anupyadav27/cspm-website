  <text x="480" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">Response</text>
  <text x="480" y="140" text-anchor="middle" font-size="8" fill="#64748B">CRITICAL: assembled</text>
  <text x="480" y="154" text-anchor="middle" font-size="8" fill="#64748B">HIGH: 4-hour response</text>
  <text x="480" y="168" text-anchor="middle" font-size="8" fill="#64748B">MEDIUM: 24-hour response</text>

