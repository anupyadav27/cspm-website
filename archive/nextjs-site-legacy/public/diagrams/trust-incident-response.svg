  <text x="100" y="140" text-anchor="middle" font-size="8" fill="#64748B">24/7 monitoring</text>
  <text x="100" y="154" text-anchor="middle" font-size="8" fill="#64748B">SIEM correlation</text>
  <text x="100" y="168" text-anchor="middle" font-size="8" fill="#64748B">Customer report</text>

