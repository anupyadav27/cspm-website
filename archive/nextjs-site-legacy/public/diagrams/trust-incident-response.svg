  <text x="848" y="154" text-anchor="middle" font-size="8" fill="#64748B">Remediation</text>
  <text x="848" y="168" text-anchor="middle" font-size="8" fill="#64748B">Affected customers</text>

  <line x1="40" y1="200" x2="880" y2="200" stroke="#94A3B8" stroke-width="1"/>
  <text x="460" y="220" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">REPORT A SECURITY ISSUE</text>
  <text x="460" y="238" text-anchor="middle" font-size="9" fill="#64748B">security@onam.io · responsible disclosure policy + bug bounty program · GPG public key on the website</text>
  <text x="460" y="254" text-anchor="middle" font-size="9" fill="#64748B">Customer-impacting incidents reported within 72 hours of confirmation — GDPR Article 33 compliant</text>
  <text x="460" y="270" text-anchor="middle" font-size="9" fill="#64748B">Post-incident reviews shared with affected customers including root cause analysis and prevention measures</text>
