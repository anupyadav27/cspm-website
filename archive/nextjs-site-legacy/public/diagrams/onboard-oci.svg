<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" font-family="Arial, sans-serif">
  <!-- Canvas -->
  <rect width="920" height="320" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" rx="10"/>

  <!-- Title -->
  <text x="460" y="20" text-anchor="middle" fill="#4F46E5" font-size="9" font-weight="700" letter-spacing="1.2">CONNECT OCI — API SIGNING KEY</text>
  <line x1="20" y1="28" x2="900" y2="28" stroke="#94A3B8" stroke-width="1"/>

  <!-- Panel 1: Create IAM User -->
  <rect x="20" y="40" width="190" height="240" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <rect x="28" y="48" width="22" height="18" fill="#FFFFFF" rx="3" stroke="#CBD5E1" stroke-width="1"/>
  <text x="39" y="61" text-anchor="middle" fill="#1E3A8A" font-size="8" font-weight="700">01</text>
  <text x="115" y="86" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Create IAM User</text>
  <text x="115" y="106" text-anchor="middle" fill="#64748B" font-size="9">OCI Console → Identity</text>
  <text x="115" y="122" text-anchor="middle" fill="#64748B" font-size="9">Users → Create User</text>
  <text x="115" y="138" text-anchor="middle" fill="#64748B" font-size="9">Name: onam-cspm-reader</text>
  <text x="115" y="154" text-anchor="middle" fill="#3B82F6" font-size="8">Add to Readers group</text>
  <text x="115" y="170" text-anchor="middle" fill="#3B82F6" font-size="8">Note user OCID</text>

  <!-- Arrow 1->2 -->
  <line x1="210" y1="160" x2="228" y2="160" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="226,155 235,160 226,165" fill="#94A3B8"/>

  <!-- Panel 2: Grant Read Access -->
  <rect x="235" y="40" width="190" height="240" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="8"/>
  <rect x="243" y="48" width="22" height="18" fill="#FFFFFF" rx="3" stroke="#CBD5E1" stroke-width="1"/>
  <text x="254" y="61" text-anchor="middle" fill="#1E3A8A" font-size="8" font-weight="700">02</text>
  <text x="330" y="86" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Grant Read Access</text>
  <text x="330" y="106" text-anchor="middle" fill="#64748B" font-size="9">Add user to group</text>
  <text x="330" y="122" text-anchor="middle" fill="#64748B" font-size="9">Attach policy: Allow group</text>
  <text x="330" y="138" text-anchor="middle" fill="#64748B" font-size="9">to read all-resources</text>
  <text x="330" y="154" text-anchor="middle" fill="#3B82F6" font-size="8">in tenancy</text>
  <text x="330" y="170" text-anchor="middle" fill="#3B82F6" font-size="8">Read-only OCI policy</text>

  <!-- Arrow 2->3 -->
  <line x1="425" y1="160" x2="443" y2="160" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="441,155 450,160 441,165" fill="#94A3B8"/>

  <!-- Panel 3: Generate API Key -->
  <rect x="450" y="40" width="190" height="240" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="458" y="48" width="22" height="18" fill="#FFFFFF" rx="3" stroke="#CBD5E1" stroke-width="1"/>
  <text x="469" y="61" text-anchor="middle" fill="#1E3A8A" font-size="8" font-weight="700">03</text>
  <text x="545" y="86" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Generate API Key</text>
  <text x="545" y="106" text-anchor="middle" fill="#64748B" font-size="9">User profile → API Keys</text>
  <text x="545" y="122" text-anchor="middle" fill="#64748B" font-size="9">Add API Key → Generate</text>
  <text x="545" y="138" text-anchor="middle" fill="#64748B" font-size="9">Download private key PEM</text>
  <text x="545" y="154" text-anchor="middle" fill="#64748B" font-size="9">Note fingerprint</text>
  <text x="545" y="170" text-anchor="middle" fill="#64748B" font-size="8">Enter details in Onam</text>

  <!-- Arrow 3->4 (green) -->
  <line x1="640" y1="160" x2="658" y2="160" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="656,155 665,160 656,165" fill="#94A3B8"/>

  <!-- Panel 4: Scan Running -->
  <rect x="665" y="40" width="235" height="240" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="673" y="48" width="22" height="18" fill="#FFFFFF" rx="3" stroke="#CBD5E1" stroke-width="1"/>
  <text x="684" y="61" text-anchor="middle" fill="#1E3A8A" font-size="8" font-weight="700">✓</text>
  <text x="782" y="86" text-anchor="middle" fill="#1E3A8A" font-size="11" font-weight="700">Scan Running</text>
  <text x="782" y="106" text-anchor="middle" fill="#64748B" font-size="9">OCI tenancy scanned</text>
  <text x="782" y="122" text-anchor="middle" fill="#64748B" font-size="9">Compute · Networking</text>
  <text x="782" y="138" text-anchor="middle" fill="#64748B" font-size="9">Object Storage · IAM</text>
  <text x="782" y="154" text-anchor="middle" fill="#64748B" font-size="9">Results in dashboard</text>

  <!-- Step labels -->
  <text x="115" y="298" text-anchor="middle" fill="#64748B" font-size="8">Step 1</text>
  <text x="330" y="298" text-anchor="middle" fill="#64748B" font-size="8">Step 2</text>
  <text x="545" y="298" text-anchor="middle" fill="#64748B" font-size="8">Step 3</text>
  <text x="782" y="298" text-anchor="middle" fill="#64748B" font-size="8">Complete</text>
</svg>
