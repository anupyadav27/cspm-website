<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" font-family="Arial, sans-serif">
  <rect width="920" height="360" fill="#F8FAFC" rx="10"/>
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">VULNERABILITY RISK PRIORITIZATION — FOUR SIGNALS COMBINE INTO ONE EFFECTIVE RISK SCORE</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <text x="160" y="58" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">FOUR INPUT SIGNALS</text>

  <!-- 4 signal cards -->
  <rect x="20" y="74" width="280" height="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="6"/>
  <text x="36" y="94" font-size="10" font-weight="700" fill="#1E40AF">CVSS v3.1 Base Score</text>
  <text x="36" y="110" font-size="9" fill="#64748B">0–10 — published severity from NVD</text>

  <rect x="20" y="132" width="280" height="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="6"/>
  <text x="36" y="152" font-size="10" font-weight="700" fill="#1E40AF">EPSS Score</text>
  <text x="36" y="168" font-size="9" fill="#64748B">0–100% — exploitation probability in 30 days</text>

  <rect x="20" y="190" width="280" height="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="6"/>
  <text x="36" y="210" font-size="10" font-weight="700" fill="#1E40AF">CISA KEV</text>
  <text x="36" y="226" font-size="9" fill="#64748B">Yes / No — exploited in the wild today?</text>

  <rect x="20" y="248" width="280" height="50" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="6"/>
  <text x="36" y="268" font-size="10" font-weight="700" fill="#1E40AF">Network Exposure</text>
  <text x="36" y="284" font-size="9" fill="#64748B">Internet-facing? Internal? Air-gapped?</text>

  <text x="160" y="324" text-anchor="middle" font-size="8" fill="#64748B">Refreshed daily from NVD, FIRST.org, CISA</text>

  <!-- arrows converging -->
  <line x1="300" y1="100" x2="412" y2="180" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="300" y1="158" x2="412" y2="180" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="300" y1="216" x2="412" y2="180" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="300" y1="274" x2="412" y2="180" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- formula box -->
  <rect x="412" y="120" width="220" height="120" fill="#FFFFFF" rx="10" stroke="#CBD5E1" stroke-width="1"/>
  <text x="522" y="146" text-anchor="middle" font-size="9" font-weight="700" fill="#C7D2FE" letter-spacing="1">EFFECTIVE RISK SCORE</text>
  <line x1="430" y1="156" x2="614" y2="156" stroke="#94A3B8" stroke-width="1"/>
  <text x="522" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">CVSS × EPSS_w</text>
  <text x="522" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">× KEV_mult</text>
  <text x="522" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">× Exposure_w</text>

  <line x1="632" y1="180" x2="664" y2="180" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="662,175 672,180 662,185" fill="#94A3B8"/>

  <!-- result -->
  <rect x="674" y="84" width="226" height="206" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10"/>
  <text x="787" y="104" text-anchor="middle" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">RESULT</text>
  <line x1="684" y1="112" x2="890" y2="112" stroke="#94A3B8" stroke-width="1"/>
  <text x="787" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#64748B">0 – 100</text>
  <text x="787" y="156" text-anchor="middle" font-size="9" fill="#475569">Effective Risk Score</text>
  <text x="787" y="170" text-anchor="middle" font-size="9" fill="#475569">per vulnerability finding</text>
  <line x1="710" y1="184" x2="864" y2="184" stroke="#94A3B8" stroke-width="1"/>
  <text x="787" y="206" text-anchor="middle" font-size="9" fill="#64748B">Higher = patch first</text>
  <text x="787" y="224" text-anchor="middle" font-size="9" fill="#475569">A KEV-listed CVE in a public-facing</text>
  <text x="787" y="238" text-anchor="middle" font-size="9" fill="#475569">workload outranks an "internet</text>
  <text x="787" y="252" text-anchor="middle" font-size="9" fill="#475569">CRITICAL" CVSS that's never</text>
  <text x="787" y="266" text-anchor="middle" font-size="9" fill="#475569">been observed exploited.</text>
  <text x="787" y="284" text-anchor="middle" font-size="8" fill="#94A3B8">Sortable / filterable / exportable</text>
</svg>
