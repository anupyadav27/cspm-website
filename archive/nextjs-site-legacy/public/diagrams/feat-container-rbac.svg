<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" font-family="Arial, sans-serif">
  <rect width="920" height="360" fill="#F8FAFC" rx="10"/>
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">KUBERNETES RBAC ANALYSIS — TRACING SERVICE ACCOUNTS TO EFFECTIVE PERMISSIONS</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <!-- chain row -->
  <text x="105" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">SUBJECT</text>
  <text x="305" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">BINDING</text>
  <text x="505" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">ROLE</text>
  <text x="715" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">EFFECTIVE PERMISSIONS</text>

  <rect x="22" y="74" width="166" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="105" y="94" text-anchor="middle" font-size="14">👤</text>
  <text x="105" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Service Account</text>
  <text x="105" y="128" text-anchor="middle" font-size="9" fill="#64748B">attached to pod</text>

  <line x1="190" y1="104" x2="220" y2="104" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="218,99 228,104 218,109" fill="#94A3B8"/>

  <rect x="222" y="74" width="166" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="305" y="94" text-anchor="middle" font-size="14">🔗</text>
  <text x="305" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">RoleBinding</text>
  <text x="305" y="128" text-anchor="middle" font-size="9" fill="#64748B">or ClusterRoleBinding</text>

  <line x1="390" y1="104" x2="420" y2="104" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="418,99 428,104 418,109" fill="#94A3B8"/>

  <rect x="422" y="74" width="166" height="60" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="505" y="94" text-anchor="middle" font-size="14">📜</text>
  <text x="505" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Role / ClusterRole</text>
  <text x="505" y="128" text-anchor="middle" font-size="9" fill="#64748B">named permission set</text>

  <line x1="590" y1="104" x2="620" y2="104" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="618,99 628,104 618,109" fill="#94A3B8"/>

  <rect x="622" y="74" width="186" height="60" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="715" y="94" text-anchor="middle" font-size="14">⚡</text>
  <text x="715" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">verbs × resources</text>
  <text x="715" y="128" text-anchor="middle" font-size="9" fill="#C7D2FE">× apiGroups</text>

  <text x="850" y="104" text-anchor="middle" font-size="8" fill="#64748B">Computed</text>
  <text x="850" y="116" text-anchor="middle" font-size="8" fill="#64748B">per identity</text>

  <!-- divider -->
  <line x1="40" y1="156" x2="880" y2="156" stroke="#94A3B8" stroke-width="1"/>

  <!-- High-risk patterns row -->
  <text x="460" y="180" text-anchor="middle" font-size="9" font-weight="700" fill="#64748B" letter-spacing="1">PATTERNS THE PLATFORM FLAGS</text>

  <rect x="20" y="194" width="280" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="32" y="216" font-size="14">⚠️</text>
  <text x="58" y="214" font-size="10" font-weight="700" fill="#64748B">cluster-admin to service account</text>
  <text x="58" y="228" font-size="9" fill="#64748B">Bound to pod-runner SAs in production</text>
  <text x="58" y="240" font-size="9" fill="#64748B">→ pod compromise = cluster takeover</text>
  <text x="58" y="252" font-size="8" fill="#64748B">CRITICAL</text>

  <rect x="310" y="194" width="280" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="322" y="216" font-size="14">⚠️</text>
  <text x="348" y="214" font-size="10" font-weight="700" fill="#64748B">Wildcard verbs on sensitive resources</text>
  <text x="348" y="228" font-size="9" fill="#64748B">verbs: ["*"] on secrets / pods / clusterroles</text>
  <text x="348" y="240" font-size="9" fill="#64748B">→ secret read + arbitrary exec</text>
  <text x="348" y="252" font-size="8" fill="#64748B">HIGH</text>

  <rect x="600" y="194" width="280" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="612" y="216" font-size="14">⚠️</text>
  <text x="638" y="214" font-size="10" font-weight="700" fill="#64748B">exec / attach in production</text>
  <text x="638" y="228" font-size="9" fill="#64748B">pods/exec or pods/attach permissions</text>
  <text x="638" y="240" font-size="9" fill="#64748B">→ shell into running pods</text>
  <text x="638" y="252" font-size="8" fill="#64748B">HIGH</text>

  <rect x="20" y="266" width="430" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="32" y="288" font-size="14">▲</text>
  <text x="58" y="286" font-size="10" font-weight="700" fill="#64748B">Unused service accounts with broad permissions</text>
  <text x="58" y="300" font-size="9" fill="#B45309">SA has cluster-wide perms but no pod has used them in 90 days</text>
  <text x="58" y="312" font-size="9" fill="#B45309">→ shrink the entitlement footprint or remove the SA</text>
  <text x="58" y="324" font-size="8" fill="#64748B">MEDIUM</text>

  <rect x="460" y="266" width="420" height="64" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="472" y="288" font-size="14">▲</text>
  <text x="498" y="286" font-size="10" font-weight="700" fill="#64748B">Default service account with non-default bindings</text>
  <text x="498" y="300" font-size="9" fill="#B45309">"default" SA bound to anything beyond default cluster role</text>
  <text x="498" y="312" font-size="9" fill="#B45309">→ pods inherit broader access than intended</text>
  <text x="498" y="324" font-size="8" fill="#64748B">MEDIUM</text>
</svg>
