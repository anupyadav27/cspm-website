<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" font-family="Arial, sans-serif">
  <rect width="920" height="280" fill="#F8FAFC" rx="10"/>
  <text x="460" y="26" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1.2">JIRA AUTO-CREATE FLOW — FROM CRITICAL FINDING TO TRACKED ISSUE WITH BIDIRECTIONAL SYNC</text>
  <line x1="16" y1="34" x2="904" y2="34" stroke="#CBD5E1" stroke-width="1"/>

  <text x="100" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">FINDING</text>
  <text x="290" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">FILTER</text>
  <text x="480" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">JIRA ISSUE</text>
  <text x="670" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">REMEDIATION</text>
  <text x="840" y="58" text-anchor="middle" font-size="8" font-weight="700" fill="#64748B" letter-spacing="1">CLOSE</text>

  <rect x="20" y="74" width="160" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="100" y="100" text-anchor="middle" font-size="14">⚠️</text>
  <text x="100" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">Critical finding</text>
  <text x="100" y="140" text-anchor="middle" font-size="8" fill="#64748B">e.g. S3 bucket public</text>
  <text x="100" y="154" text-anchor="middle" font-size="8" fill="#64748B">access not blocked</text>
  <text x="100" y="168" text-anchor="middle" font-size="8" fill="#64748B">with PII inside</text>

  <line x1="180" y1="124" x2="208" y2="124" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="206,119 216,124 206,129" fill="#94A3B8"/>

  <rect x="218" y="74" width="144" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="290" y="100" text-anchor="middle" font-size="14">🔍</text>
  <text x="290" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Auto-create rule</text>
  <text x="290" y="140" text-anchor="middle" font-size="8" fill="#64748B">CRITICAL only</text>
  <text x="290" y="154" text-anchor="middle" font-size="8" fill="#64748B">CRITICAL+HIGH</text>
  <text x="290" y="168" text-anchor="middle" font-size="8" fill="#64748B">or all findings</text>

  <line x1="362" y1="124" x2="390" y2="124" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="388,119 398,124 388,129" fill="#94A3B8"/>

  <rect x="400" y="74" width="160" height="100" fill="#FFFFFF" rx="8" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="100" text-anchor="middle" font-size="14">🎫</text>
  <text x="480" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A8A">Jira issue created</text>
  <text x="480" y="140" text-anchor="middle" font-size="8" fill="#64748B">Summary · Description</text>
  <text x="480" y="154" text-anchor="middle" font-size="8" fill="#64748B">Priority · Labels</text>
  <text x="480" y="168" text-anchor="middle" font-size="8" fill="#64748B">Onam deep-link</text>

  <line x1="560" y1="124" x2="588" y2="124" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="586,119 596,124 586,129" fill="#94A3B8"/>

  <rect x="598" y="74" width="160" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="678" y="100" text-anchor="middle" font-size="14">🛠️</text>
  <text x="678" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">Team remediates</text>
  <text x="678" y="140" text-anchor="middle" font-size="8" fill="#64748B">Standard Jira workflow</text>
  <text x="678" y="154" text-anchor="middle" font-size="8" fill="#64748B">Move to Done when</text>
  <text x="678" y="168" text-anchor="middle" font-size="8" fill="#64748B">cloud config is fixed</text>

  <line x1="758" y1="124" x2="786" y2="124" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="784,119 794,124 784,129" fill="#94A3B8"/>

  <rect x="796" y="74" width="104" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8"/>
  <text x="848" y="100" text-anchor="middle" font-size="14">✅</text>
  <text x="848" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#64748B">Auto-close</text>
  <text x="848" y="140" text-anchor="middle" font-size="8" fill="#64748B">Next scan</text>
  <text x="848" y="154" text-anchor="middle" font-size="8" fill="#64748B">verifies fix</text>
  <text x="848" y="168" text-anchor="middle" font-size="8" fill="#64748B">finding closes</text>

  <!-- Bidirectional sync arrow back -->
  <path d="M 678 174 Q 678 200 480 200 Q 100 200 100 174" stroke="#94A3B8" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <polygon points="105,170 100,180 95,170" fill="#94A3B8"/>
  <text x="389" y="220" text-anchor="middle" font-size="8" fill="#64748B">Resolving the Jira issue → acknowledges the finding in Onam · re-opening the Jira issue → re-opens the finding</text>

  <text x="460" y="252" text-anchor="middle" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="1">FIELDS POPULATED AUTOMATICALLY</text>
  <text x="460" y="268" text-anchor="middle" font-size="9" fill="#64748B">Summary · Description · Priority (mapped from severity) · Labels (cspm, cloud-security, provider) · Onam deep-link to drill into the finding</text>
</svg>
