# Service account for the marketing site pod, bound to a least-privilege IAM
# role via IRSA (the cluster already has an OIDC provider registered).
#
# WHY: /request-demo and /company/contact validated input, showed a success
# message, and discarded the submission — no fetch, no backend. Every lead
# since launch was silently lost. The pod now needs to write leads to S3 and
# send a notification, which requires an identity.
#
# The role grants exactly two things and nothing else:
#   ses:SendEmail      on identity/onamsecurity.com only
#   s3:PutObject       on onam-platform-588989875114/leads/* only
# No read, no delete, no wildcard. A compromise of the web pod cannot read
# stored leads back, only append.
#
# Deliberately NOT reusing the existing broad `engine-sa`
# (threat-engine-platform-role) — a public-facing web pod should not carry
# platform-wide permissions.
#
# APPLY:
#   kubectl apply -f deploy/lead-capture-serviceaccount.yaml
#   kubectl patch deployment cspm-docs-website -n threat-engine-engines \
#     -p '{"spec":{"template":{"spec":{"serviceAccountName":"cspm-docs-website-sa"}}}}'
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cspm-docs-website-sa
  namespace: threat-engine-engines
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::588989875114:role/onam-website-lead-capture
